<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cycling</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
:root {
  --bg: #fff4e8; --bg-2: #ffe9d4; --card: #fffaf4; --ink: #2b1a10; --dim: #7a5f4e; --muted: #9a806e; --line: #f1d9c2; --grid: #f3e3d3;
  --orange: #fa960a; --orange-ink: #a35d00; --mark: #d47300; --mark-soft: #f6c88f; --sun: #ffc53d; --berry: #e8435f;
  --good: #1f7a4d; --bad: #b3261e;
  --shadow: 0 1px 0 rgba(120,60,20,.06), 0 18px 40px -18px rgba(150,70,20,.35);
  --f-display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b120c; --bg-2: #24170f; --card: #2a1b12; --ink: #fbeee2; --dim: #c2a28c; --muted: #a08470; --line: #3d2a1d; --grid: #3a281b;
    --orange-ink: #fa960a; --mark: #fa960a; --mark-soft: #7a4a1c; --good: #5fd39a; --bad: #ff8a80;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 22px 44px -20px rgba(0,0,0,.7); color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 8px; }
.wrap { width: min(1100px, 100%); margin: 0 auto; padding: 28px 16px 72px; }
.crumb { font-size: 14px; color: var(--dim); font-weight: 600; text-decoration: none; }
.crumb:hover { color: var(--ink); }
header.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; margin: 6px 0 22px; }
h1 { font-family: var(--f-display); font-weight: 800; letter-spacing: -0.04em; line-height: .95; font-size: clamp(40px, 8vw, 68px); margin: 0; }
h1 em { font-style: normal; color: var(--orange); }
.sync { font-size: 14px; color: var(--dim); display: flex; align-items: center; gap: 10px; }
.btn { font: 700 15px var(--f-body); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: var(--orange); color: #2b1a10; }
.btn:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 7px 14px; font-size: 14px; }
.btn.ghost:hover { background: var(--bg-2); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; }
h2 { font-family: var(--f-display); font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
.sub { color: var(--dim); font-size: 14px; margin: 0 0 14px; }
section { margin-top: 18px; }

/* log form */
form.log { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) auto; gap: 10px; align-items: end; }
form.log label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--dim); min-width: 0; }
form.log label.route { grid-column: span 2; }
form.log input { font: 500 16px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; width: 100%; min-width: 0; }
form.log input:focus { outline: 2px solid var(--orange); outline-offset: 0; border-color: transparent; }
form.log .hint { font-weight: 500; color: var(--muted); }
.formmsg { margin: 10px 0 0; font-size: 14px; min-height: 1.4em; }
.formmsg.ok { color: var(--good); } .formmsg.err { color: var(--bad); }
@media (max-width: 900px) {
  form.log { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  form.log label.route { grid-column: span 2; }
  form.log .btn { grid-column: span 2; }
}

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.kpi .l { font-size: 13px; font-weight: 700; color: var(--dim); }
.kpi .v { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 15px; font-weight: 700; color: var(--dim); margin-left: 3px; letter-spacing: 0; }
.kpi .d { font-size: 13px; color: var(--dim); margin-top: 2px; }
.kpi .d b.up { color: var(--good); } .kpi .d b.down { color: var(--bad); }

/* records */
.records { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.rec { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); }
.rec .medal { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: color-mix(in srgb, var(--sun) 35%, var(--card)); }
.rec .l { font-size: 13px; color: var(--dim); font-weight: 700; }
.rec .v { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.rec .w { font-size: 12.5px; color: var(--muted); }

/* charts */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font: 500 11px var(--f-body); fill: var(--muted); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--line); stroke-width: 1.5; }
.chart .bar { fill: var(--mark); }
.chart .bar.zero { fill: var(--grid); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart g.on .bar { fill: var(--orange-ink); }
.chart .dot { fill: var(--mark-soft); stroke: var(--card); stroke-width: 2; }
.chart .trend { fill: none; stroke: var(--mark); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .cross { stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hl { fill: var(--mark); stroke: var(--card); stroke-width: 2; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--dim); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .sw-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mark-soft); }
.legend .sw-line { width: 18px; height: 3px; border-radius: 2px; background: var(--mark); }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.35; padding: 7px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s; }
.tip b { font-weight: 700; }
.tip.show { opacity: 1; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th.t, td.t { text-align: left; }
thead th { font-size: 12.5px; color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
thead th:hover { color: var(--ink); }
thead th[aria-sort]::after { content: " ▾"; } thead th[aria-sort=ascending]::after { content: " ▴"; }
tbody tr + tr td { border-top: 1px solid var(--grid); }
tbody tr:hover td { background: color-mix(in srgb, var(--orange) 7%, transparent); }
td .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--sun) 40%, var(--card)); margin-left: 6px; }
.more { margin-top: 10px; }

/* states */
.state { text-align: center; padding: 48px 20px; color: var(--dim); }
.state h2 { color: var(--ink); }
.skel { height: 120px; border-radius: 18px; background: linear-gradient(90deg, var(--bg-2), var(--card), var(--bg-2)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .toast, .tip { transition: none; } }
</style>
</head>
<body>
<script src="/nav.js"></script>
<main class="wrap">
  <a class="crumb" href="/private/">← My space</a>
  <header class="head">
    <h1>Cycling <em>log</em></h1>
    <div class="sync"><span id="syncText">Loading your rides…</span><button class="btn ghost" id="reload" type="button">Refresh</button></div>
  </header>

  <section class="card" aria-labelledby="logH">
    <h2 id="logH">Log a ride</h2>
    <p class="sub">Saves a new row in your Cycling sheet, then updates this page.</p>
    <form class="log" id="logForm" novalidate>
      <label>Date<input type="date" name="date" required></label>
      <label><span>Distance <span class="hint">mi</span></span><input type="number" name="distance" step="0.1" min="0" inputmode="decimal" placeholder="10.4" required></label>
      <label><span>Time <span class="hint">h:mm:ss</span></span><input type="text" name="time" inputmode="numeric" placeholder="0:45:30" pattern="\d{1,2}:\d{2}:\d{2}"></label>
      <label><span>Avg speed <span class="hint">mph</span></span><input type="number" name="speed" step="0.1" min="0" inputmode="decimal" placeholder="auto"></label>
      <label>Calories<input type="number" name="cal" step="1" min="0" inputmode="numeric" placeholder="1450"></label>
      <label><span>Temp <span class="hint">°C</span></span><input type="number" name="temp" step="0.1" inputmode="decimal" placeholder="9.5"></label>
      <label class="route">Route<input type="text" name="route" list="routes" placeholder="Crwst+EoHuts" maxlength="80"></label>
      <button class="btn" type="submit" id="saveBtn">Save ride</button>
      <datalist id="routes"></datalist>
    </form>
    <p class="formmsg" id="formMsg" role="status" aria-live="polite"></p>
  </section>

  <div id="out"><section><div class="skel"></div></section></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const API = '/private/api/rides';
const $ = (s, el = document) => el.querySelector(s);
const out = $('#out');
let rides = [];

/* ---------- parsing ---------- */
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : null; };
const parseDate = s => { const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? new Date(+m[3], +m[2] - 1, +m[1], 12) : null; };
const parseTime = s => { const m = String(s).trim().match(/^(\d{1,2}):(\d{2}):(\d{2})$/); return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : null; };
function normalise(raw) {
  return raw.map(r => {
    const d = parseDate(r.date), dist = num(r.distance), secs = parseTime(r.time);
    let speed = num(r.speed);
    if (speed == null && dist && secs) speed = dist / (secs / 3600);
    return { d, dist, secs, speed, cal: num(r.cal), temp: num(r.temp), route: String(r.route || '').trim() || '—', rawDate: r.date };
  }).filter(r => r.d && r.dist != null).sort((a, b) => a.d - b.d);
}

/* ---------- formatting ---------- */
const f1 = n => n == null ? '—' : n.toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f0 = n => n == null ? '—' : Math.round(n).toLocaleString('en-GB');
const dur = s => { if (s == null) return '—'; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = Math.round(s % 60); return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m ${String(ss).padStart(2, '0')}s`; };
const clock = s => { if (s == null) return '—'; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = Math.round(s % 60); return `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; };
const dShort = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dLong = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthName = k => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }); };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- stats ---------- */
function aggregate(list) {
  const timed = list.filter(r => r.secs);
  const miles = list.reduce((a, r) => a + r.dist, 0);
  const tMiles = timed.reduce((a, r) => a + r.dist, 0), tSecs = timed.reduce((a, r) => a + r.secs, 0);
  const cals = list.filter(r => r.cal != null);
  return {
    n: list.length, miles, secs: tSecs, speed: tSecs ? tMiles / (tSecs / 3600) : null,
    cal: cals.reduce((a, r) => a + r.cal, 0), calN: cals.length,
    best: list.reduce((b, r) => (r.speed != null && (!b || r.speed > b.speed)) ? r : b, null),
    long: list.reduce((b, r) => (!b || r.dist > b.dist) ? r : b, null),
  };
}
const groupBy = (list, key) => list.reduce((m, r) => { const k = key(r); (m.get(k) || m.set(k, []).get(k)).push(r); return m; }, new Map());
const maxBy = (list, f) => list.reduce((b, r) => (f(r) != null && (!b || f(r) > f(b))) ? r : b, null);
const minBy = (list, f) => list.reduce((b, r) => (f(r) != null && (!b || f(r) < f(b))) ? r : b, null);

/* ---------- render ---------- */
function render() {
  if (!rides.length) { out.innerHTML = `<section class="card state"><h2>No rides yet</h2><p>Log your first ride above.</p></section>`; return; }
  const all = aggregate(rides);
  const now = new Date();
  const thisM = monthKey(now), lastM = monthKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  const byMonth = groupBy(rides, r => monthKey(r.d));
  const mThis = aggregate(byMonth.get(thisM) || []), mLast = aggregate(byMonth.get(lastM) || []);
  const mPace = aggregate((byMonth.get(lastM) || []).filter(r => r.d.getDate() <= now.getDate()));
  const wk = weekStart(now).getTime();
  const wThis = aggregate(rides.filter(r => weekStart(r.d).getTime() === wk));
  const delta = (a, b, unit) => { if (!b) return ''; const p = (a - b) / b * 100; return ` · <b class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</b> vs ${unit}`; };

  // weekly series (last 26 weeks incl. empty weeks)
  const byWeek = groupBy(rides, r => weekStart(r.d).getTime());
  const weeks = [];
  for (let i = 25; i >= 0; i--) { const s = new Date(wk); s.setDate(s.getDate() - 7 * i); const l = byWeek.get(s.getTime()) || []; weeks.push({ s, miles: l.reduce((a, r) => a + r.dist, 0), n: l.length }); }
  const allWeeks = [...byWeek.entries()].map(([t, l]) => ({ s: new Date(+t), miles: l.reduce((a, r) => a + r.dist, 0), n: l.length }));
  const bestWeek = maxBy(allWeeks, w => w.miles);
  const months = [...byMonth.entries()].map(([k, l]) => ({ k, ...aggregate(l) })).sort((a, b) => b.k.localeCompare(a.k));
  const bestMonth = maxBy(months, m => m.miles);
  const routes = [...groupBy(rides, r => r.route).entries()].map(([name, l]) => ({ name, ...aggregate(l), last: l[l.length - 1].d, quickest: minBy(l.filter(r => r.secs), r => r.secs) }));

  const recs = [
    ['📏', 'Longest ride', `${f1(all.long.dist)} mi`, all.long],
    ['⚡', 'Fastest average', `${f1(all.best?.speed)} mph`, all.best],
    ['⏱️', 'Longest time', dur(maxBy(rides, r => r.secs)?.secs), maxBy(rides, r => r.secs)],
    ['🔥', 'Most calories', `${f0(maxBy(rides, r => r.cal)?.cal)} kcal`, maxBy(rides, r => r.cal)],
    ['🥶', 'Coldest ride', `${f1(minBy(rides, r => r.temp)?.temp)} °C`, minBy(rides, r => r.temp)],
    ['📅', 'Biggest week', `${f1(bestWeek.miles)} mi`, null, `${bestWeek.n} rides · w/c ${dLong(bestWeek.s)}`],
    ['🏆', 'Biggest month', `${f1(bestMonth.miles)} mi`, null, `${bestMonth.n} rides · ${monthName(bestMonth.k)}`],
  ];

  out.innerHTML = `
  <section aria-label="Totals"><div class="kpis">
    <div class="kpi"><div class="l">Total distance</div><div class="v">${f1(all.miles)}<small>mi</small></div><div class="d">${all.n} rides since ${dShort(rides[0].d)} ${rides[0].d.getFullYear()}</div></div>
    <div class="kpi"><div class="l">This month</div><div class="v">${f1(mThis.miles)}<small>mi</small></div><div class="d">${mThis.n} rides${delta(mThis.miles, mPace.miles, 'this point last month')}</div></div>
    <div class="kpi"><div class="l">This week</div><div class="v">${f1(wThis.miles)}<small>mi</small></div><div class="d">${wThis.n} ride${wThis.n === 1 ? '' : 's'}</div></div>
    <div class="kpi"><div class="l">Time in the saddle</div><div class="v">${(all.secs / 3600).toFixed(1)}<small>h</small></div><div class="d">on timed rides</div></div>
    <div class="kpi"><div class="l">Average speed</div><div class="v">${f1(all.speed)}<small>mph</small></div><div class="d">overall, timed rides</div></div>
    <div class="kpi"><div class="l">Average ride</div><div class="v">${f1(all.miles / all.n)}<small>mi</small></div><div class="d">${all.secs ? dur(all.secs / rides.filter(r => r.secs).length) + ' typical time' : ''}</div></div>
    <div class="kpi"><div class="l">Calories</div><div class="v">${f0(all.cal / 1000)}<small>k kcal</small></div><div class="d">${f0(all.cal / (all.calN || 1))} per ride</div></div>
  </div></section>

  <section class="card" aria-labelledby="recH">
    <h2 id="recH">Records</h2><p class="sub">Your personal bests across every logged ride.</p>
    <div class="records">${recs.map(([m, l, v, r, w]) => `<div class="rec"><span class="medal" aria-hidden="true">${m}</span><div><div class="l">${l}</div><div class="v">${v}</div><div class="w">${w || (r ? `${dLong(r.d)} · ${esc(r.route)}` : '')}</div></div></div>`).join('')}</div>
  </section>

  <section class="two">
    <div class="card"><h2>Miles per week</h2><p class="sub">Last 26 weeks, Monday to Sunday.</p><div class="chart" id="cWeek"></div></div>
    <div class="card"><h2>Average speed</h2><p class="sub">Each timed ride, with a 5-ride rolling average.</p><div class="chart" id="cSpeed"></div>
      <div class="legend"><span><i class="sw-dot"></i>Ride</span><span><i class="sw-line"></i>5-ride average</span></div></div>
  </section>

  <section class="card"><h2>By month</h2><p class="sub">Click a column to sort.</p><div class="tbl-wrap">${table('months', ['Month', 'Rides', 'Miles', 'Time', 'Avg mph', 'Longest', 'kcal'],
    months.map(m => [[monthName(m.k), m.k], [m.n], [f1(m.miles), m.miles], [m.secs ? dur(m.secs) : '—', m.secs], [f1(m.speed), m.speed ?? -1], [f1(m.long.dist), m.long.dist], [m.calN ? f0(m.cal) : '—', m.cal]]))}</div></section>

  <section class="card"><h2>By route</h2><p class="sub">Every route you've logged, most-ridden first.</p><div class="tbl-wrap">${table('routes', ['Route', 'Rides', 'Miles', 'Avg mph', 'Best mph', 'Quickest', 'Last ridden'],
    routes.sort((a, b) => b.n - a.n || b.miles - a.miles).map(r => [[esc(r.name), r.name], [r.n], [f1(r.miles), r.miles], [f1(r.speed), r.speed ?? -1], [f1(r.best?.speed), r.best?.speed ?? -1], [r.quickest ? clock(r.quickest.secs) : '—', r.quickest?.secs ?? 1e9], [dLong(r.last), +r.last]]))}</div></section>

  <section class="card"><h2>Rides</h2><p class="sub">Newest first. <span class="pill" style="margin:0">PB</span> marks a record-setting ride.</p><div class="tbl-wrap" id="rideTbl"></div>
    <button class="btn ghost more" id="moreBtn" type="button"></button></section>`;

  barChart($('#cWeek'), weeks);
  speedChart($('#cSpeed'), rides.filter(r => r.speed != null));
  rideTable(false, recs);
  out.querySelectorAll('table[data-sort]').forEach(sortable);
  $('#routes').innerHTML = routes.map(r => `<option value="${esc(r.name)}">`).join('');
}

function table(id, heads, rows) {
  return `<table data-sort="${id}"><thead><tr>${heads.map((h, i) => `<th scope="col" class="${i ? '' : 't'}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? '' : 't'}" data-v="${esc(c[1] ?? c[0])}">${c[0]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function sortable(t) {
  t.querySelectorAll('th').forEach((th, i) => th.addEventListener('click', () => {
    const asc = th.getAttribute('aria-sort') === 'descending';
    t.querySelectorAll('th').forEach(x => x.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
    const rows = [...t.tBodies[0].rows];
    const val = r => { const v = r.cells[i].dataset.v; const n = parseFloat(v); return isNaN(n) || /^\d{4}-\d{2}$/.test(v) ? v : n; };
    rows.sort((a, b) => { const x = val(a), y = val(b); const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y)); return asc ? c : -c; });
    rows.forEach(r => t.tBodies[0].appendChild(r));
  }));
}
function rideTable(showAll) {
  const pbs = new Set(), seen = { dist: -1, speed: -1 };
  rides.forEach(r => { if (r.dist > seen.dist) { seen.dist = r.dist; pbs.add(r); } if (r.speed != null && r.speed > seen.speed) { seen.speed = r.speed; pbs.add(r); } });
  const list = [...rides].reverse().slice(0, showAll ? undefined : 12);
  $('#rideTbl').innerHTML = table('rides', ['Date', 'Miles', 'Time', 'mph', 'kcal', '°C', 'Route'],
    list.map(r => [[dLong(r.d) + (pbs.has(r) ? '<span class="pill">PB</span>' : ''), +r.d], [f1(r.dist), r.dist], [clock(r.secs), r.secs ?? -1], [f1(r.speed), r.speed ?? -1], [f0(r.cal), r.cal ?? -1], [f1(r.temp), r.temp ?? -99], [esc(r.route), r.route]]));
  $('#rideTbl').querySelectorAll('td:last-child').forEach(td => td.style.textAlign = 'left');
  $('#rideTbl').querySelectorAll('th:last-child').forEach(th => th.style.textAlign = 'left');
  sortable($('#rideTbl table'));
  const btn = $('#moreBtn');
  btn.hidden = rides.length <= 12;
  btn.textContent = showAll ? 'Show fewer' : `Show all ${rides.length} rides`;
  btn.onclick = () => rideTable(!showAll);
}

/* ---------- charts (plain SVG) ---------- */
const W = 520, H = 230, P = { l: 34, r: 8, t: 12, b: 26 };
function niceMax(v, step) { return Math.max(step, Math.ceil(v / step) * step); }
function tipFor(el) { let t = el.querySelector('.tip'); if (!t) { t = document.createElement('div'); t.className = 'tip'; el.appendChild(t); } return t; }
function placeTip(el, svg, x, y, html) {
  const t = tipFor(el), k = svg.getBoundingClientRect().width / W;
  t.innerHTML = html; t.classList.add('show');
  const px = Math.min(Math.max(x * k, 70), svg.getBoundingClientRect().width - 70);
  t.style.left = px + 'px'; t.style.top = (y * k) + 'px';
}
function barChart(el, data) {
  const max = niceMax(Math.max(...data.map(d => d.miles)), 20);
  const iw = W - P.l - P.r, ih = H - P.t - P.b, bw = iw / data.length, y = v => P.t + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Miles per week for the last 26 weeks">`;
  for (let g = 0; g <= max; g += max / 4) s += `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${P.l - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  data.forEach((d, i) => {
    const x = P.l + i * bw + 2, w = Math.max(2, bw - 4), h = Math.max(d.miles ? 3 : 2, ih - (y(d.miles) - P.t));
    const top = P.t + ih - h, r = Math.min(4, w / 2);
    s += `<g data-i="${i}"><rect class="hit" x="${P.l + i * bw}" y="${P.t}" width="${bw}" height="${ih}"/>` +
      `<path class="bar ${d.miles ? '' : 'zero'}" d="M${x},${P.t + ih} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${P.t + ih} Z"/></g>`;
    if (i % 4 === 1 || i === data.length - 1) s += `<text class="ax" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${dShort(d.s)}</text>`;
  });
  s += `<line class="base" x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg');
  svg.querySelectorAll('g[data-i]').forEach(g => {
    const d = data[g.dataset.i];
    const show = () => { svg.querySelectorAll('g.on').forEach(x => x.classList.remove('on')); g.classList.add('on'); placeTip(el, svg, P.l + (+g.dataset.i + .5) * bw, y(d.miles), `<b>${f1(d.miles)} mi</b> · ${d.n} ride${d.n === 1 ? '' : 's'}<br>w/c ${dShort(d.s)}`); };
    g.addEventListener('mouseenter', show); g.addEventListener('click', show);
  });
  svg.addEventListener('mouseleave', () => { tipFor(el).classList.remove('show'); svg.querySelectorAll('g.on').forEach(x => x.classList.remove('on')); });
}
function speedChart(el, data) {
  if (data.length < 2) { el.innerHTML = '<p class="sub">Log a few timed rides to see a trend.</p>'; return; }
  const sp = data.map(d => d.speed), lo = Math.floor(Math.min(...sp) - .5), hi = Math.ceil(Math.max(...sp) + .5);
  const t0 = +data[0].d, t1 = +data[data.length - 1].d || t0 + 1;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = t => P.l + 6 + (t - t0) / (t1 - t0 || 1) * (iw - 12), y = v => P.t + ih - (v - lo) / (hi - lo) * ih;
  const roll = data.map((d, i) => { const w = data.slice(Math.max(0, i - 4), i + 1); return w.reduce((a, r) => a + r.speed, 0) / w.length; });
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average speed per ride with rolling average">`;
  const step = (hi - lo) > 4 ? 1 : .5;
  for (let g = lo; g <= hi + 1e-9; g += step) s += `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${P.l - 6}" y="${y(g) + 4}" text-anchor="end">${g % 1 ? g.toFixed(1) : g}</text>`;
  const seenM = new Set();
  data.forEach(d => { const k = monthKey(d.d); if (!seenM.has(k)) { seenM.add(k); s += `<text class="ax" x="${x(+new Date(d.d.getFullYear(), d.d.getMonth(), 1)) < P.l ? x(+d.d) : x(+new Date(d.d.getFullYear(), d.d.getMonth(), 1))}" y="${H - 8}" text-anchor="start">${d.d.toLocaleDateString('en-GB', { month: 'short' })}</text>`; } });
  data.forEach(d => s += `<circle class="dot" cx="${x(+d.d)}" cy="${y(d.speed)}" r="4.5"/>`);
  s += `<path class="trend" d="${roll.map((v, i) => `${i ? 'L' : 'M'}${x(+data[i].d).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`;
  s += `<line class="cross" id="sx" x1="0" x2="0" y1="${P.t}" y2="${P.t + ih}" visibility="hidden"/><circle class="hl" id="sh" r="6" visibility="hidden"/>`;
  s += `<line class="base" x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}"/><rect class="hit" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), sx = svg.querySelector('#sx'), sh = svg.querySelector('#sh');
  const move = ev => {
    const pt = svg.createSVGPoint(); const e = ev.touches ? ev.touches[0] : ev; pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let bi = 0, bd = Infinity; data.forEach((d, i) => { const dd = Math.abs(x(+d.d) - p.x); if (dd < bd) { bd = dd; bi = i; } });
    const d = data[bi], cx = x(+d.d), cy = y(d.speed);
    sx.setAttribute('x1', cx); sx.setAttribute('x2', cx); sx.setAttribute('visibility', 'visible');
    sh.setAttribute('cx', cx); sh.setAttribute('cy', cy); sh.setAttribute('visibility', 'visible');
    placeTip(el, svg, cx, cy, `<b>${f1(d.speed)} mph</b> · ${f1(d.dist)} mi<br>${dLong(d.d)} · avg ${f1(roll[bi])}`);
  };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchstart', move, { passive: true }); svg.addEventListener('touchmove', move, { passive: true });
  svg.addEventListener('mouseleave', () => { tipFor(el).classList.remove('show'); sx.setAttribute('visibility', 'hidden'); sh.setAttribute('visibility', 'hidden'); });
}

/* ---------- data ---------- */
function setSync(t) { $('#syncText').textContent = t; }
function stamp() { setSync(`Updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} from your sheet`); }
function fail(res, body) {
  if (res && res.status === 503 && body && body.error === 'not-connected') {
    out.innerHTML = `<section class="card state"><h2>Sheet not connected yet</h2><p>The page is ready, but the link to your Cycling sheet hasn't been set up in Cloudflare.</p></section>`;
    setSync('Not connected'); return;
  }
  if (res && res.status === 401) {
    out.innerHTML = `<section class="card state"><h2>Signed out</h2><p>Your private session has ended. <a href="">Reload</a> to sign in again.</p></section>`;
    setSync('Signed out'); return;
  }
  out.innerHTML = `<section class="card state"><h2>Couldn't load your rides</h2><p>${esc(body?.error || 'The sheet did not respond.')} Try Refresh in a moment.</p></section>`;
  setSync('Load failed');
}
async function load() {
  const b = $('#reload'); b.disabled = true; setSync('Loading your rides…');
  try {
    const res = await fetch(API, { cache: 'no-store', credentials: 'same-origin' });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body?.ok) return fail(res, body);
    rides = normalise(body.rides); render(); stamp();
  } catch (e) { fail(null, { error: 'Network problem.' }); }
  finally { b.disabled = false; }
}
$('#reload').addEventListener('click', load);

/* ---------- form ---------- */
const form = $('#logForm'), msg = $('#formMsg');
const today = new Date(); form.date.value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
function autoSpeed() {
  const d = num(form.distance.value), s = parseTime(form.time.value);
  form.speed.placeholder = d && s ? (d / (s / 3600)).toFixed(1) : 'auto';
}
form.distance.addEventListener('input', autoSpeed); form.time.addEventListener('input', autoSpeed);
form.time.addEventListener('blur', () => { const v = form.time.value.trim(); const m = v.match(/^(\d{1,2}):(\d{2})$/); if (m) form.time.value = `0:${m[1].padStart(2, '0')}:${m[2]}`; autoSpeed(); });
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500); }
form.addEventListener('submit', async e => {
  e.preventDefault(); msg.className = 'formmsg'; msg.textContent = '';
  const [y, m, d] = form.date.value.split('-');
  const dist = num(form.distance.value), time = form.time.value.trim();
  if (!y) return (msg.className = 'formmsg err', msg.textContent = 'Pick a date.');
  if (!(dist > 0)) return (msg.className = 'formmsg err', msg.textContent = 'Enter the distance in miles.');
  if (time && parseTime(time) == null) return (msg.className = 'formmsg err', msg.textContent = 'Time should look like 0:45:30.');
  const secs = parseTime(time);
  const speed = form.speed.value !== '' ? num(form.speed.value) : (secs ? +(dist / (secs / 3600)).toFixed(1) : '');
  const hh = secs != null ? clock(secs).padStart(8, '0') : '';
  const payload = { date: `${d}/${m}/${y}`, distance: +dist.toFixed(1), time: hh, speed, cal: form.cal.value, temp: form.temp.value, route: form.route.value.trim() };
  const prev = rides.length ? aggregate(rides) : null;
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch(API, { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    const body = await res.json().catch(() => null);
    if (!res.ok || !body?.ok) { msg.className = 'formmsg err'; msg.textContent = body?.error === 'not-connected' ? 'The sheet isn’t connected yet.' : (body?.error || 'Couldn’t save. Nothing was added.'); return; }
    rides = normalise(body.rides); render(); stamp();
    let note = `Saved: ${f1(dist)} mi on ${d}/${m}/${y}.`;
    if (prev && dist > prev.long.dist) note += ' New longest ride! 🎉';
    else if (prev && speed && prev.best && speed > prev.best.speed) note += ' New fastest average! ⚡';
    msg.className = 'formmsg ok'; msg.textContent = note; toast(note);
    ['distance', 'time', 'speed', 'cal', 'temp'].forEach(n => form[n].value = ''); autoSpeed();
  } catch (err) { msg.className = 'formmsg err'; msg.textContent = 'Network problem. Nothing was added.'; }
  finally { btn.disabled = false; btn.textContent = 'Save ride'; }
});

load();
})();
</script>
</body>
