<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycling · My space</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#171f30;--ink:#e8edf6;--mute:#8d99ae;--line:#222c42;--or:#ff7a2f;--cy:#38d0e0;--am:#f5c542;--vi:#a78bfa;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.crumb{display:inline-block;color:var(--mute);font-size:14px;font-weight:600;text-decoration:none;margin-bottom:10px}.crumb:hover{color:var(--ink)}
header h1{font-size:clamp(24px,4.5vw,36px);margin:0;letter-spacing:-.02em}
header p{margin:4px 0 18px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:3px solid var(--c)}
.kpi span{display:block;color:var(--mute);font-size:13px}
.kpi strong{display:block;font-size:clamp(20px,3.4vw,26px);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{font-size:13px;font-weight:500;color:var(--mute)}
section{margin-top:26px}
h2{font-size:17px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chartbox{position:relative;height:340px}
@media(max-width:640px){.chartbox{height:300px}}
details.panel{padding:0}
summary{cursor:pointer;padding:14px 16px;font-weight:650;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--mute)}details[open] summary::after{content:"–"}
summary:focus-visible,button:focus-visible,input:focus-visible,th button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:0 16px 16px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
input[type=text],input[type=date],input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;color-scheme:dark}
input:disabled{opacity:.55}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.act{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--or);border-color:var(--or);color:#1a0d02;font-weight:650}
#st{font-size:14px;color:var(--mute)}#st.err{color:var(--bad)}
.tw{overflow-x:auto;padding:4px 8px}
table{width:100%;border-collapse:collapse;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
th{font-weight:500;font-size:13px;color:var(--mute)}
th button{border:0;padding:2px 4px;border-radius:6px;color:inherit;font-size:13px}
th button::after{content:" ↕";opacity:.35}
th[aria-sort=ascending] button::after{content:" ▲";opacity:1;color:var(--or)}
th[aria-sort=descending] button::after{content:" ▼";opacity:1;color:var(--or)}
.del{padding:3px 10px;font-size:13px;color:var(--bad);border-color:transparent}
.del:hover{border-color:var(--bad)}
.empty{color:var(--mute);text-align:center!important;padding:26px}
td:last-child,th:last-child{text-align:left}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--panel)}
.seg button{border:0;padding:6px 14px;border-radius:999px;color:var(--mute)}
.seg button.on{background:var(--or);color:#1a0d02;font-weight:650}
.nav{display:flex;align-items:center;gap:8px}.nav strong{min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.nav button{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;font-size:14px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{border-color:var(--c)}
.chip[aria-pressed=false]{color:var(--mute);text-decoration:line-through}
.chip[aria-pressed=false] i{background:transparent;border:1.5px solid var(--c)}
.foot{margin-top:10px;display:flex;justify-content:flex-end}
.foot button{font-size:13px;color:var(--mute)}
</style></head>
<body><script src="/nav.js" data-theme="dark"></script><main>
<header><a class="crumb" href="/private/">← My space</a><h1>Cycling Performance Dashboard</h1><p id="sub"></p>
<div class="filter" id="fl" hidden>
<div class="seg" id="seg"><button type="button" data-g="all" class="on">All time</button><button type="button" data-g="week">Week</button><button type="button" data-g="month">Month</button><button type="button" data-g="year">Year</button></div>
<div class="nav" id="nav" hidden><button type="button" id="pv" aria-label="Previous period">‹</button><strong id="pl"></strong><button type="button" id="nx" aria-label="Next period">›</button></div>
</div>
<div class="kpis">
<div class="kpi" style="--c:var(--or)"><span>Total distance</span><strong id="k1"></strong></div>
<div class="kpi" style="--c:var(--cy)"><span>Total time</span><strong id="k2"></strong></div>
<div class="kpi" style="--c:var(--vi)"><span>Overall avg speed</span><strong id="k3"></strong></div>
<div class="kpi" style="--c:var(--am)"><span>Total calories</span><strong id="k4"></strong></div>
<div class="kpi" style="--c:#6ee7a8"><span>Avg temperature</span><strong id="k5"></strong></div>
</div></header>
<div class="panel" id="msg" style="margin-top:22px">Reading your sheet…</div>
<div id="out" hidden>

<section><h2>Session trends</h2><div class="panel"><div class="chips" id="chips"></div><div class="chartbox"><canvas id="chart" aria-label="Distance, speed, calories and temperature per session" role="img"></canvas></div></div></section>

<section><details class="panel" id="fd" open><summary>Log a ride</summary>
<form id="f" novalidate>
<label>Date<input type="date" id="d"></label>
<label>Distance (miles)<input type="number" id="mi" step="0.01" min="0" inputmode="decimal"></label>
<label>Time (HH:MM:SS)<input type="text" id="t" placeholder="HH:MM:SS" inputmode="numeric" autocomplete="off" maxlength="8"></label>
<label>Avg speed (mph)<input type="number" id="sp" step="0.1" min="0" inputmode="decimal"></label>
<label>Calories (kcal)<input type="number" id="cal" step="1" min="0" inputmode="numeric"></label>
<label>Temperature (°C)<input type="number" id="tp" step="0.1" inputmode="decimal"></label>
<label>Route<input type="text" id="rt" list="rl" autocomplete="off"></label><datalist id="rl"></datalist>
<div class="act"><button class="pri" type="submit" id="fb">Add ride to sheet</button><span id="st" role="status"></span></div>
</form></details></section>

<section><h2>Ride log</h2><div class="panel tw"><table>
<thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
<div class="foot"><button id="rf">Refresh from sheet</button></div></section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const API="/private/api/rides";
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+y,0),r1=n=>Math.round(n*10)/10;
const p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fT=s=>{s=Math.round(s);return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)};
const fNum=(n,d=1)=>n==null?"–":n.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const fDate=(iso,short)=>new Date(iso+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:short?undefined:"numeric",timeZone:"UTC"});
const parseT=v=>{const p=v.trim().split(":");if(p.length<2||p.length>3||p.some(x=>!/^\d{1,3}$/.test(x)))return null;
  const n=p.map(Number);if(n.length===2)n.unshift(0);if(n[1]>59||n[2]>59)return null;return n[0]*3600+n[1]*60+n[2]};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:null};
const durS=v=>{const m=/^(\d+):(\d{2}):(\d{2})$/.exec(String(v||"").trim());return m?+m[1]*3600+ +m[2]*60+ +m[3]:null};
const isoD=v=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(v||"").trim());return m?m[3]+"-"+p2(m[2])+"-"+p2(m[1]):null};
const parseRows=list=>list.map((r,i)=>({id:"r"+String(i).padStart(4,"0"),date:isoD(r.date),mi:num(r.distance),t:durS(r.time),sp:num(r.speed),cal:num(r.cal),tp:num(r.temp),route:String(r.route||"").trim()}))
  .filter(x=>x.date&&x.mi!=null);
let rides=null,view=[],gran="all",anchor=null,sortKey="date",dir=-1,chart;

const COLS=[["date","Date"],["mi","Distance (mi)"],["t","Duration (hh:mm:ss)"],["sp","Avg speed (mph)"],["cal","Calories (kcal)"],["tp","Temp (°C)"],["route","Route"]];
$("#hd").innerHTML=COLS.map(([k,l])=>`<th data-k="${k}"><button type="button">${l}</button></th>`).join("");
$("#hd").onclick=e=>{const th=e.target.closest("th[data-k]");if(!th)return;const k=th.dataset.k;if(sortKey===k)dir=-dir;else{sortKey=k;dir=-1}renderTable()};

function kpis(){
  const K=["#k1","#k2","#k3","#k4","#k5"];
  if(!rides){K.forEach(k=>$(k).textContent="–");return}
  const n=view.length,tr=view.filter(r=>r.t),t=sum(tr.map(r=>r.t)),tm=sum(tr.map(r=>r.mi)),tps=view.filter(r=>r.tp!=null);
  $("#k1").innerHTML=fNum(sum(view.map(r=>r.mi)))+" <small>miles</small>";
  $("#k2").textContent=fT(t);
  $("#k3").innerHTML=(t?fNum(tm/(t/3600)):"–")+" <small>mph</small>";
  $("#k4").innerHTML=fNum(sum(view.map(r=>r.cal||0)),0)+" <small>kcal</small>";
  $("#k5").innerHTML=(tps.length?fNum(sum(tps.map(r=>r.tp))/tps.length):"–")+" <small>°C</small>";
  const ds=view.map(r=>r.date).sort();
  $("#sub").textContent=n?n+(n===1?" ride":" rides")+", "+fDate(ds[0])+(ds[0]===ds[n-1]?"":" to "+fDate(ds[n-1]))+". Time, speed, calories and temperature totals only count rides that logged them.":"No rides in this period.";
}
const sorted=()=>[...view].sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0)||a.id.localeCompare(b.id));

const M=[["Distance","#ff7a2f"],["Avg speed","#38d0e0"],["Calories","#f5c542"],["Temperature","#a78bfa"]];
$("#chips").innerHTML=M.map(([l,c],i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="true" style="--c:${c}"><i></i>${l}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b||!chart)return;const i=+b.dataset.i,on=!chart.isDatasetVisible(i);chart.setDatasetVisibility(i,on);b.setAttribute("aria-pressed",on);chart.update()};
function buildChart(){
  if(typeof Chart==="undefined"){$(".chartbox").textContent="The chart library didn’t load. Check your connection and reload.";return}
  Chart.defaults.color="#8d99ae";Chart.defaults.borderColor="#222c42";Chart.defaults.font.family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif";
  const wide=matchMedia("(min-width:640px)").matches,ttl=t=>({display:wide,text:t});
  const line=(label,u,c,axis,ord)=>({type:"line",label,u,yAxisID:axis,borderColor:c,backgroundColor:c,tension:.3,pointRadius:3,pointHoverRadius:6,borderWidth:2,order:ord,data:[]});
  chart=new Chart($("#chart"),{type:"bar",data:{labels:[],datasets:[
    {type:"bar",label:"Distance (mi)",u:"mi",yAxisID:"y",backgroundColor:"rgba(255,122,47,.55)",borderColor:"#ff7a2f",borderWidth:1,borderRadius:4,order:5,data:[]},
    line("Avg speed (mph)","mph","#38d0e0","y",1),line("Calories (kcal)","kcal","#f5c542","y1",2),line("Temp (°C)","°C","#a78bfa","y2",3)]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:{padding:10,callbacks:{
        title:i=>fDate(sorted()[i[0].dataIndex].date),
        label:c=>" "+c.dataset.label.replace(/ \(.*\)/,"")+": "+c.formattedValue+" "+c.dataset.u,
        afterBody:i=>{const r=sorted()[i[0].dataIndex];return["Duration: "+(r.t!=null?fT(r.t):"–")].concat(r.route?["Route: "+r.route]:[])}}}},
      scales:{x:{grid:{display:false},ticks:{maxRotation:60,autoSkipPadding:12}},
        y:{display:"auto",position:"left",beginAtZero:true,title:ttl("Miles / mph")},
        y1:{display:"auto",position:"right",beginAtZero:true,grid:{drawOnChartArea:false},title:ttl("Calories (kcal)"),ticks:{color:"#f5c542"}},
        y2:{display:"auto",position:"right",grid:{drawOnChartArea:false},title:ttl("Temp (°C)"),ticks:{color:"#a78bfa"}}}}});
}
function updateChart(){
  if(!chart)return;const s=sorted();chart.data.labels=s.map(r=>fDate(r.date,1));
  ["mi","sp","cal","tp"].forEach((k,i)=>chart.data.datasets[i].data=s.map(r=>r[k]));chart.update();
}
function renderTable(){
  document.querySelectorAll("#hd th[data-k]").forEach(th=>th.setAttribute("aria-sort",th.dataset.k===sortKey?(dir>0?"ascending":"descending"):"none"));
  const rows=[...view].sort((a,b)=>{const x=a[sortKey],y=b[sortKey];
    if((x==null||x==="")&&(y==null||y===""))return b.id.localeCompare(a.id);if(x==null||x==="")return 1;if(y==null||y==="")return-1;
    return(x<y?-1:x>y?1:0)*dir||b.id.localeCompare(a.id)});
  $("#tb").innerHTML=!rows.length?`<tr><td colspan="7" class="empty">No rides in this period.</td></tr>`:rows.map(r=>`<tr><td>${fDate(r.date)}</td><td>${fNum(r.mi,2)}</td><td>${r.t!=null?fT(r.t):"–"}</td><td>${fNum(r.sp)}</td><td>${fNum(r.cal,0)}</td><td>${fNum(r.tp)}</td><td>${r.route?esc(r.route):"–"}</td></tr>`).join("");
}
function renderAll(){kpis();updateChart();renderTable();
  const rn={};rides.forEach(r=>{if(r.route)rn[r.route]=(rn[r.route]||0)+1});
  $("#rl").innerHTML=Object.keys(rn).sort((a,b)=>rn[b]-rn[a]).map(k=>`<option value="${esc(k)}">`).join("");
  if(!$("#rt").value){const l=[...rides].reverse().find(r=>r.route);if(l)$("#rt").value=l.route}}

function problem(res,body){
  if(res&&res.status===401)return'Your private session has ended. <a href="">Reload</a> to sign in again.';
  if(res&&res.status===503&&body&&body.error==="not-connected")return"The link to your Cycling sheet hasn’t been set up in Cloudflare yet.";
  return esc((body&&body.error)||"The sheet didn’t respond.")+" Press Refresh in a moment.";
}
function fail(res,body){$("#out").hidden=true;const m=$("#msg");m.hidden=false;m.innerHTML=problem(res,body)}
function show(list){
  rides=parseRows(list);if(!rides.length)return fail(null,{error:"No rides came back from the sheet."});
  $("#msg").hidden=true;$("#fl").hidden=false;$("#out").hidden=false;if(!chart)buildChart();applyFilter();
}
async function load(){
  const m=$("#msg");m.hidden=false;m.textContent="Reading your sheet…";
  try{
    const res=await fetch(API,{cache:"no-store",credentials:"same-origin"});
    const body=await res.json().catch(()=>null);
    if(!res.ok||!body||!body.ok||!Array.isArray(body.rides))return fail(res,body);
    show(body.rides);
  }catch(e){fail(null,{error:"Network problem."})}
}
const DAY=864e5,iso=d=>d.toISOString().slice(0,10),mon=d=>new Date(+d-((d.getUTCDay()+6)%7)*DAY);
function span(a){
  const y=a.getUTCFullYear(),m=a.getUTCMonth();
  if(gran==="week"){const s=mon(a),e=new Date(+s+6*DAY);return[s,e,fDate(iso(s),1)+" – "+fDate(iso(e))]}
  if(gran==="month")return[new Date(Date.UTC(y,m,1)),new Date(Date.UTC(y,m+1,0)),a.toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"})];
  return[new Date(Date.UTC(y,0,1)),new Date(Date.UTC(y,11,31)),String(y)];
}
function applyFilter(){
  if(!rides)return;
  const ds=rides.map(r=>r.date).sort(),first=new Date(ds[0]+"T00:00:00Z"),last=new Date(ds[ds.length-1]+"T00:00:00Z");
  if(gran==="all"){view=rides;$("#nav").hidden=true}
  else{
    if(!anchor)anchor=last;
    const[s,e,lab]=span(anchor);view=rides.filter(r=>r.date>=iso(s)&&r.date<=iso(e));
    $("#nav").hidden=false;$("#pl").textContent=lab;$("#pv").disabled=s<=first;$("#nx").disabled=e>=last;
  }
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.g===gran));
  renderAll();
}
$("#seg").onclick=e=>{const b=e.target.closest("button[data-g]");if(!b)return;gran=b.dataset.g;anchor=null;applyFilter()};
$("#pv").onclick=()=>{anchor=new Date(+span(anchor)[0]-DAY);applyFilter()};
$("#nx").onclick=()=>{anchor=new Date(+span(anchor)[1]+DAY);applyFilter()};
$("#rf").onclick=load;

const today=()=>{const t=new Date();return t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate())};
$("#d").value=today();
$("#t").addEventListener("input",e=>{const d=e.target.value.replace(/\D/g,"").slice(0,6);
  e.target.value=d.replace(/^(\d{1,2})(\d{1,2})?(\d{1,2})?$/,(m,a,b,c)=>a+(b?":"+b:"")+(c?":"+c:""))});
const say=(m,bad)=>{const s=$("#st");s.textContent=m;s.className=bad?"err":""};
const WASK="This page needs your permission to edit Google Sheets. Allow it when prompted, then try again.";
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const date=$("#d").value,mi=parseFloat($("#mi").value),t=parseT($("#t").value),cal=parseFloat($("#cal").value),tp=parseFloat($("#tp").value);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return say("Choose a date.",1);
  if(!(mi>0))return say("Enter a distance above 0.",1);
  if(!/^\d{2}:\d{2}:\d{2}$/.test($("#t").value)||!t)return say("Enter the time as six digits, HH:MM:SS (for example 004433), with minutes and seconds under 60.",1);
  if(!(cal>=0))return say("Enter the calories burnt.",1);
  if(!isFinite(tp))return say("Enter the temperature.",1);
  const sp=parseFloat($("#sp").value);
  if(!(sp>0))return say("Enter your average speed.",1);
  const b=$("#fb");b.disabled=true;say("Adding to the sheet…");
  const[y,mo,d]=date.split("-");
  try{
    const res=await fetch(API,{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},
      body:JSON.stringify({date:d+"/"+mo+"/"+y,distance:mi,time:fT(t),speed:sp,cal:Math.round(cal),temp:tp,route:$("#rt").value.trim()})});
    const body=await res.json().catch(()=>null);
    if(!res.ok||!body||!body.ok){
      say(res.status===401?"Your session has ended. Reload the page to sign in again.":(body&&body.error==="not-connected"?"The sheet isn’t connected yet.":((body&&body.error)||"Couldn’t save. Nothing was added.")),1);
    }else{
      say("Added to the sheet.");
      ["mi","t","sp","cal","tp"].forEach(i=>$("#"+i).value="");$("#d").value=today();
      if(Array.isArray(body.rides)){anchor=null;show(body.rides)}else await load();
    }
  }catch(er){say("Network problem. Check the sheet before trying again, in case the ride was saved.",1)}
  b.disabled=false;
};
kpis();load();
</script></body></html>
