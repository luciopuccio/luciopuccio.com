<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucio Puccio</title>
<meta name="description" content="Projects and experiments by Lucio Puccio.">
<style>
  :root { --bg:#faf8f5; --text:#1c1b1a; --dim:#6b6762; --line:#e4dfd8; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151413; --text:#ece8e3; --dim:#9c968f; --line:#2c2a27; --accent:#fb923c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:72px 20px; }
  h1 { font-size:2.2rem; line-height:1.15; margin:0 0 8px; letter-spacing:-0.02em; }
  .lede { color:var(--dim); margin:0 0 48px; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:0 0 12px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li a { display:flex; justify-content:space-between; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  li a:hover strong { color:var(--accent); }
  li span { color:var(--dim); }
  footer { margin-top:64px; color:var(--dim); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Lucio Puccio</h1>
  <p class="lede">Projects and experiments. More coming soon.</p>
  <h2>Projects</h2>
  <ul>
    <li><a href="/pi/"><strong>Pi Arcade</strong><span>How many digits of π can you remember?</span></a></li>
  </ul>
  <footer>© 2026 Lucio Puccio</footer>
</main>
</body>
</html>
