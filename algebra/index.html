<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script src="/nav.js"></script>
<meta name="description" content="Algebra Path: practise algebra from the basics to trigonometry, with worked solutions, spaced reviews and a graph lab.">
<title>Algebra Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a fixed path rail on the left (units → topics → checkpoints), the work area on the right; topic pages split into Learn (notes) and Practice (a graph-paper board). */
:root{
  --paper:#F3F6F4; --sheet:#FFFFFF; --ink:#15201B; --muted:#5A6A62; --line:#D7E0DB; --grid:#E4ECE8;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#E3F0EA; --mark:#E6B52E; --mark-soft:#FBF1D3;
  --p1:#C46A12; --p2:#2C63B5; --p3:#8A45B0; --p4:#B9412C; --good:#2C7A4B; --good-soft:#E2F2E7; --bad:#B9412C; --bad-soft:#F8E6E1; --warn:#9A6514; --warn-soft:#F6EEDC;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1311; --sheet:#151C19; --ink:#E3EAE6; --muted:#93A39B; --line:#26312C; --grid:#1C2622;
  --accent:#5BC79D; --accent-ink:#06120D; --accent-soft:#16291F; --mark:#E2B63C; --mark-soft:#2B2513;
  --p1:#F0A04B; --p2:#78A9F2; --p3:#C690EE; --p4:#EF7C66; --good:#62C98D; --good-soft:#15291D; --bad:#EF7C66; --bad-soft:#2E1A16; --warn:#E2AA4E; --warn-soft:#2B2213; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1311; --sheet:#151C19; --ink:#E3EAE6; --muted:#93A39B; --line:#26312C; --grid:#1C2622;
  --accent:#5BC79D; --accent-ink:#06120D; --accent-soft:#16291F; --mark:#E2B63C; --mark-soft:#2B2513;
  --p1:#F0A04B; --p2:#78A9F2; --p3:#C690EE; --p4:#EF7C66; --good:#62C98D; --good-soft:#15291D; --bad:#EF7C66; --bad-soft:#2E1A16; --warn:#E2AA4E; --warn-soft:#2B2213; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--sheet);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-bottom:16px}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.railnav{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.railnav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.railnav a:hover{background:var(--accent-soft)}
.railnav a.on{background:var(--accent);color:var(--accent-ink)}
.badge{font-family:var(--mono);font-size:11px;background:var(--mark);color:#1d1600;border-radius:99px;padding:1px 7px;font-weight:600}
.unit{margin-top:14px}
.unit h4{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.unit h4 i{font-style:normal;color:var(--ink);opacity:.5;margin-right:6px}
.tlink{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px}
.tlink:hover{background:var(--accent-soft)}
.tlink.on{background:var(--accent-soft);font-weight:600}
.tlink.cp{color:var(--muted);font-size:13px}
.tlink .lvl{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent}
.dot.learning{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.shaky{border-color:var(--warn);background:var(--warn)}
.dot.mastered{border-color:var(--good);background:var(--good)}
.dot.due{border-color:var(--mark);background:radial-gradient(circle,var(--mark) 0 35%,transparent 40%)}
.dot.flag{border-radius:2px;border-color:var(--muted)}
.dot.flag.pass{border-color:var(--good);background:var(--good)}
.sync{margin-top:20px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.railtoggle{display:none}
main{min-width:0;padding-block:28px 64px;padding-left:40px;padding-right:max(16px, env(safe-area-inset-right, 0px), 40px)}
.wrap{max-width:1180px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--grid);color:var(--muted)}
.pill.learning{background:var(--accent-soft);color:var(--accent)}
.pill.shaky{background:var(--warn-soft);color:var(--warn)}
.pill.mastered{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--mark-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:default}
/* Home */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.hero h1{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:58ch}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tcard:hover{border-color:var(--accent)}
.tcard.hot{border-color:var(--mark);background:var(--mark-soft)}
.tcard .eyebrow{font-size:11px}
.tcard b{font-family:var(--display);font-size:19px;line-height:1.2}
.tcard span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b small{font-size:16px;color:var(--muted);font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.path{display:flex;flex-direction:column;gap:18px}
.punit{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.punit header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.punit h3{font-size:18px}
.punit header span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:hover .pt{color:var(--accent)}
.pn{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pt{font-weight:500}
.pmeta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.prow.cpr .pt{color:var(--muted);font-weight:600}
.side{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:17px;margin-bottom:8px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px}
.panel ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.panel li{margin:4px 0}
.panel li b{color:var(--ink)}
.weak a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
/* Topic */
.thead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.thead h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.tmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.spark{display:flex;gap:3px}
.spark i{width:8px;height:16px;border-radius:2px;background:var(--grid)}
.spark i.y{background:var(--good)}.spark i.n{background:var(--bad)}
.pre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--sheet)}
.chip:hover{border-color:var(--accent)}
.prewarn{flex-basis:100%;font-size:13px;color:var(--warn)}
.tgrid{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
.learn{display:flex;flex-direction:column;gap:14px}
.learn .sum{font-size:16px;margin:0;max-width:62ch}
.key{background:var(--accent-soft);border-radius:10px;padding:12px 14px;overflow-x:auto;overflow-y:hidden}
.key .eyebrow{display:block;margin-bottom:4px;color:var(--accent)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
details.fold>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold>div{padding:0 14px 14px;font-size:15px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;overflow-x:auto;overflow-y:hidden}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;height:22px;display:grid;place-items:center;margin-top:2px}
.exq{margin:0 0 10px;font-weight:500}
.fig{display:block;width:340px;max-width:100%;height:auto;margin:12px 0 2px}
.fig .tri{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fig .ra{fill:none;stroke:var(--ink);stroke-width:1.2}
.fig text{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.fig text.u{fill:var(--accent);font-weight:600;font-size:15px}
.fig text.v{fill:var(--muted);font-size:12px}
/* Board */
.board{position:sticky;top:20px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.btop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;padding:26px 22px 22px;min-height:180px;position:relative}
.qlabel{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qlabel .tag{background:var(--mark);color:#1d1600;padding:1px 8px;border-radius:4px;font-weight:600}
.qlabel .lv{border:1px solid var(--line);background:var(--sheet);padding:0 7px;border-radius:4px}
.qlabel a{color:var(--muted)}
.q{font-size:20px;line-height:1.6;overflow-x:auto;overflow-y:hidden;background:var(--sheet);display:inline-block;max-width:100%;padding:2px 4px}
.q.word{font-size:18px}
.answer{padding:16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.arow{display:flex;gap:10px;flex-wrap:wrap}
.arow input{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.arow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fmt{font-size:13px;color:var(--muted)}
.fmt code{font-family:var(--mono);background:var(--grid);padding:1px 5px;border-radius:4px}
.syms{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.syms .fmt{margin-right:4px}
.sym{min-width:42px;height:38px;padding:0 10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--mono);font-size:18px;cursor:pointer;color:var(--ink)}
.sym:hover{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:10px;padding:12px 14px;font-size:15px}
.fb b{display:block;margin-bottom:2px}
.fb.good{background:var(--good-soft)}.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-soft)}.fb.bad b{color:var(--bad)}
.fb.warn{background:var(--warn-soft)}.fb.warn b{color:var(--warn)}
.fb .rev{margin-top:6px;font-size:14px}
.toast{font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sol{border-top:1px solid var(--line);padding:16px}
.sol h4{margin:0 0 10px;font-family:var(--display);font-size:16px}
.final{margin-top:12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:9px;overflow-x:auto;overflow-y:hidden}
.method{margin-top:10px;font-size:14px;color:var(--muted)}
.method b{color:var(--ink)}
.ai{border-top:1px solid var(--line);padding:0}
.ai>summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ai>summary::-webkit-details-marker{display:none}
.ai>summary span{font-weight:400;font-size:13px;color:var(--muted)}
.aibody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.aibody textarea{font-family:var(--mono);font-size:14px;min-height:120px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);width:100%}
.aiout{font-size:15px;white-space:pre-wrap;overflow-x:auto}
.aiout strong{display:block;margin-top:8px;font-family:var(--display)}
.note{font-size:13px;color:var(--muted)}
.progress{height:6px;background:var(--grid);border-radius:99px;overflow:hidden;flex:1 1 120px;max-width:220px}
.progress i{display:block;height:100%;background:var(--accent)}
.result{padding:22px;display:flex;flex-direction:column;gap:14px}
.result h2{font-size:28px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rlist .y{color:var(--good);font-weight:600}.rlist .n{color:var(--bad);font-weight:600}
.empty{padding:30px}
.lessoncard{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;padding:16px 18px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft);text-decoration:none;color:var(--ink);margin-top:14px}
.lessoncard b{font-family:var(--display);font-size:19px;grid-column:1}.lessoncard .eyebrow,.lessoncard .note{grid-column:1}.lcgo{grid-column:2;grid-row:1/4;font-weight:700;color:var(--accent);font-size:16px}
.lessoncard:hover{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--ink)}
.lp{display:flex;flex-direction:column;gap:16px;max-width:980px}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stg{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border:1px solid var(--line);border-radius:99px;background:var(--sheet);cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.stg span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grid);font-family:var(--mono);font-size:12px;color:var(--ink)}
.stg.past{color:var(--ink)}.stg.past span{background:var(--accent-soft);color:var(--accent)}
.stg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.stg.on span{background:var(--accent-ink);color:var(--accent)}
.lpcard{font-size:17px;line-height:1.65;display:flex;flex-direction:column;gap:12px;padding:22px 24px}.lpcard p{margin:0;max-width:64ch}
.bigf{font-size:24px;padding:14px 10px;border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);text-align:center;overflow-x:auto;overflow-y:hidden;max-width:520px}
.wgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.nb{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:280px}
.nbq{margin:0 0 6px;font-size:17px}.nbq .eyebrow{display:block;margin-bottom:2px}
.nbl{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:9px;font-size:18px;opacity:.6;transition:opacity .2s,background .2s}
.nbl.cur{opacity:1;background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark)}
.nbn{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px;flex:none}
.nbm{overflow-x:auto;overflow-y:hidden;min-width:0;font-size:18px;padding:4px 0}
.nbhide{font-family:var(--mono);color:var(--muted);letter-spacing:.2em}
.stepcard{display:flex;flex-direction:column;gap:12px;padding:20px 22px;position:sticky;top:16px}
.stepcard h3{font-size:22px}.stepcard p{margin:0;font-size:16.5px;line-height:1.6}
.think{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:16px}.think .note{margin:6px 0 0}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:15.5px}.warnbox b{color:var(--warn)}
.dots{display:flex;gap:6px;margin-top:4px}.dots i{width:22px;height:5px;border-radius:9px;background:var(--grid)}.dots i.d{background:var(--accent)}.dots i.c{background:var(--mark)}

      return out(2,T`I = \dfrac{PRT}{100}`,s,`100*I/(${o[0]}*${o[1]})`,T`\dfrac{100I}{${o[0]}${o[1]}}`,['I',...o],[T`Multiply by 100: \(100I = PRT\)`,T`Divide by \(${o[0]}${o[1]}\): \(${s} = \dfrac{100I}{${o[0]}${o[1]}}\)`],
        [{a:`100*I/${o[0]}*${o[1]}`,msg:`Divide by the product ${o[0]}${o[1]}, so both go on the bottom (step 2).`},{a:`I/(100*${o[0]}*${o[1]})`,msg:'To undo ÷ 100, multiply by 100 (step 1).'}])},
    ()=>{const s=R.pick(['m','x']),o=s==='m'?'x':'m';
      return out(2,T`y = mx + c`,s,`(y-c)/${o}`,T`\dfrac{y - c}{${o}}`,['y','c',o],[T`Subtract \(c\): \(y - c = mx\)`,T`Divide by \(${o}\): \(${s} = \dfrac{y - c}{${o}}\)`],[{a:`y/${o}-c`,msg:`Subtract c before dividing by ${o} (step 1).`},{a:`(y+c)/${o}`,msg:'To undo + c, subtract c (step 1).'}])},
    ()=>out(2,T`V = \tfrac13\pi r^2 h`,'h','3*V/(pi*r^2)',T`\dfrac{3V}{\pi r^2}`,['V','r'],[T`Multiply by 3: \(3V = \pi r^2 h\)`,T`Divide by \(\pi r^2\): \(h = \dfrac{3V}{\pi r^2}\)`],[{a:'V/(3*pi*r^2)',msg:'To undo × ⅓, multiply by 3 (step 1).'}],{syms:['π','²']}),
    ()=>out(2,T`v^2 = u^2 + 2as`,R.pick(['a','s'])==='a'?'a':'s',null,null,null,null,null),

  /* ---- level 3 ---- */
  const L3=[
    ()=>out(3,T`E = \tfrac12 mv^2`,'v','sqrt(2*E/m)',T`\sqrt{\dfrac{2E}{m}}`,['E','m'],[T`Multiply by 2: \(2E = mv^2\)`,T`Divide by \(m\): \(v^2 = \dfrac{2E}{m}\)`,T`Square-root: \(v = \sqrt{\dfrac{2E}{m}}\)`],
      [{a:'2*E/m',msg:T`That’s \(v^2\). The last step is a square root (step 3).`},{a:'sqrt(E/(2*m))',msg:'To undo × ½, multiply by 2 (step 1).'}],{syms:['√']}),
    ()=>out(3,T`A = \pi r^2`,'r','sqrt(A/pi)',T`\sqrt{\dfrac{A}{\pi}}`,['A'],[T`Divide by \(\pi\): \(r^2 = \dfrac{A}{\pi}\)`,T`Square-root: \(r = \sqrt{\dfrac{A}{\pi}}\)`],[{a:'A/pi',msg:T`That’s \(r^2\). Square-root it (step 2).`},{a:'sqrt(A)/pi',msg:'Divide by π before square-rooting, so π goes under the root (step 2).'}],{syms:['√','π']}),
    ()=>out(3,T`v^2 = u^2 + 2as`,'u','sqrt(v^2-2*a*s)',T`\sqrt{v^2 - 2as}`,['v','a','s'],[T`Subtract \(2as\): \(u^2 = v^2 - 2as\)`,T`Square-root: \(u = \sqrt{v^2 - 2as}\)`],[{a:'v-sqrt(2*a*s)',msg:T`\(\sqrt{v^2 - 2as}\) is not \(v - \sqrt{2as}\): you can’t square-root term by term (step 2).`},{a:'v^2-2*a*s',msg:T`That’s \(u^2\). Square-root it (step 2).`}],{doms:{v:[8,12],a:[.5,2],s:[.5,2]},syms:['√','²']}),
    ()=>out(3,T`V = \tfrac13\pi r^2 h`,'r','sqrt(3*V/(pi*h))',T`\sqrt{\dfrac{3V}{\pi h}}`,['V','h'],[T`Multiply by 3: \(3V = \pi r^2 h\)`,T`Divide by \(\pi h\): \(r^2 = \dfrac{3V}{\pi h}\)`,T`Square-root: \(r = \sqrt{\dfrac{3V}{\pi h}}\)`],[{a:'3*V/(pi*h)',msg:T`That’s \(r^2\). Square-root it (step 3).`}],{syms:['√','π']}),
    ()=>{const s=R.pick(['l','g']);return s==='l'?out(3,T`T = 2\pi\sqrt{\dfrac{l}{g}}`,'l','g*T^2/(4*pi^2)',T`\dfrac{gT^2}{4\pi^2}`,['T','g'],[T`Divide by \(2\pi\): \(\dfrac{T}{2\pi} = \sqrt{\dfrac lg}\)`,T`Square both sides: \(\dfrac{T^2}{4\pi^2} = \dfrac lg\)`,T`Multiply by \(g\): \(l = \dfrac{gT^2}{4\pi^2}\)`],[{a:'g*T/(2*pi)',msg:'To undo the square root, square both sides, including the 2π (step 2).'},{a:'g*T^2/(2*pi)',msg:T`Squaring \(2\pi\) gives \(4\pi^2\) (step 2).`}],{syms:['π','²']})
      :out(3,T`T = 2\pi\sqrt{\dfrac{l}{g}}`,'g','4*pi^2*l/T^2',T`\dfrac{4\pi^2 l}{T^2}`,['T','l'],[T`Divide by \(2\pi\) and square: \(\dfrac{T^2}{4\pi^2} = \dfrac lg\)`,T`Flip both sides: \(\dfrac{4\pi^2}{T^2} = \dfrac gl\)`,T`Multiply by \(l\): \(g = \dfrac{4\pi^2 l}{T^2}\)`],[{a:'T^2*l/(4*pi^2)',msg:'g is on the bottom, so the fraction flips (step 2).'}],{syms:['π','²']})},
    ()=>{const[x,y]=pair(),a=R.int(2,5),b=R.nz(-9,9);
      return out(3,T`${y} = ${a}${x}^2${sg(b)}`,x,`sqrt((${y}${sgc(-b)})/${a})`,T`\sqrt{\dfrac{${y}${sg(-b)}}{${a}}}`,[y],[T`${b>0?'Subtract':'Add'} ${Math.abs(b)}: \(${y}${sg(-b)} = ${a}${x}^2\)`,T`Divide by ${a}: \(${x}^2 = \dfrac{${y}${sg(-b)}}{${a}}\)`,T`Square-root (taking the positive root): \(${x} = \sqrt{\dfrac{${y}${sg(-b)}}{${a}}}\)`],
        [{a:`(${y}${sgc(-b)})/${a}`,msg:T`That’s \(${x}^2\). Square-root it (step 3).`},{a:`sqrt(${y}${sgc(-b)})/${a}`,msg:`Divide by ${a} before square-rooting (step 2).`}],{dom:[12,30],syms:['√']})},
    ()=>{const[x,y]=pair(),a=R.nz(-9,9);
      return out(3,T`${y} = \sqrt{${x}${sg(a)}}`,x,`${y}^2${sgc(-a)}`,T`${y}^2${sg(-a)}`,[y],[T`Square both sides: \(${y}^2 = ${x}${sg(a)}\)`,T`${a>0?'Subtract':'Add'} ${Math.abs(a)}: \(${x} = ${y}^2${sg(-a)}\)`],[{a:`(${y}${sgc(-a)})^2`,msg:'Square first, then deal with the number (step 1).'},{a:`${y}^2${sgc(a)}`,msg:`Moving ${a>0?'+':'−'}${Math.abs(a)} across changes its sign (step 2).`}],{syms:['²']})},
    ()=>{const[x,y]=pair(),a=R.nz(-6,6),b=R.int(2,7);let c;do c=R.nz(-9,9);while(c===a);
      return out(3,T`${x}${y}${sg(a)} = ${b}${x}${sg(c)}`,x,`(${c}${sgc(-a)})/(${y}-${b})`,T`\dfrac{${c-a}}{${y} - ${b}}`,[y],
        [T`Collect the \(${x}\) terms on one side: \(${x}${y} - ${b}${x} = ${c}${sg(-a)}\)`,T`Factorise out \(${x}\): \(${x}(${y} - ${b}) = ${c-a}\)`,T`Divide: \(${x} = \dfrac{${c-a}}{${y} - ${b}}\)`],
        [{a:`(${c-a})/(${y}+${b})`,msg:`Subtracting ${b}${x} gives ${x}(${y} − ${b}) (step 2).`},{a:`(${c+a})/(${y}-${b})`,msg:`Moving ${a>0?'+':'−'}${Math.abs(a)} across changes its sign (step 1).`}],
        {method:T`When the subject appears twice, collect both terms on one side and factorise it out.`,dom:[b+1,b+6]})},
    ()=>{const[x,y]=pair(),a=R.int(1,8),b=R.int(1,8);
      return out(3,T`${y} = \dfrac{${x} + ${a}}{${x} - ${b}}`,x,`(${a}+${b}*${y})/(${y}-1)`,T`\dfrac{${b}${y} + ${a}}{${y} - 1}`,[y],
        [T`Multiply by \(${x} - ${b}\): \(${y}(${x} - ${b}) = ${x} + ${a}\)`,T`Expand: \(${x}${y} - ${b}${y} = ${x} + ${a}\)`,T`Collect \(${x}\) terms: \(${x}${y} - ${x} = ${b}${y} + ${a}\)`,T`Factorise: \(${x}(${y} - 1) = ${b}${y} + ${a}\), so \(${x} = \dfrac{${b}${y} + ${a}}{${y} - 1}\)`],
        [{a:`(${a}-${b}*${y})/(${y}-1)`,msg:`Moving −${b}${y} across makes it +${b}${y} (step 3).`},{a:`(${a}+${b}*${y})/(${y}+1)`,msg:`Subtracting ${x} from ${x}${y} leaves ${x}(${y} − 1) (step 4).`}],
        {method:'Clear the fraction, then collect every term containing the subject on one side and factorise.',dom:[2,6]})},
    ()=>out(3,T`s = \tfrac12(u + v)t`,R.pick(['u','v'])==='u'?'u':'v',null,null,null,null,null),
  ];
  let f=(pick<.36?R.pick(L1):pick<.7?R.pick(L2):R.pick(L3))();
  if(f.ans===null){const s=f.q.match(/subject of/)&&f.q;const sub=f.q.match(/Make \\\((\w)\\\)/)[1];
    if(f.q.includes('v^2 = u^2 + 2as')){f=sub==='a'?out(2,T`v^2 = u^2 + 2as`,'a','(v^2-u^2)/(2*s)',T`\dfrac{v^2 - u^2}{2s}`,['v','u','s'],[T`Subtract \(u^2\): \(v^2 - u^2 = 2as\)`,T`Divide by \(2s\): \(a = \dfrac{v^2 - u^2}{2s}\)`],[{a:'(v-u)^2/(2*s)',msg:T`\(v^2 - u^2\) is not \((v - u)^2\) (step 1).`},{a:'(v^2-u^2)/2*s',msg:'Divide by the whole of 2s: it goes on the bottom (step 2).'}],{syms:['²']})
      :out(2,T`v^2 = u^2 + 2as`,'s','(v^2-u^2)/(2*a)',T`\dfrac{v^2 - u^2}{2a}`,['v','u','a'],[T`Subtract \(u^2\): \(v^2 - u^2 = 2as\)`,T`Divide by \(2a\): \(s = \dfrac{v^2 - u^2}{2a}\)`],[{a:'(v-u)^2/(2*a)',msg:T`\(v^2 - u^2\) is not \((v - u)^2\) (step 1).`}],{syms:['²']})}
    else{const o=sub==='u'?'v':'u';f=out(3,T`s = \tfrac12(u + v)t`,sub,`2*s/t-${o}`,T`\dfrac{2s}{t} - ${o}`,['s','t',o],[T`Multiply by 2: \(2s = (u + v)t\)`,T`Divide by \(t\): \(\dfrac{2s}{t} = u + v\)`,T`Subtract \(${o}\): \(${sub} = \dfrac{2s}{t} - ${o}\)`],[{a:`(2*s-${o})/t`,msg:`Divide by t before subtracting ${o}: ${o} isn’t multiplied by t on its own (step 2).`},{a:`s/(2*t)-${o}`,msg:'To undo × ½, multiply by 2 (step 1).'}])}}
  return f};

/* ---------- curriculum ---------- */
const UNITS=['Number foundations','Expressions','Linear equations','Inequalities','Simultaneous equations','Quadratics','Indices & surds','Sequences & graphs','Functions & polynomials','Exponentials & logs','Trigonometry'];
const TOPICS=[
 {id:'order',u:0,pre:[],t:'Order of operations',g:G.order,wp:1,s:'Work through a calculation in a fixed order so everyone gets the same answer: Brackets, Indices (powers and roots), Division and Multiplication left to right, then Addition and Subtraction left to right.',k:T`\text{Brackets} \to \text{Indices} \to \div\,\times \to +\,-`,w:'Multiplication is repeated addition, so 2 + 3 × 4 means 2 plus three fours, which is 14. Doing multiplication first keeps that meaning. Brackets exist for when you want a different order.'},
 {id:'neg',u:0,pre:[],t:'Negative numbers',g:G.neg,wp:1,s:'Two signs side by side combine: same signs give +, different signs give −. That covers multiplying, dividing, and subtracting a negative.',k:T`a-(-b)=a+b,\quad (-a)(-b)=ab,\quad (-a)^2=a^2,\quad -a^2=-(a^2)`,w:'Think of subtracting as turning round on the number line. Subtracting a negative turns you twice, so you face forwards again. With powers, the bracket decides what gets squared: (−3)² squares −3, while −3² squares only the 3.'},
 {id:'frac',u:0,pre:[],t:'Fractions',g:G.frac,wp:1,s:'To add or subtract, rewrite over a common denominator, then combine the numerators. To multiply, multiply tops and bottoms. To divide, flip the second fraction and multiply.',k:T`\frac ab+\frac cd=\frac{ad+bc}{bd},\qquad \frac ab\div\frac cd=\frac ab\times\frac dc`,w:'The denominator names the size of the pieces. You can only add pieces of the same size, which is why you need a common denominator. Dividing by c/d asks how many c/d pieces fit, which equals multiplying by d/c.'},
 {id:'like',u:1,pre:['neg'],t:'Collecting like terms',g:G.like,wp:1,s:'Like terms have exactly the same letters and powers (3x and −5x; 2x² and x², but not x and x²). Add their coefficients and keep the letter part. The sign in front of a term belongs to it.',k:T`4x + 3y - 7x + y = -3x + 4y`,w:'Letters stand for numbers, so 4x + 7x is four lots of something plus seven lots of the same thing. x and x² are different quantities (x = 3 gives 3 and 9), so they can’t merge.'},
 {id:'subs',u:1,pre:['order','neg'],t:'Substitution',g:G.subs,wp:1,s:'Replace each letter with its value, in brackets, then follow the order of operations. Brackets around negative values prevent most sign errors.',k:T`x=-2:\quad 3x^2 = 3\times(-2)^2 = 12`,w:'An expression is a recipe that works for any number; substitution runs it once. The bracket keeps the whole value, sign included, together when it is squared or multiplied.'},
 {id:'expand1',u:1,pre:['like'],t:'Expanding single brackets',g:G.expand1,wp:1,s:'Multiply every term inside the bracket by the term outside, tracking signs. A minus in front of a bracket multiplies every term inside by −1.',k:T`-3(2x-5) = -6x+15`,w:'a(b + c) = ab + ac is the distributive law: three bags, each holding b apples and c pears, contain 3b apples and 3c pears. With a negative multiplier, every sign inside flips.'},
 {id:'factor1',u:1,pre:['expand1'],t:'Factorising: common factors',g:G.factor1,wp:0,s:'Factorising is expanding in reverse. Find the highest common factor of every term (numbers and letters), write it outside, and divide each term by it to get what goes inside.',k:T`6x^2+9x = 3x(2x+3)`,w:'A factorised form shows structure: 3x(2x + 3) tells you at a glance that the expression is zero when x = 0. Taking out the highest factor means nothing more can come out of the bracket. Check by expanding back.'},
 {id:'lin2',u:2,pre:['neg'],t:'Two-step equations',g:G.lin2,wp:1,s:'Undo the operations in reverse order, doing the same thing to both sides. For ax + b = c, undo the +b first, then divide by a.',k:T`3x+7=22 \;\Rightarrow\; 3x=15 \;\Rightarrow\; x=5`,w:'An equation is a balance. Any operation done to both sides keeps it balanced. Undoing in reverse is like unwrapping: the last thing done to x is the first thing you remove.'},
 {id:'lin3',u:2,pre:['lin2','like'],t:'Unknowns on both sides',g:G.lin3,wp:1,s:'Collect the x-terms on one side (usually the side with more x’s, to keep the coefficient positive) and the numbers on the other, then divide.',k:T`5x+3=2x+15 \;\Rightarrow\; 3x=12 \;\Rightarrow\; x=4`,w:'Subtracting 2x from both sides is allowed because 2x is just a number you don’t know yet. Moving x-terms towards the larger coefficient avoids dividing by a negative.'},
 {id:'linbr',u:2,pre:['lin2','expand1'],t:'Equations with brackets',g:G.linbr,wp:0,s:'Either expand the brackets, or divide both sides by the number outside when it goes in exactly. Then solve as normal.',k:T`4(x-3)=20 \;\Rightarrow\; x-3=5 \;\Rightarrow\; x=8`,w:'Dividing first is quicker when the right-hand side is a multiple of the number outside. Expanding always works, but every term inside must be multiplied.'},
 {id:'linfrac',u:2,pre:['lin2','frac'],t:'Equations with fractions',g:G.linfrac,wp:1,s:'Clear the fractions by multiplying every term on both sides by the denominator, or by the lowest common multiple of the denominators. With one fraction on each side, cross-multiply.',k:T`\frac x3+\frac x4=7 \;\xrightarrow{\;\times 12\;}\; 4x+3x=84`,w:'Multiplying both sides by the same number keeps the balance. Choosing the LCM of the denominators turns every fraction into a whole number in one move.'},
 {id:'rearr',u:2,pre:['lin2'],t:'Rearranging formulae',g:G.rearr,wp:0,s:'Rearranging a formula is solving an equation whose answer is an expression. Undo what has been done to the target letter, in reverse order, applying each step to the whole of the other side.',k:T`v=u+at \;\Rightarrow\; v-u=at \;\Rightarrow\; t=\frac{v-u}{a}`,w:'The other letters behave like numbers you haven’t been told. Brackets matter: dividing v − u by a means dividing all of it, so write (v − u)/a. If the subject appears twice, collect it on one side and factorise it out.'},
 {id:'ineq',u:3,pre:['lin2'],t:'Linear inequalities',g:G.ineq,wp:1,s:'Solve like an equation, with one extra rule: when you multiply or divide both sides by a negative number, reverse the inequality sign. With a double inequality, do the same to all three parts.',k:T`-2x\gt 6 \;\Rightarrow\; x\lt -3`,w:'3 < 5, but multiply both by −1 and you get −3 and −5, where −3 > −5. Negatives reverse the order on the number line, so the sign must flip to stay true.'},
 {id:'sim',u:4,pre:['lin3'],t:'Simultaneous linear equations',g:G.sim,wp:1,s:'Two equations, two unknowns. Elimination: scale the equations so one variable has matching coefficients, then add or subtract to remove it. Substitution: rearrange one equation for a variable and substitute it into the other.',k:T`\begin{aligned}2x+3y&=12\\ 2x-y&=4\end{aligned}\;\Rightarrow\;4y=8`,w:'Each equation is a straight line; the solution is where they cross. Adding or subtracting equations is allowed because you’re adding equal amounts to both sides. Always check your answer in the equation you didn’t substitute into.'},
 {id:'exp2',u:5,pre:['expand1'],t:'Expanding double brackets',g:G.exp2,wp:1,s:'Multiply every term in the first bracket by every term in the second (four products for two binomials), then collect like terms.',k:T`(x+3)(x-5)=x^2-5x+3x-15=x^2-2x-15`,w:'Picture a rectangle with sides (x + 3) and (x − 5), split into four smaller rectangles. The area is the sum of all four pieces. Leaving out the two middle ones is the most common slip.'},
 {id:'fac2',u:5,pre:['exp2','factor1'],t:'Factorising quadratics',g:G.fac2,wp:0,s:'For x² + bx + c, find two numbers that multiply to c and add to b. For a difference of two squares, a² − b² = (a − b)(a + b). Take out any common factor first. When the x² coefficient isn’t 1, use the ac method.',k:T`x^2+bx+c=(x+p)(x+q)\ \text{ where } pq=c,\ p+q=b`,w:'Expanding (x + p)(x + q) gives x² + (p + q)x + pq, so the pair must add to b and multiply to c. If c is positive, both numbers share b’s sign; if c is negative, they have opposite signs.'},
 {id:'solveq',u:5,pre:['fac2'],t:'Solving quadratics by factorising',g:G.solveq,wp:1,s:'Rearrange so one side is zero, factorise, then set each bracket equal to zero.',k:T`(x-2)(x+5)=0 \;\Rightarrow\; x=2 \text{ or } x=-5`,w:'If two numbers multiply to zero, at least one of them is zero. That only works with zero on one side, which is why you rearrange first. Never divide by x: you would lose the solution x = 0.'},
 {id:'cts',u:5,pre:['exp2'],t:'Completing the square',g:G.cts,wp:0,s:'Halve the coefficient of x, write (x + half)², then subtract half² to cancel the extra constant that creates. The result shows the turning point, and solves equations exactly.',k:T`x^2+bx+c = \left(x+\tfrac b2\right)^2 - \left(\tfrac b2\right)^2 + c`,w:'(x + 3)² = x² + 6x + 9. So x² + 6x is (x + 3)² minus the 9 you didn’t ask for. In (x + p)² + q the square is never negative, so the minimum value is q, reached at x = −p.'},
 {id:'qf',u:5,pre:['solveq','surd'],t:'The quadratic formula',g:G.qf,wp:1,s:'When ax² + bx + c = 0 won’t factorise, use the formula. Rearrange to zero first, identify a, b and c with their signs, and work out the discriminant b² − 4ac first.',k:T`x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}`,w:'The formula is completing the square done once, in general. The ± gives the two places the parabola crosses the x-axis, equally spaced either side of x = −b/2a.'},
 {id:'disc',u:5,pre:['qf'],t:'The discriminant',g:G.disc,wp:0,s:'The discriminant D = b² − 4ac tells you how many real solutions a quadratic has without solving it: D > 0 gives two, D = 0 one (repeated), D < 0 none.',k:T`D=b^2-4ac`,w:'D sits under the square root in the formula. A positive number has two square roots (±), zero has one, and a negative number has no real square root. On the graph, the parabola crosses, touches or misses the x-axis.'},
 {id:'qineq',u:5,pre:['solveq','ineq'],t:'Quadratic inequalities',g:G.qineq,wp:0,s:'Find the critical values by solving the equation, sketch the U-shaped curve through them, then read off where it is below (< 0) or above (> 0) the x-axis.',k:T`(x-a)(x-b)\lt 0 \iff a\lt x\lt b,\qquad (x-a)(x-b)\gt 0 \iff x\lt a \text{ or } x\gt b`,w:'A U-shaped parabola dips below the axis only between its roots and is above it everywhere else. Never square-root both sides of x² < 9 to get x < 3: that misses −3 < x.'},
 {id:'simq',u:5,pre:['sim','solveq'],t:'Linear–quadratic simultaneous',g:G.simq,wp:0,s:'Substitute the linear equation into the quadratic one, rearrange to zero, and solve the quadratic. Then put each x back into the linear equation to find its y.',k:T`y=x+1,\ x^2+y^2=25 \;\Rightarrow\; x^2+(x+1)^2=25`,w:'A line can cross a curve at two points, touch it at one, or miss it. Each solution of the quadratic is the x-coordinate of a crossing point, so you always get answers in pairs (x, y).'},
 {id:'afrac',u:5,pre:['fac2','frac'],t:'Algebraic fractions',g:G.afrac,wp:0,s:'Factorise first, then cancel whole brackets that appear on top and bottom. To add, use a common denominator exactly as with number fractions. To solve, cross-multiply or multiply through by the denominators.',k:T`\frac{x^2-9}{x^2+5x+6}=\frac{(x-3)(x+3)}{(x+2)(x+3)}=\frac{x-3}{x+2}`,w:'Cancelling divides top and bottom by the same thing, which only works for factors. You can’t cancel x² from x² + 1 over x² + 3, just as you can’t cancel the 1s in 12/13.'},
 {id:'ind',u:6,pre:['order'],t:'Laws of indices',g:G.ind,wp:0,s:'Same base: multiplying adds the powers, dividing subtracts them, a power of a power multiplies them. A negative power means the reciprocal. A fractional power p/q means the q-th root, then the p-th power.',k:T`x^a x^b=x^{a+b},\ \ (x^a)^b=x^{ab},\ \ x^{-n}=\tfrac1{x^n},\ \ x^{p/q}=\left(\sqrt[q]{x}\right)^p`,w:'x³ × x² is (x·x·x)(x·x): five x’s multiplied. The other rules follow from keeping that pattern consistent: x⁰ = 1 because x³ ÷ x³ = 1, and x^½ squared must give x, so x^½ = √x.'},
 {id:'surd',u:6,pre:['ind'],t:'Surds',g:G.surd,wp:0,s:'Simplify √n by taking out the largest square factor. Rationalise a/√b by multiplying top and bottom by √b, and a/(b + √c) by multiplying by the conjugate b − √c.',k:T`\sqrt{ab}=\sqrt a\sqrt b,\qquad \frac{a}{\sqrt b}=\frac{a\sqrt b}{b}`,w:'Surds keep answers exact, which matters when an answer feeds into later work, including trigonometry, where √2 and √3 appear constantly. Like terms work for surds too: 2√3 + 5√3 = 7√3, but √2 + √3 doesn’t simplify.'},
 {id:'binom',u:6,pre:['ind','expand1'],t:'Binomial expansion',g:G.binom,wp:0,s:'(a + b)ⁿ expands into n + 1 terms. The term with bʳ is nCr · aⁿ⁻ʳ · bʳ. Any number in front of x is raised to the power along with x.',k:T`(a+b)^n=\sum_{r=0}^{n}\binom nr a^{n-r}b^r`,w:'Expanding (a + b)ⁿ means choosing a or b from each of the n brackets. nCr counts the ways to choose b from exactly r of them. That’s why the coefficients follow Pascal’s triangle.'},
 {id:'nth',u:7,pre:['lin2'],t:'Sequences',g:G.nth,wp:1,s:'An arithmetic sequence adds the same difference d each time: nth term dn + (first term − d). If the first differences change but the second differences are constant, the sequence is quadratic: the n² coefficient is half the second difference.',k:T`u_n = dn + (u_1 - d)`,w:'An arithmetic sequence behaves like the d times table, shifted. The shift is the zeroth term, one step before the first. For a quadratic sequence, n² has second difference 2, which is why you halve.'},
 {id:'line',u:7,pre:['lin2','frac'],t:'Straight-line graphs',g:G.line,wp:1,s:'Gradient m = change in y ÷ change in x. A line is y = mx + c, where c is the y-intercept. Parallel lines share a gradient; perpendicular gradients multiply to −1.',k:T`m=\frac{y_2-y_1}{x_2-x_1},\qquad y=mx+c,\qquad m_1 m_2=-1`,w:'The gradient is a rate of change: how far y rises for each step of 1 in x. In real contexts m is a rate (£ per hour) and c is a fixed starting amount (a call-out fee).'},
 {id:'gread',u:7,pre:['line','solveq'],t:'Reading graphs',g:G.gread,wp:0,s:'Many questions give you a graph instead of an equation. Roots are where the curve meets the x-axis (y = 0); the y-intercept is where it meets the y-axis (x = 0). Solve f(x) = k by drawing the line y = k and reading off the crossings. A straight line’s equation comes from its intercept and its rise over run.',k:T`f(x)=0:\ \text{x-axis crossings},\quad f(x)=k:\ \text{crossings with } y=k,\quad m=\frac{\text{rise}}{\text{run}}`,w:'Every point on a graph is a pair (x, y) that makes the equation true. So solving an equation means finding where the graph has the y-value you want, and two equations are both true where their graphs cross. That is why reading graphs and solving algebraically always agree.'},
 {id:'trans',u:7,pre:['line','cts'],t:'Graph transformations',g:G.trans,wp:0,s:'Changes outside the function act on y the way they look: f(x) + a moves up, af(x) stretches vertically, −f(x) reflects in the x-axis. Changes inside the bracket act on x the opposite way: f(x − a) moves right, f(ax) squashes, f(−x) reflects in the y-axis.',k:T`f(x-a)\to\text{right } a,\quad f(x)+a\to\text{up } a,\quad af(x)\to y\times a,\quad f(ax)\to x\div a`,w:'For y = f(x − 3) to give the same output as f did at x = 0, you need x = 3. Every point arrives 3 units later, so the graph shifts right. Inside changes are inverses, which is why they look backwards.'},
 {id:'func',u:8,pre:['subs','rearr'],t:'Composite & inverse functions',g:G.func,wp:0,s:'A function is a rule. fg(x) means apply g first, then f. The inverse f⁻¹ undoes f: write y = f(x), rearrange for x, then rename.',k:T`fg(x)=f(g(x)),\qquad f(x)=3x-2 \Rightarrow f^{-1}(x)=\frac{x+2}{3}`,w:'fg(x) reads right to left because the function next to x acts first, as in f(g(x)). The inverse reverses each step in reverse order. f⁻¹(x) is not 1/f(x).'},
 {id:'poly',u:8,pre:['subs','solveq'],t:'Remainder & factor theorem',g:G.poly,wp:0,s:'Remainder theorem: dividing p(x) by (x − a) leaves remainder p(a). Factor theorem: if p(a) = 0, then (x − a) is a factor. Once you have one factor of a cubic, divide it out to leave a quadratic.',k:T`p(x)=(x-a)q(x)+r \;\Rightarrow\; p(a)=r`,w:'Put x = a into p(x) = (x − a)q(x) + r: the first part becomes zero, leaving r. Watch the sign: dividing by (x + 2) means a = −2.'},
 {id:'log',u:9,pre:['ind'],t:'Logarithms',g:G.log,wp:1,s:'log_b N asks: what power of b gives N? Adding logs multiplies, subtracting divides, and a power comes down in front. Take logs of both sides to solve an equation where the unknown is in the power.',k:T`\log_b N = k \iff b^k=N,\quad \log M+\log N=\log MN,\quad \log M^k = k\log M`,w:'Logs are the inverse of exponentials, as square roots are the inverse of squaring. log(bˣ) = x log b brings the unknown down from the power, where you can solve for it.'},
 {id:'tri',u:10,pre:['rearr'],t:'Right-angled trigonometry',g:G.tri,wp:1,s:'Label the sides from the angle you’re using: hypotenuse (longest, opposite the right angle), opposite, adjacent. SOH CAH TOA tells you which ratio links the two sides you have. Use the inverse functions to find an angle. Keep your calculator in degrees.',k:T`\sin\theta=\frac{\text{opp}}{\text{hyp}},\quad \cos\theta=\frac{\text{adj}}{\text{hyp}},\quad \tan\theta=\frac{\text{opp}}{\text{adj}}`,w:'All right-angled triangles with the same angle θ are scaled copies of each other, so the ratio of any two sides depends only on θ. sin, cos and tan are names for those fixed ratios.'},
 {id:'exact',u:10,pre:['surd','tri'],t:'Exact trig values',g:G.exact,wp:0,s:'Learn sin, cos and tan of 30°, 45° and 60° from two triangles: half an equilateral triangle (1, √3, 2) and a right isosceles triangle (1, 1, √2). For angles beyond 90°, use the reference angle and CAST for the sign.',k:T`\sin30°=\tfrac12,\ \ \sin45°=\tfrac{\sqrt2}{2},\ \ \sin60°=\tfrac{\sqrt3}{2},\ \ \tan45°=1`,w:'Cut an equilateral triangle of side 2 in half: the pieces have sides 1, √3 and 2 with angles 30° and 60°. A right isosceles triangle with legs 1 has hypotenuse √2 and two 45° angles. Every exact value comes from reading these two shapes.'},
 {id:'sinerule',u:10,pre:['tri'],t:'The sine rule',g:G.sinerule,wp:0,s:'In any triangle, each side divided by the sine of its opposite angle gives the same number. Use it when you know a side and its opposite angle. When finding an angle, put the sines on top, and watch for the ambiguous case.',k:T`\frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}`,w:'Drop a perpendicular from C: its height is b sin A and also a sin B. Setting those equal gives a/sin A = b/sin B. The ambiguous case arises because sin θ = sin(180° − θ), so two different triangles can share the same data.'},
 {id:'cosrule',u:10,pre:['tri'],t:'The cosine rule',g:G.cosrule,wp:0,s:'Use it with two sides and the angle between them (to find the third side), or with all three sides (to find an angle). The side on its own on the left is the one opposite the angle.',k:T`c^2=a^2+b^2-2ab\cos C,\qquad \cos C=\frac{a^2+b^2-c^2}{2ab}`,w:'It’s Pythagoras with a correction. When C = 90°, cos C = 0 and you get c² = a² + b². An obtuse C has negative cosine, which makes c longer, as you’d expect.'},
 {id:'area',u:10,pre:['tri'],t:'Area of a triangle (½ab sin C)',g:G.area,wp:0,s:'Area = ½ab sin C, where C is the angle between sides a and b. Rearrange it to find a missing side or angle.',k:T`\text{Area}=\tfrac12 ab\sin C`,w:'½ × base × height still holds. With base a, the perpendicular height is b sin C, so the area is ½ab sin C. Because sin C = sin(180° − C), an acute and an obtuse angle can give the same area.'},
 {id:'tgraph',u:10,pre:['tri','trans'],t:'Trig graphs',g:G.tgraph,wp:0,s:'y = sin x and y = cos x wave between −1 and 1 every 360°; y = tan x repeats every 180°. y = a sin(bx) + c has amplitude |a|, period 360°/b, and centre line y = c.',k:T`y=a\sin(bx)+c:\quad \text{amplitude }|a|,\ \text{period }\tfrac{360°}{b}`,w:'These are graph transformations applied to the basic wave: a stretches vertically, b squashes horizontally (inside the bracket, so it divides), and c moves the wave up.'},
 {id:'teq',u:10,pre:['tgraph','tri'],t:'Solving trig equations',g:G.teq,wp:0,s:'Rearrange to sin x = k (or cos, tan), find the principal value with the inverse function, then use symmetry to find every solution in the range: sin uses 180° − x, cos uses 360° − x, tan adds 180°.',k:T`\sin x=k:\ x,\ 180°-x\qquad \cos x=k:\ x,\ 360°-x\qquad \tan x=k:\ x,\ x+180°`,w:'The calculator returns one angle, but the wave hits each height twice per cycle. The symmetry of each graph tells you where the second crossing is. For sin 2x, the wave runs twice as fast, so there are twice as many solutions.'},
 {id:'tident',u:10,pre:['exact','teq'],t:'Trig identities',g:G.tident,wp:0,s:'Two identities do most of the work: tan θ = sin θ / cos θ and sin²θ + cos²θ = 1. Use them to simplify expressions and to turn mixed equations into a quadratic in one function.',k:T`\tan\theta=\frac{\sin\theta}{\cos\theta},\qquad \sin^2\theta+\cos^2\theta=1`,w:'On a unit circle the point at angle θ is (cos θ, sin θ). Its distance from the centre is 1, so Pythagoras gives sin²θ + cos²θ = 1. Dividing the y-coordinate by the x-coordinate gives the gradient, which is tan θ.'},
 {id:'radians',u:10,pre:['frac','tri'],t:'Radians, arcs & sectors',g:G.radians,wp:0,s:'π radians = 180°. In radians, arc length is rθ and sector area is ½r²θ, with no factors of 360 to carry around.',k:T`\pi=180°,\qquad s=r\theta,\qquad A=\tfrac12 r^2\theta`,w:'One radian is the angle where the arc length equals the radius. A full turn has an arc of 2πr, so it’s 2π radians. Measuring angles this way makes arc length and area formulas simple, and it’s the unit calculus expects.'},
];
const byId=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
function gen(t,L,W,seed){const r=seed===undefined?null:rng(seed);let best=null,bs=1e9;for(let i=0;i<60;i++){const R_=r||rng((Math.random()*2**31)|0);const ex=t.g(R_,W);ex.lv=ex.lv||1;
  const s=Math.abs(ex.lv-L)*2+(W!==undefined&&!!ex.word!==W?5:0);if(s<bs){best=ex;bs=s;if(!s)break}}return best}
if(typeof module!=='undefined')module.exports={plotSVG,numLine,graphHTML,keyPts,pretty,TOPICS,G,check,typedAns,showAns,rng,compile,gen,UNITS,triFig,parseRange};
/*UI*/

</script>
<script>
/* ---------- lessons (teaching content) ---------- */
const LESSONS={
exp2:{
 what:T`<p>Expanding turns a product of brackets into a sum of separate terms: \((x+3)(x+5)\) becomes \(x^2+8x+15\). Nothing about the value changes, only how it is written.</p>
<p>You need it whenever brackets get in the way: to collect like terms, to get an equation into the form \(ax^2+bx+c=0\) before solving it, or to compare two expressions. It is also the reverse of factorising, so once you see how the numbers combine here, factorising stops feeling like guesswork.</p>
<p>A useful picture: \((x+3)(x+5)\) is the area of a rectangle with sides \(x+3\) and \(x+5\). Split it into four pieces: \(x\times x\), \(x\times 5\), \(3\times x\) and \(3\times 5\). The area is the sum of all four.</p>`,
 when:T`<ul><li>The question says <b>expand</b>, <b>multiply out</b> or <b>simplify</b>, and you see two brackets side by side or a bracket squared.</li>
<li>You are solving an equation and the brackets stop you collecting everything on one side.</li>
<li><b>Don’t</b> expand when the question asks you to factorise, or when an equation is already in the form \((x-2)(x+5)=0\): that form is the one you want for solving.</li></ul>`,
 steps:[T`Multiply <b>every</b> term in the first bracket by <b>every</b> term in the second. Two terms times two terms gives four products.`,T`Keep each sign with the term after it: in \((x-5)\) the second term is \(-5\).`,T`Collect like terms. Usually the two middle products are both \(x\)-terms and combine into one.`,T`For a squared bracket, write it out twice first: \((2x-3)^2=(2x-3)(2x-3)\).`],
 examples:[
  {q:T`Expand \((x+4)(x+2)\)`,rows:[[T`x\cdot x=x^2`,'first × first'],[T`x\cdot 2=2x`,'first × last'],[T`4\cdot x=4x`,'second × first'],[T`4\cdot 2=8`,'second × last'],[T`x^2+6x+8`,'collect: 2x + 4x = 6x']],a:T`Notice the pattern: the middle number is \(4+2\) and the last is \(4\times 2\). Factorising runs this backwards.`},
  {q:T`Expand \((x-5)(x+3)\)`,rows:[[T`x^2+3x-5x-15`,'four products, signs kept: −5 × 3 = −15'],[T`x^2-2x-15`,'3x − 5x = −2x']]},
  {q:T`Expand \((2x-3)^2\)`,rows:[[T`(2x-3)(2x-3)`,'write it out twice'],[T`4x^2-6x-6x+9`,'(−3)×(−3) = +9'],[T`4x^2-12x+9`,'collect the middle terms']],a:T`A common slip is writing \(4x^2+9\): squaring a bracket always gives a middle term.`}],
 mistakes:[T`\((a+b)^2\) is <b>not</b> \(a^2+b^2\). Write both brackets out and you get the \(2ab\) middle term.`,T`Sign slips: negative × negative is positive, so \((-3)(-3)=+9\).`,T`Square the number as well as the letter: \((2x)^2=4x^2\), not \(2x^2\).`],
 checks:[{q:T`Expand \((x+6)(x-2)\)`,kind:'expr',ans:'x^2+4x-12',show:T`x^2+4x-12`,fmt:'e.g. <code>x^2 + 3x - 10</code>'},{q:T`Expand \((x-4)^2\)`,kind:'expr',ans:'x^2-8x+16',show:T`x^2-8x+16`,fmt:'e.g. <code>x^2 - 6x + 9</code>'},{q:T`Expand \((3x+1)(x-2)\)`,kind:'expr',ans:'3x^2-5x-2',show:T`3x^2-5x-2`,fmt:'e.g. <code>2x^2 + x - 6</code>'}]},
fac2:{
 what:T`<p>Factorising a quadratic means writing it as a product of brackets: \(x^2+5x+6=(x+2)(x+3)\). It is expanding in reverse.</p>
<p>Why bother? A product is easy to make zero: if \((x+2)(x+3)=0\), one of the brackets must be zero, so \(x=-2\) or \(x=-3\). That makes factorising the quickest way to solve many quadratics. The brackets also tell you where the graph crosses the \(x\)-axis, and they are what you cancel when simplifying algebraic fractions.</p>`,
 when:T`<ul><li>The question says <b>factorise</b>, or you need to solve \(ax^2+bx+c=0\) and the numbers look friendly (small whole numbers).</li>
<li>You want to cancel something in an algebraic fraction.</li>
<li><b>Quick test:</b> work out \(b^2-4ac\). If it is a perfect square (0, 1, 4, 9, 16…), the quadratic factorises with whole numbers or simple fractions. If not, don’t waste time: use the quadratic formula or complete the square instead.</li></ul>`,
 steps:[T`<b>Common factor first.</b> \(2x^2+10x+12=2(x^2+5x+6)\). It makes everything after this easier.`,T`<b>Difference of two squares?</b> Two square terms with a minus between them: \(a^2-b^2=(a-b)(a+b)\).`,T`<b>\(x^2+bx+c\):</b> find two numbers that <b>multiply to \(c\)</b> and <b>add to \(b\)</b>. Sign shortcut: if \(c\) is positive both numbers have the sign of \(b\); if \(c\) is negative they have opposite signs.`,T`<b>\(ax^2+bx+c\) with \(a\neq1\):</b> find two numbers that multiply to \(ac\) and add to \(b\), split the middle term with them, then factorise in pairs.`,T`<b>Check</b> by expanding your answer. It takes ten seconds and catches sign errors.`],
 examples:[
  {q:T`Factorise \(x^2+7x+12\)`,rows:[[T`12=1\times12=2\times6=3\times4`,'pairs that multiply to 12'],[T`3+4=7`,'the pair that adds to 7'],[T`(x+3)(x+4)`,'check: x² + 4x + 3x + 12 ✓']]},
  {q:T`Factorise \(x^2-2x-15\)`,rows:[[T`-15:\ 3\times(-5)`,'c negative, so opposite signs'],[T`3+(-5)=-2`,'adds to b'],[T`(x+3)(x-5)`,'']]},
  {q:T`Factorise \(2x^2+7x+3\)`,rows:[[T`ac=6,\ 6\times1,\ 6+1=7`,'multiply to ac, add to b'],[T`2x^2+6x+x+3`,'split the middle term'],[T`2x(x+3)+1(x+3)`,'factorise each pair'],[T`(2x+1)(x+3)`,'the common bracket comes out']]},
  {q:T`Factorise \(9x^2-25\)`,rows:[[T`(3x)^2-5^2`,'both terms are squares, minus between'],[T`(3x-5)(3x+5)`,'difference of two squares']]}],
 mistakes:[T`Skipping the common factor: \(2x^2+10x+12\) factorised as \((2x+4)(x+3)\) still has a 2 hiding in the first bracket.`,T`Mixing up the roles: the numbers <b>multiply</b> to \(c\) and <b>add</b> to \(b\), not the other way round.`,T`Sign slips. Expand to check: the middle term will tell you straight away.`],
 checks:[{q:T`Factorise \(x^2+9x+20\)`,kind:'factor',ans:'(x+4)(x+5)',show:T`(x+4)(x+5)`,fmt:'e.g. <code>(x + 2)(x - 7)</code>',form:'brackets'},{q:T`Factorise \(x^2-x-12\)`,kind:'factor',ans:'(x-4)(x+3)',show:T`(x-4)(x+3)`,fmt:'e.g. <code>(x + 2)(x - 7)</code>',form:'brackets'},{q:T`Factorise \(x^2-49\)`,kind:'factor',ans:'(x-7)(x+7)',show:T`(x-7)(x+7)`,fmt:'e.g. <code>(x - 1)(x + 1)</code>',form:'brackets'}]},
solveq:{
 what:T`<p>Solving a quadratic equation means finding every value of \(x\) that makes it true. A quadratic can have <b>two</b>, <b>one</b> or <b>no</b> real solutions, matching the graph crossing the \(x\)-axis twice, touching it once, or missing it.</p>
<p>Factorising is the fastest exact method when it works. It rests on one fact: <b>if two things multiply to zero, at least one of them is zero</b>. So once you have \((x-2)(x-3)=0\), the answers are \(x=2\) and \(x=3\).</p>
<p>Many real problems turn into quadratics: areas (length × width), falling objects, profit curves. Solving the quadratic answers the question.</p>`,
 when:T`<ul><li>The equation has an \(x^2\) term and it <b>factorises</b> (friendly numbers, or \(b^2-4ac\) is a perfect square).</li>
<li><b>No constant term</b> (\(3x^2-12x=0\)): always factorise by taking out \(x\).</li>
<li><b>No \(x\) term</b> (\(x^2=9\)): just square-root both sides and remember \(\pm\).</li>
<li>If it won’t factorise, or the question asks for decimals, use the <a href="#t-qf">quadratic formula</a> instead.</li></ul>`,
 steps:[T`<b>Rearrange</b> so one side is zero: \(ax^2+bx+c=0\). The zero rule only works with zero on one side.`,T`<b>Factorise</b> the left-hand side.`,T`Set <b>each bracket equal to zero</b>.`,T`Solve each little equation. The sign flips: \(x+7=0\) gives \(x=-7\).`,T`<b>Check</b> in context: a length or a time can’t be negative, so reject those.`],
 examples:[
  {q:T`Solve \(x^2-5x+6=0\)`,rows:[[T`(x-2)(x-3)=0`,'factorise'],[T`x-2=0\ \text{or}\ x-3=0`,'each bracket = 0'],[T`x=2\ \text{or}\ x=3`,'']]},
  {q:T`Solve \(x^2+4x=21\)`,rows:[[T`x^2+4x-21=0`,'zero on one side first'],[T`(x+7)(x-3)=0`,'−21: 7 × (−3), sum 4'],[T`x=-7\ \text{or}\ x=3`,'']],a:T`Writing \(x(x+4)=21\) and saying \(x=21\) is a classic trap: the zero rule needs a zero.`},
  {q:T`Solve \(3x^2=12x\)`,rows:[[T`3x^2-12x=0`,'rearrange'],[T`3x(x-4)=0`,'take out 3x'],[T`x=0\ \text{or}\ x=4`,'']],a:T`Dividing both sides by \(x\) would lose the answer \(x=0\).`},
  {q:T`A rectangle is 3 m longer than it is wide and has area 40 m². Find its width.`,rows:[[T`w(w+3)=40`,'width × length'],[T`w^2+3w-40=0`,'rearrange'],[T`(w+8)(w-5)=0`,''],[T`w=5\ \text{m}`,'reject w = −8: a width can’t be negative']]}],
 mistakes:[T`Trying to solve before getting zero on one side.`,T`Dividing by \(x\): it throws away the solution \(x=0\). Factorise instead.`,T`Forgetting the sign flip when solving each bracket.`,T`\(x^2=9\) has two solutions, \(3\) and \(-3\).`],
 checks:[{q:T`Solve \(x^2+x-20=0\)`,kind:'set',ans:[4,-5],show:T`x=4,\ x=-5`,fmt:'all solutions, e.g. <code>2, -3</code>'},{q:T`Solve \(x^2=6x\)`,kind:'set',ans:[0,6],show:T`x=0,\ x=6`,fmt:'all solutions, e.g. <code>2, -3</code>'},{q:T`Solve \(2x^2-x-3=0\)`,kind:'set',ans:[-1,1.5],tol:5e-4,show:T`x=-1,\ x=\tfrac32`,fmt:'all solutions, e.g. <code>2, -1/3</code>'}]},
cts:{
 what:T`<p>Completing the square rewrites \(x^2+bx+c\) as \((x+p)^2+q\). For example \(x^2+6x+5=(x+3)^2-4\).</p>
<p>This form is useful for three reasons:</p>
<ul><li><b>It shows the turning point.</b> \((x+3)^2\) is never negative, so \((x+3)^2-4\) is smallest when the bracket is zero, at \(x=-3\). The minimum value is \(-4\), and the graph’s turning point is \((-3,\,-4)\).</li>
<li><b>It solves any quadratic exactly</b>, even ones that don’t factorise, giving answers like \(-2\pm\sqrt5\).</li>
<li><b>It is where the quadratic formula comes from.</b> The formula is just this method done once with letters.</li></ul>`,
 when:T`<ul><li>The question says “in the form \((x+p)^2+q\)” or “complete the square”.</li>
<li>You are asked for the <b>turning point</b>, <b>minimum</b> or <b>maximum value</b> of a quadratic.</li>
<li>You need <b>exact</b> (surd) solutions and \(a=1\) with an even \(b\): it is often quicker than the formula then.</li>
<li>For decimals, or messy coefficients, the <a href="#t-qf">formula</a> is usually faster.</li></ul>`,
 steps:[T`<b>Halve</b> the coefficient of \(x\): that is \(p\).`,T`Write \((x+p)^2\). Expanded, it gives \(x^2+bx+p^2\): the right \(x\)-terms but an extra \(p^2\).`,T`<b>Subtract \(p^2\)</b> to cancel the extra, then add the original \(c\): \((x+p)^2-p^2+c\).`,T`To <b>solve</b> \(=0\): move the number across, square-root both sides (\(\pm\)!), then rearrange.`,T`If \(a\neq1\), take \(a\) out of the first two terms first and complete the square inside.`],
 examples:[
  {q:T`Write \(x^2+6x+5\) in the form \((x+p)^2+q\)`,rows:[[T`6\div2=3`,'halve the x-coefficient'],[T`(x+3)^2=x^2+6x+9`,'9 too many'],[T`(x+3)^2-9+5`,'take the 9 away, keep the +5'],[T`(x+3)^2-4`,'turning point (−3, −4)']]},
  {q:T`Write \(x^2-10x+18\) in completed-square form`,rows:[[T`(x-5)^2-25+18`,'half of −10 is −5'],[T`(x-5)^2-7`,'minimum value −7 at x = 5']]},
  {q:T`Solve \(x^2+4x-1=0\), giving exact answers`,rows:[[T`(x+2)^2-4-1=0`,'complete the square'],[T`(x+2)^2=5`,'move the number across'],[T`x+2=\pm\sqrt5`,'square root: two signs'],[T`x=-2\pm\sqrt5`,'']]},
  {q:T`Write \(2x^2+12x+7\) in the form \(a(x+p)^2+q\)`,rows:[[T`2(x^2+6x)+7`,'take 2 out of the x-terms'],[T`2[(x+3)^2-9]+7`,'complete the square inside'],[T`2(x+3)^2-18+7`,'the −9 is multiplied by 2'],[T`2(x+3)^2-11`,'']]}],
 mistakes:[T`Forgetting to subtract \(p^2\), or adding it instead.`,T`Not halving: \(x^2+6x\) becomes \((x+3)^2\), not \((x+6)^2\).`,T`Losing the \(\pm\) when square-rooting.`,T`Turning point signs: \((x+3)^2\) is smallest at \(x=-3\), not \(+3\).`,T`With \(a\neq1\), forgetting to multiply the \(-p^2\) by \(a\).`],
 checks:[{q:T`Write \(x^2+8x+3\) in the form \((x+p)^2+q\)`,kind:'cts',ans:'(x+4)^2-13',show:T`(x+4)^2-13`,fmt:'e.g. <code>(x - 2)^2 + 5</code>',form:'square'},{q:T`What is the minimum value of \(x^2-6x+11\)?`,kind:'num',ans:2,show:'2',fmt:'a number'},{q:T`Solve \(x^2-2x-4=0\), giving exact answers`,kind:'set',ans:[1+Math.sqrt(5),1-Math.sqrt(5)],tol:1e-4,typed:'1+sqrt(5), 1-sqrt(5)',show:T`x=1\pm\sqrt5`,fmt:'both, e.g. <code>3+√2, 3-√2</code>',form:'surd'}]},
qf:{
 what:T`<p>The quadratic formula solves <b>any</b> equation \(ax^2+bx+c=0\):</p><p>\[x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}\]</p>
<p>It always works, even when factorising is impossible. The \(\pm\) gives the two solutions, and the part under the square root, \(b^2-4ac\), tells you how many solutions there are before you finish (see <a href="#t-disc">the discriminant</a>).</p>`,
 when:T`<ul><li>The quadratic <b>won’t factorise</b>, or you can’t spot the factors within half a minute.</li>
<li>The question asks for answers to <b>decimal places</b> or <b>significant figures</b>. That is a strong hint: factorising only ever gives whole numbers or simple fractions.</li>
<li>The coefficients are messy (large numbers, decimals).</li>
<li>For exact answers it gives surds; completing the square is an equally good route.</li></ul>`,
 steps:[T`Rearrange to \(ax^2+bx+c=0\).`,T`Write down \(a\), \(b\) and \(c\) <b>with their signs</b>.`,T`Work out the discriminant \(b^2-4ac\) on its own first. It keeps the arithmetic tidy.`,T`Substitute: \(x=\dfrac{-b\pm\sqrt{\text{discriminant}}}{2a}\). Do the \(+\) and the \(-\) separately.`,T`Round only at the very end.`],
 examples:[
  {q:T`Solve \(x^2+3x-5=0\) to 2 d.p.`,rows:[[T`a=1,\ b=3,\ c=-5`,''],[T`b^2-4ac=9-4(1)(-5)=29`,'−4 × −5 = +20'],[T`x=\dfrac{-3\pm\sqrt{29}}{2}`,''],[T`x\approx1.19\ \text{or}\ -4.19`,'']]},
  {q:T`Solve \(2x^2-7x+4=0\) to 2 d.p.`,rows:[[T`a=2,\ b=-7,\ c=4`,''],[T`49-32=17`,'b² = (−7)² = 49'],[T`x=\dfrac{7\pm\sqrt{17}}{4}`,'−b = +7; 2a = 4'],[T`x\approx2.78\ \text{or}\ 0.72`,'']]},
  {q:T`Solve \(3x^2=5x+1\) to 2 d.p.`,rows:[[T`3x^2-5x-1=0`,'rearrange first'],[T`25-4(3)(-1)=37`,''],[T`x=\dfrac{5\pm\sqrt{37}}{6}\approx1.85\ \text{or}\ -0.18`,'']]}],
 mistakes:[T`When \(b\) is negative, \(-b\) is positive: \(b=-7\) gives \(-b=7\).`,T`With a negative \(c\), \(-4ac\) becomes positive: \(-4(1)(-5)=+20\).`,T`Divide the <b>whole</b> top by \(2a\), not just the square root.`,T`It is \(2a\) on the bottom, not 2.`,T`Rounding \(\sqrt{b^2-4ac}\) before dividing: keep full accuracy until the end.`],
 checks:[{q:T`Solve \(x^2+5x+2=0\), to 2 decimal places`,kind:'set',ans:[-0.44,-4.56],tol:.006,show:T`x\approx-0.44,\ x\approx-4.56`,fmt:'both, e.g. <code>1.27, -3.94</code>'},{q:T`Solve \(2x^2-3x-4=0\), to 2 decimal places`,kind:'set',ans:[2.35,-0.85],tol:.006,show:T`x\approx2.35,\ x\approx-0.85`,fmt:'both, e.g. <code>1.27, -3.94</code>'}]},
disc:{
 what:T`<p>The discriminant is the part of the quadratic formula under the square root: \(D=b^2-4ac\). It tells you how many real solutions \(ax^2+bx+c=0\) has, <b>without solving it</b>:</p>
<ul><li>\(D>0\): two different solutions. The graph crosses the \(x\)-axis twice.</li><li>\(D=0\): one repeated solution. The graph just touches the axis.</li><li>\(D<0\): no real solutions. The graph misses the axis (you can’t square-root a negative).</li></ul>
<p>It also tells you whether a quadratic factorises nicely: a perfect-square \(D\) means yes.</p>`,
 when:T`<ul><li>The question asks <b>how many</b> solutions or roots there are, or whether there are any <b>real</b> roots.</li>
<li>You see “<b>equal roots</b>”, “<b>repeated root</b>”, “<b>distinct roots</b>” or “<b>no real roots</b>”, usually with an unknown constant \(k\) to find.</li>
<li>You need to know whether a line <b>touches</b>, <b>crosses</b> or <b>misses</b> a curve: substitute, rearrange to a quadratic, and look at \(D\).</li></ul>`,
 steps:[T`Rearrange to \(ax^2+bx+c=0\) and read off \(a\), \(b\), \(c\) with signs.`,T`Work out \(D=b^2-4ac\).`,T`Compare with zero.`,T`With an unknown \(k\): write the condition (\(D=0\) for equal roots, \(D>0\) for two distinct roots, \(D<0\) for none) and solve it for \(k\).`],
 examples:[
  {q:T`How many real solutions does \(x^2-6x+9=0\) have?`,rows:[[T`D=36-4(1)(9)=0`,''],[T`\text{one repeated root}`,'it is (x − 3)², touching the axis at 3']]},
  {q:T`How many real solutions does \(2x^2+3x+5=0\) have?`,rows:[[T`D=9-40=-31`,''],[T`\text{none}`,'D < 0: the graph is entirely above the axis']]},
  {q:T`Find \(k\) so that \(x^2+kx+16=0\) has equal roots.`,rows:[[T`k^2-4(1)(16)=0`,'equal roots: D = 0'],[T`k^2=64`,''],[T`k=\pm8`,'both signs work']]},
  {q:T`For which \(k\) does \(x^2+4x+k=0\) have two distinct roots?`,rows:[[T`16-4k>0`,'distinct: D > 0'],[T`k<4`,'']]}],
 mistakes:[T`The sign of \(-4ac\): with \(c\) negative it becomes \(+\).`,T`Forgetting the negative answer when solving \(k^2=64\).`,T`Getting the inequality the wrong way round. Check with a value: \(k=0\) should satisfy \(16-4k>0\).`,T`“Real roots” allows \(D\ge0\); “distinct” means \(D>0\).`],
 checks:[{q:T`How many real solutions does \(3x^2-2x+1=0\) have?`,kind:'num',ans:0,show:'0',fmt:'<code>0</code>, <code>1</code> or <code>2</code>'},{q:T`Find the positive value of \(k\) for which \(x^2+kx+25=0\) has equal roots.`,kind:'num',ans:10,show:'k = 10',fmt:'a number'},{q:T`For which values of \(k\) does \(x^2-6x+k=0\) have no real solutions?`,kind:'ineq',ans:{v:'k',op:'>',k:9},show:T`k\gt9`,fmt:'e.g. <code>k &lt; 4</code>'}]},
qineq:{
 what:T`<p>A quadratic inequality like \(x^2-5x+6<0\) asks for a <b>range</b> of \(x\) values, not single answers. You find it by asking: where is the graph <b>below</b> (or <b>above</b>) the \(x\)-axis?</p>
<p>This comes up whenever you want to know when a quantity is positive, negative, or above a level: for example, the times when a ball is higher than 10 m.</p>`,
 when:T`<ul><li>A quadratic with \(<\), \(>\), \(\le\) or \(\ge\) instead of \(=\).</li>
<li>Never square-root both sides of something like \(x^2>25\): you would lose half the answer. Sketch instead.</li></ul>`,
 steps:[T`Rearrange so one side is zero.`,T`Solve the equation \(=0\). These <b>critical values</b> are where the graph crosses the axis.`,T`Sketch the parabola through them. With a positive \(x^2\) it is U-shaped.`,T`For \(<0\) take the part <b>below</b> the axis: <b>between</b> the critical values. For \(>0\) take the parts <b>above</b>: <b>outside</b> them, giving two separate pieces.`,T`Use \(\le\)/\(\ge\) only if the question includes “or equal to”.`],
 examples:[
  {q:T`Solve \(x^2-x-12<0\)`,rows:[[T`(x-4)(x+3)=0`,'critical values −3 and 4'],[T`-3<x<4`,'U-shape is below the axis between the roots']]},
  {q:T`Solve \(x^2+2x-8\ge0\)`,rows:[[T`(x+4)(x-2)=0`,'critical values −4 and 2'],[T`x\le-4\ \text{or}\ x\ge2`,'above the axis: outside the roots']]},
  {q:T`Solve \(x^2>25\)`,rows:[[T`x^2-25>0`,''],[T`(x-5)(x+5)>0`,'critical values ±5'],[T`x<-5\ \text{or}\ x>5`,'not just x > 5: (−6)² = 36 is bigger than 25 too']]}],
 mistakes:[T`Square-rooting both sides and losing the negative side.`,T`Writing two separate regions as one, like \(-3>x>4\): it isn’t possible. Use “or”.`,T`Picking between vs outside the wrong way round. Test a value: \(x=0\) in \(x^2-x-12<0\) gives \(-12<0\), true, so 0 is in the answer.`],
 checks:[{q:T`Solve \(x^2-7x+10<0\)`,kind:'range',ans:{in:true,v:'x',a:2,b:5,ia:false,ib:false},show:T`2\lt x\lt5`,fmt:'e.g. <code>-1 &lt; x &lt; 3</code>'},{q:T`Solve \(x^2-9\ge0\)`,kind:'range',ans:{in:false,v:'x',a:-3,b:3,ia:true,ib:true},show:T`x\le-3\ \text{or}\ x\ge3`,fmt:'e.g. <code>x ≤ -1 or x ≥ 3</code>'}]},
simq:{
 what:T`<p>Here one equation is a straight line and the other is a curve (with \(x^2\), \(y^2\) or \(xy\)). Solving them together finds the <b>points where the line meets the curve</b>.</p>
<p>A line can cross a curve twice, touch it once, or miss it. That is exactly the 2, 1 or 0 solutions of a quadratic, which is why this method always leads to one.</p>`,
 when:T`<ul><li>Two equations, one linear and one with a squared or multiplied term.</li>
<li>Elimination doesn’t work here; use <b>substitution</b>.</li>
<li>To ask only whether they meet (not where), use the <a href="#t-disc">discriminant</a> of the quadratic you get in step 3.</li></ul>`,
 steps:[T`Rearrange the <b>linear</b> equation to get \(y=\dots\) (or \(x=\dots\)).`,T`Substitute it into the curve’s equation.`,T`Expand, rearrange to \(=0\), and solve the quadratic.`,T`Put each \(x\) back into the <b>linear</b> equation to get its \(y\).`,T`Write the answers as pairs \((x,\,y)\).`],
 examples:[
  {q:T`Solve \(y=x+1\) and \(y=x^2-5\)`,rows:[[T`x^2-5=x+1`,'both equal y'],[T`x^2-x-6=0`,''],[T`(x-3)(x+2)=0`,'x = 3 or −2'],[T`(3,\,4),\ (-2,\,-1)`,'y from y = x + 1']]},
  {q:T`Where does \(y=x+1\) meet the circle \(x^2+y^2=25\)?`,rows:[[T`x^2+(x+1)^2=25`,'substitute'],[T`2x^2+2x-24=0`,'(x + 1)² = x² + 2x + 1'],[T`x^2+x-12=0\Rightarrow x=3\ \text{or}\ -4`,''],[T`(3,\,4),\ (-4,\,-3)`,'']]}],
 mistakes:[T`\((x+1)^2\) is \(x^2+2x+1\), not \(x^2+1\).`,T`Substituting back into the curve can produce extra wrong pairs; use the line.`,T`Mixing up pairs: keep each \(y\) with its own \(x\).`],
 checks:[{q:T`Solve \(y=2x+1\) and \(y=x^2-2\)`,kind:'pts',ans:[[3,7],[-1,-1]],show:T`(3,\,7),\ (-1,\,-1)`,fmt:'both points, e.g. <code>(1, 3), (-2, 0)</code>'},{q:T`Solve \(x^2+y^2=10\) and \(y=x+2\)`,kind:'pts',ans:[[1,3],[-3,-1]],show:T`(1,\,3),\ (-3,\,-1)`,fmt:'both points, e.g. <code>(1, 3), (-2, 0)</code>'}]},
afrac:{
 what:T`<p>Algebraic fractions are fractions with letters in them, like \(\dfrac{x+3}{x-2}\). They follow exactly the same rules as number fractions. The main new skill is <b>factorising first</b>, because you can only cancel things that multiply the whole top and the whole bottom.</p>
<p>They appear when simplifying expressions and in equations with \(x\) on the bottom (rates, “work together” problems), and they are everywhere in later maths.</p>`,
 when:T`<ul><li><b>Simplify:</b> factorise top and bottom, then cancel matching brackets.</li><li><b>Add or subtract:</b> find a common denominator, as with \(\tfrac12+\tfrac13\).</li><li><b>Solve an equation:</b> clear the fractions by multiplying through (or cross-multiply when there is one fraction on each side).</li></ul>`,
 steps:[T`<b>Simplifying:</b> factorise the top and bottom fully, then cancel brackets that appear in both.`,T`<b>Adding:</b> multiply each fraction top and bottom to get the same denominator, then add the tops and simplify.`,T`<b>Solving:</b> multiply both sides by every denominator (or cross-multiply), expand, and solve. Check your answer doesn’t make a denominator zero.`],
 examples:[
  {q:T`Simplify \(\dfrac{x^2+5x+6}{x^2-4}\)`,rows:[[T`\dfrac{(x+2)(x+3)}{(x-2)(x+2)}`,'factorise both'],[T`\dfrac{x+3}{x-2}`,'cancel (x + 2)']]},
  {q:T`Write \(\dfrac{2}{x+1}+\dfrac{3}{x-2}\) as one fraction`,rows:[[T`\dfrac{2(x-2)+3(x+1)}{(x+1)(x-2)}`,'common denominator'],[T`\dfrac{5x-1}{(x+1)(x-2)}`,'expand the top: 2x − 4 + 3x + 3']]},
  {q:T`Solve \(\dfrac{4}{x-1}=\dfrac{3}{x+2}\)`,rows:[[T`4(x+2)=3(x-1)`,'cross-multiply'],[T`4x+8=3x-3`,''],[T`x=-11`,'']]}],
 mistakes:[T`Cancelling terms instead of factors: \(\dfrac{x+3}{x+5}\) does <b>not</b> simplify to \(\dfrac35\).`,T`Adding tops and bottoms separately.`,T`Forgetting brackets when subtracting a fraction: \(-(x-2)\) is \(-x+2\).`],
 checks:[{q:T`Simplify \(\dfrac{x^2-9}{x^2+x-6}\)`,kind:'expr',ans:'(x-3)/(x-2)',show:T`\dfrac{x-3}{x-2}`,fmt:'e.g. <code>(x + 1)/(x - 4)</code>',form:'cancel'},{q:T`Solve \(\dfrac{5}{x+1}=\dfrac{2}{x-2}\)`,kind:'num',ans:4,show:'x = 4',fmt:'e.g. <code>3</code>'}]},
};
const UNIT_GUIDES={
5:{title:'Quadratics: which method when',
 intro:T`<p>A quadratic is anything of the form \(ax^2+bx+c\). Its graph is a parabola: U-shaped when \(a>0\), upside-down when \(a<0\). Almost every question in this unit asks one of three things about it: <b>where does it cross the \(x\)-axis</b> (the roots), <b>where is its turning point</b>, or <b>how many times does it cross</b>?</p>
<p>The reason there are so many methods is that the same quadratic can be written in three forms, and <b>each form makes a different feature obvious</b>.</p>`,
 forms:[[T`y=x^2+6x+8`,'Expanded','The y-intercept (8). The form you get after rearranging an equation.','Expanding gets you here.'],[T`y=(x+2)(x+4)`,'Factorised','The roots: x = −2 and x = −4.','Factorising gets you here (when the numbers allow).'],[T`y=(x+3)^2-1`,'Completed square','The turning point (−3, −1), and the minimum value −1.','Completing the square gets you here (always).']],
 decide:[
  [T`Rearrange to \(ax^2+bx+c=0\).`,'Every method starts here.'],
  [T`No constant term? Take out \(x\). No \(x\) term? Square-root both sides, with \(\pm\).`,'The two shortcuts.'],
  [T`Does it factorise? Try for half a minute, or check whether \(b^2-4ac\) is a perfect square.`,'If yes, factorise: it is the quickest.'],
  [T`Asked for decimals (“to 2 d.p.”, “3 s.f.”) or the numbers are messy?`,'Use the quadratic formula.'],
  [T`Asked for exact answers with surds?`,T`Use the formula, or complete the square when \(a=1\) and \(b\) is even.`],
  [T`Asked for a turning point, minimum or maximum?`,'Complete the square.'],
  [T`Asked how many solutions, or for values of \(k\)?`,'Use the discriminant: no need to solve.'],
  [T`An inequality, or a line meeting a curve?`,'Solve the related equation first with the steps above, then interpret it.']],
 compare:T`<p>Take \(x^2+6x+8=0\). All three methods give the same answer:</p>
<ul><li><b>Factorising:</b> \((x+2)(x+4)=0\), so \(x=-2\) or \(x=-4\). Quickest here.</li><li><b>Completing the square:</b> \((x+3)^2-1=0\), so \(x+3=\pm1\), giving the same two answers.</li><li><b>Formula:</b> \(b^2-4ac=36-32=4\), so \(x=\dfrac{-6\pm2}{2}\), again \(-2\) and \(-4\).</li></ul>
<p>Now change one number: \(x^2+6x+7=0\). Here \(b^2-4ac=8\), not a perfect square, so it won’t factorise. Completing the square gives \((x+3)^2=2\), so \(x=-3\pm\sqrt2\) exactly; the formula gives the same, or \(-1.59\) and \(-4.41\) as decimals.</p>`,
 graph:{fns:[{e:'x^2+6x+8',l:'y = x² + 6x + 8 = (x + 2)(x + 4) = (x + 3)² − 1'}],pts:[[-4,0,false],[-2,0,false],[-3,-1,'turning point'],[0,8,'y-intercept']],xr:[-7,2],yr:[-3,10],grid:[1,1]},
 map:T`<ul><li><a href="#t-exp2">Expanding</a> and <a href="#t-fac2">factorising</a> move between the expanded and factorised forms.</li><li><a href="#t-solveq">Solving by factorising</a>, <a href="#t-cts">completing the square</a> and <a href="#t-qf">the formula</a> are three routes to the roots.</li><li><a href="#t-disc">The discriminant</a> counts the roots without finding them.</li><li><a href="#t-qineq">Inequalities</a>, <a href="#t-simq">line–curve problems</a> and <a href="#t-afrac">algebraic fractions</a> are where you use these skills.</li></ul>`}};

qf:{
 mins:5,
 intro:T`<p>The quadratic formula solves <b>any</b> equation of the form \(ax^2+bx+c=0\):</p><div class="bigf">\[x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}\]</div>
<p>It always works, even when the quadratic won’t factorise. The \(\pm\) (“plus or minus”) gives the two solutions: work it out once with \(+\) and once with \(-\).</p>
<p>The part under the square root, \(b^2-4ac\), is called the <b>discriminant</b>. It tells you how many solutions to expect before you finish: positive means two, zero means one, negative means none.</p>
<p>In this lesson you’ll watch one example worked step by step, fill in the gaps of a second, try one on your own, and finish with when to use the formula rather than another method.</p>`,
 walk:{q:T`Solve \(2x^2-7x+4=0\), giving your answers to 2 decimal places.`,steps:[
  {do:'Make sure one side is zero',line:T`2x^2-7x+4=0`,why:T`The formula works on \(ax^2+bx+c=0\). This equation is already in that form. If it weren’t, you would rearrange it first.`},
  {do:'Read off a, b and c, with their signs',line:T`a=2,\quad b=-7,\quad c=4`,think:T`What are \(a\), \(b\) and \(c\) here?`,why:T`\(a\) is the number with \(x^2\), \(b\) the number with \(x\), and \(c\) the number on its own. Each one takes the sign in front of it.`,warn:T`\(b\) is \(-7\), not \(7\). The minus belongs to it.`},
  {do:'Work out b² − 4ac on its own first',line:T`b^2-4ac=(-7)^2-4(2)(4)=49-32=17`,think:T`Try it: what is \((-7)^2-4\times2\times4\)?`,why:T`Doing this part separately keeps the arithmetic tidy. The answer, 17, is positive, so there will be two solutions.`,warn:T`Square the negative inside brackets: \((-7)^2=+49\). On a calculator, type the brackets.`},
  {do:'Substitute into the formula',line:T`x=\dfrac{-(-7)\pm\sqrt{17}}{2(2)}=\dfrac{7\pm\sqrt{17}}{4}`,think:'What goes on top before the ±, and what goes on the bottom?',why:T`\(-b\) means “the opposite of \(b\)”. Here \(b=-7\), so \(-b=+7\). The bottom is \(2a=2\times2=4\).`,warn:T`The two classic slips: writing \(-7\) on top, and dividing by 2 instead of \(2a\).`},
  {do:'Split the ± into two answers',line:T`x=\dfrac{7+\sqrt{17}}{4}\approx2.78\quad\text{or}\quad x=\dfrac{7-\sqrt{17}}{4}\approx0.72`,think:T`\(\sqrt{17}\approx4.123\). What are \((7+4.123)\div4\) and \((7-4.123)\div4\)?`,why:'± means do it once with + and once with −. Divide the whole top by 4, then round.',warn:T`Round only at the very end. Keep all the digits of \(\sqrt{17}\) until the last step.`},
  {do:'Sense-check an answer',line:T`2(2.78)^2-7(2.78)+4\approx0\ \checkmark`,why:'Put one answer back into the original equation. It should come out at roughly zero (not exactly, because you rounded).'}]},
 faded:{q:T`Solve \(x^2+3x-5=0\), giving your answers to 2 decimal places.`,parts:[
  {given:T`x^2+3x-5=0`,note:'Already equal to zero, so no rearranging needed.'},
  {blanks:[{pre:'a =',ans:1},{pre:'b =',ans:3},{pre:'c =',ans:-5}],note:'Read off a, b and c, signs included.',hint:T`When there’s no number in front of \(x^2\), \(a=1\). And \(c\) keeps its minus sign.`},
  {blanks:[{pre:'b² − 4ac =',ans:29}],note:'The discriminant first.',hint:T`\(3^2-4\times1\times(-5)=9+20\). Minus times minus is plus.`},
  {given:T`x=\dfrac{-3\pm\sqrt{29}}{2}`,note:T`Substituted: \(-b=-3\) and \(2a=2\).`},
  {blanks:[{pre:'x ≈',ans:1.19,tol:.006},{pre:'or x ≈',ans:-4.19,tol:.006}],any:true,note:'The two answers, to 2 decimal places.',hint:T`\(\sqrt{29}\approx5.385\). Work out \((-3+5.385)\div2\) and \((-3-5.385)\div2\).`}]},
 own:{q:T`Solve \(3x^2=5x+1\), giving your answers to 2 decimal places.`,kind:'set',ans:[1.85,-0.18],tol:.006,fmt:'both answers, e.g. <code>2.41, -0.41</code>',tip:'Look at the equation carefully before you start: is one side zero?',
  lines:[T`3x^2-5x-1=0`,T`a=3,\quad b=-5,\quad c=-1`,T`b^2-4ac=25+12=37`,T`x=\dfrac{5\pm\sqrt{37}}{6}`,T`x\approx1.85\quad\text{or}\quad x\approx-0.18`]},
 flow:{start:T`Your equation, rearranged to \(ax^2+bx+c=0\)`,qs:[
