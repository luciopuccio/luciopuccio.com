<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script src="/nav.js"></script>
<meta name="description" content="Algebra Path: practise algebra from the basics to trigonometry, with worked solutions, spaced reviews and a graph lab.">
<title>Algebra Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a fixed path rail on the left (units → topics → checkpoints), the work area on the right; topic pages split into Learn (notes) and Practice (a graph-paper board). */
:root{
  --paper:#F3F6F4; --sheet:#FFFFFF; --ink:#15201B; --muted:#5A6A62; --line:#D7E0DB; --grid:#E4ECE8;
  --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#E3F0EA; --mark:#E6B52E; --mark-soft:#FBF1D3;
  --p1:#C46A12; --p2:#2C63B5; --p3:#8A45B0; --p4:#B9412C; --good:#2C7A4B; --good-soft:#E2F2E7; --bad:#B9412C; --bad-soft:#F8E6E1; --warn:#9A6514; --warn-soft:#F6EEDC;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1311; --sheet:#151C19; --ink:#E3EAE6; --muted:#93A39B; --line:#26312C; --grid:#1C2622;
  --accent:#5BC79D; --accent-ink:#06120D; --accent-soft:#16291F; --mark:#E2B63C; --mark-soft:#2B2513;
  --p1:#F0A04B; --p2:#78A9F2; --p3:#C690EE; --p4:#EF7C66; --good:#62C98D; --good-soft:#15291D; --bad:#EF7C66; --bad-soft:#2E1A16; --warn:#E2AA4E; --warn-soft:#2B2213; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1311; --sheet:#151C19; --ink:#E3EAE6; --muted:#93A39B; --line:#26312C; --grid:#1C2622;
  --accent:#5BC79D; --accent-ink:#06120D; --accent-soft:#16291F; --mark:#E2B63C; --mark-soft:#2B2513;
  --p1:#F0A04B; --p2:#78A9F2; --p3:#C690EE; --p4:#EF7C66; --good:#62C98D; --good-soft:#15291D; --bad:#EF7C66; --bad-soft:#2E1A16; --warn:#E2AA4E; --warn-soft:#2B2213; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--sheet);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-bottom:16px}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.railnav{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.railnav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.railnav a:hover{background:var(--accent-soft)}
.railnav a.on{background:var(--accent);color:var(--accent-ink)}
.badge{font-family:var(--mono);font-size:11px;background:var(--mark);color:#1d1600;border-radius:99px;padding:1px 7px;font-weight:600}
.unit{margin-top:14px}
.unit h4{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.unit h4 i{font-style:normal;color:var(--ink);opacity:.5;margin-right:6px}
.tlink{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px}
.tlink:hover{background:var(--accent-soft)}
.tlink.on{background:var(--accent-soft);font-weight:600}
.tlink.cp{color:var(--muted);font-size:13px}
.tlink .lvl{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--line);background:transparent}
.dot.learning{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.shaky{border-color:var(--warn);background:var(--warn)}
.dot.mastered{border-color:var(--good);background:var(--good)}
.dot.due{border-color:var(--mark);background:radial-gradient(circle,var(--mark) 0 35%,transparent 40%)}
.dot.flag{border-radius:2px;border-color:var(--muted)}
.dot.flag.pass{border-color:var(--good);background:var(--good)}
.sync{margin-top:20px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.railtoggle{display:none}
main{min-width:0;padding-block:28px 64px;padding-left:40px;padding-right:max(16px, env(safe-area-inset-right, 0px), 40px)}
.wrap{max-width:1180px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--grid);color:var(--muted)}
.pill.learning{background:var(--accent-soft);color:var(--accent)}
.pill.shaky{background:var(--warn-soft);color:var(--warn)}
.pill.mastered{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--mark-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:default}
/* Home */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.hero h1{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:58ch}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tcard:hover{border-color:var(--accent)}
.tcard.hot{border-color:var(--mark);background:var(--mark-soft)}
.tcard .eyebrow{font-size:11px}
.tcard b{font-family:var(--display);font-size:19px;line-height:1.2}
.tcard span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b small{font-size:16px;color:var(--muted);font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.path{display:flex;flex-direction:column;gap:18px}
.punit{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.punit header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.punit h3{font-size:18px}
.punit header span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:hover .pt{color:var(--accent)}
.pn{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pt{font-weight:500}
.pmeta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.prow.cpr .pt{color:var(--muted);font-weight:600}
.side{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:17px;margin-bottom:8px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px}
.panel ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.panel li{margin:4px 0}
.panel li b{color:var(--ink)}
.weak a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
/* Topic */
.thead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.thead h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.tmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.spark{display:flex;gap:3px}
.spark i{width:8px;height:16px;border-radius:2px;background:var(--grid)}
.spark i.y{background:var(--good)}.spark i.n{background:var(--bad)}
.pre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--sheet)}
.chip:hover{border-color:var(--accent)}
.prewarn{flex-basis:100%;font-size:13px;color:var(--warn)}
.tgrid{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
.learn{display:flex;flex-direction:column;gap:14px}
.learn .sum{font-size:16px;margin:0;max-width:62ch}
.key{background:var(--accent-soft);border-radius:10px;padding:12px 14px;overflow-x:auto}
.key .eyebrow{display:block;margin-bottom:4px;color:var(--accent)}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
details.fold>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold>div{padding:0 14px 14px;font-size:15px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;overflow-x:auto}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;height:22px;display:grid;place-items:center;margin-top:2px}
.exq{margin:0 0 10px;font-weight:500}
.fig{display:block;width:340px;max-width:100%;height:auto;margin:12px 0 2px}
.fig .tri{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fig .ra{fill:none;stroke:var(--ink);stroke-width:1.2}
.fig text{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.fig text.u{fill:var(--accent);font-weight:600;font-size:15px}
.fig text.v{fill:var(--muted);font-size:12px}
/* Board */
.board{position:sticky;top:20px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.btop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;padding:26px 22px 22px;min-height:180px;position:relative}
.qlabel{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qlabel .tag{background:var(--mark);color:#1d1600;padding:1px 8px;border-radius:4px;font-weight:600}
.qlabel .lv{border:1px solid var(--line);background:var(--sheet);padding:0 7px;border-radius:4px}
.qlabel a{color:var(--muted)}
.q{font-size:20px;line-height:1.6;overflow-x:auto;background:var(--sheet);display:inline-block;max-width:100%;padding:2px 4px}
.q.word{font-size:18px}
.answer{padding:16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.arow{display:flex;gap:10px;flex-wrap:wrap}
.arow input{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.arow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fmt{font-size:13px;color:var(--muted)}
.fmt code{font-family:var(--mono);background:var(--grid);padding:1px 5px;border-radius:4px}
.syms{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.syms .fmt{margin-right:4px}
.sym{min-width:42px;height:38px;padding:0 10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--mono);font-size:18px;cursor:pointer;color:var(--ink)}
.sym:hover{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:10px;padding:12px 14px;font-size:15px}
.fb b{display:block;margin-bottom:2px}
.fb.good{background:var(--good-soft)}.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-soft)}.fb.bad b{color:var(--bad)}
.fb.warn{background:var(--warn-soft)}.fb.warn b{color:var(--warn)}
.fb .rev{margin-top:6px;font-size:14px}
.toast{font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sol{border-top:1px solid var(--line);padding:16px}
.sol h4{margin:0 0 10px;font-family:var(--display);font-size:16px}
.final{margin-top:12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:9px;overflow-x:auto}
.method{margin-top:10px;font-size:14px;color:var(--muted)}
.method b{color:var(--ink)}
.ai{border-top:1px solid var(--line);padding:0}
.ai>summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ai>summary::-webkit-details-marker{display:none}
.ai>summary span{font-weight:400;font-size:13px;color:var(--muted)}
.aibody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.aibody textarea{font-family:var(--mono);font-size:14px;min-height:120px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);width:100%}
.aiout{font-size:15px;white-space:pre-wrap;overflow-x:auto}
.aiout strong{display:block;margin-top:8px;font-family:var(--display)}
.note{font-size:13px;color:var(--muted)}
.progress{height:6px;background:var(--grid);border-radius:99px;overflow:hidden;flex:1 1 120px;max-width:220px}
.progress i{display:block;height:100%;background:var(--accent)}
.result{padding:22px;display:flex;flex-direction:column;gap:14px}
.result h2{font-size:28px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rlist .y{color:var(--good);font-weight:600}.rlist .n{color:var(--bad);font-weight:600}
.empty{padding:30px}
.lk{width:11px;height:13px;flex:none;fill:var(--muted);stroke:var(--muted);stroke-width:1.5}.lk path{fill:none}
.tlink.locked,.prow.locked{color:var(--muted)}
.prow.locked .pt{color:var(--muted)}
.lockpanel{display:flex;flex-direction:column;gap:12px;max-width:640px}
.lockpanel h3{display:flex;gap:10px;align-items:center;font-size:20px}
.lockpanel h3 .lk{width:16px;height:19px}
.lockpanel .sum{margin:0;color:var(--muted)}
.lockpanel ul{margin:0;padding-left:20px}
.toast a{color:inherit}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 12px 6px 8px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;color:var(--accent);border:1px solid var(--line);background:var(--sheet)}
.back:hover{background:var(--accent-soft);border-color:var(--accent)}
.plot{display:block;width:440px;max-width:100%;height:auto;margin:12px 0 4px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.plot .gl{stroke:var(--grid);stroke-width:1}
.plot .ax{stroke:var(--muted);stroke-width:1.3}
.plot .tk{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.plot .axn{font-family:var(--mono);font-size:12px;font-style:italic;fill:var(--muted)}
.plot .cv{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.plot .cv.dash{stroke-dasharray:7 5;stroke-width:2}
.plot .c0{stroke:var(--accent)}.plot .c1{stroke:var(--p1)}.plot .c2{stroke:var(--p2)}.plot .c3{stroke:var(--p3)}.plot .c4{stroke:var(--p4)}
.plot .pt{stroke:var(--sheet);stroke-width:2}
.plot .pt.c0{fill:var(--accent)}.plot .pt.c1{fill:var(--p1)}.plot .pt.c2{fill:var(--p2)}.plot .pt.c3{fill:var(--p3)}.plot .pt.c4{fill:var(--p4)}
.plot .hl{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.plot .leg{fill:none;stroke:var(--p1);stroke-width:1.6;stroke-dasharray:4 3}
.plot .shade{fill:var(--accent);opacity:.1}
.plot .band{stroke:var(--accent);stroke-width:6;stroke-linecap:round;opacity:.75}
.plot .arr{fill:var(--accent)}
.plot .nd{fill:var(--accent);stroke:var(--accent);stroke-width:2.5}.plot .nd.open{fill:var(--sheet)}
.plot .pl{font-family:var(--mono);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.plot .lgb{fill:var(--sheet);stroke:var(--line);opacity:.94}
.plot .lt{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.nline{height:auto}
.graph{margin-top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.labbtn{padding-left:0}
.labgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.labside{display:flex;flex-direction:column;gap:14px}
.lrow{display:grid;grid-template-columns:12px auto minmax(0,1fr) 32px;gap:8px;align-items:center}
.lrow label{font-family:var(--mono);font-size:14px;color:var(--muted)}
.lrow input{font-family:var(--mono);font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.lrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.lrow input.bad{border-color:var(--bad)}
.rerr{font-size:12px;color:var(--bad);margin:-8px 0 0 20px}
.rerr:empty{display:none}
.xbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.xbtn:hover{border-color:var(--bad);color:var(--bad)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none;background:var(--accent)}
.sw.c1{background:var(--p1)}.sw.c2{background:var(--p2)}.sw.c3{background:var(--p3)}.sw.c4{background:var(--p4)}
.sliders{display:flex;flex-direction:column;gap:8px}
.sl{display:grid;grid-template-columns:20px minmax(0,1fr) 72px;gap:10px;align-items:center}
.sl label{font-family:var(--mono);font-weight:600}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.pnum{font-family:var(--mono);font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.labopts{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presets .chip{cursor:pointer;padding:4px 10px}
.labplot{min-width:0;display:flex;flex-direction:column;gap:10px}
.lbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbar .btn{padding:6px 12px}
.labsvg{touch-action:none;cursor:grab;user-select:none}
.labsvg:active{cursor:grabbing}
.labsvg .plot{width:100%;max-width:none;margin:0}
.keylist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.krow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.krow .sw{transform:translateY(1px)}
@media (max-width:900px){.labgrid{grid-template-columns:minmax(0,1fr)}}

.remind .actions{margin:4px 0 10px}
.remind .note{margin:0 0 10px}
.remind label.btn{cursor:pointer}
.impq{display:flex;flex-direction:column;gap:8px;font-size:14px;margin-top:6px}
.reset{margin-top:30px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
@media (max-width:1100px){.tgrid,.cols{grid-template-columns:minmax(0,1fr)}.board{position:static}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .railtoggle{display:inline-flex}
  .rail .units{display:none}.rail.open .units{display:block}
  .railhead{display:flex;justify-content:space-between;align-items:center}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
  .today{grid-template-columns:minmax(0,1fr)}
  .q{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.fb,.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
mjx-container[display="true"]{margin:.4em 0!important}

  const T1=[[T`f(x) + ${k}`,[p,q+k],`Adding ${k} outside the function moves the graph up by ${k}`,[p+k,q],'Adding outside the bracket moves the graph vertically, not sideways.'],
    [T`f(x) - ${k}`,[p,q-k],`Subtracting ${k} outside moves the graph down by ${k}`,[p,q+k],'Subtracting outside the function moves the graph down.'],
    [T`f(x - ${k})`,[p+k,q],T`Inside the bracket the effect is opposite: \(x - ${k}\) moves the graph ${k} to the right`,[p-k,q],T`\(f(x - ${k})\) moves the graph right, not left: changes inside the bracket do the opposite of what they look like.`],
    [T`f(x + ${k})`,[p-k,q],T`\(x + ${k}\) moves the graph ${k} to the left`,[p+k,q],T`\(f(x + ${k})\) moves the graph left, not right.`]];
  if(v<.35){const[f,a,st,w,msg]=R.pick(T1);return{lv:1,q:T`The point \(${P}\) lies on \(y = f(x)\). Find the corresponding point on \(y = ${f}\).`,kind:'pts',ans:[a],fmt:'a point, e.g. <code>(3, -2)</code>',steps:[st,T`\(${P} \to (${a[0]},\ ${a[1]})\)`],mistakes:[{a:[w],msg}]}}
  const s=R.int(2,4);const T2=[[T`${s}f(x)`,[p,s*q],`Multiplying outside stretches vertically by ${s}: the y-coordinate is multiplied by ${s}`,[p/s,q],'Multiplying outside the function changes y, not x.'],
    [T`f(${s}x)`,[p/s,q],`Multiplying x inside squashes horizontally: the x-coordinate is divided by ${s}`,[p*s,q],`Inside the bracket the effect is opposite: f(${s}x) divides x by ${s}.`],
    [T`-f(x)`,[p,-q],'A minus outside reflects in the x-axis: y changes sign',[-p,q],'A minus outside reflects in the x-axis (y changes sign), not the y-axis.'],
    [T`f(-x)`,[-p,q],'A minus inside reflects in the y-axis: x changes sign',[p,-q],'A minus inside the bracket reflects in the y-axis (x changes sign).']];
  if(v<.7){const[f,a,st,w,msg]=R.pick(T2);return{lv:2,q:T`The point \(${P}\) lies on \(y = f(x)\). Find the corresponding point on \(y = ${f}\).`,kind:'pts',ans:[a],tol:5e-4,fmt:'a point, e.g. <code>(3, -2)</code> (fractions allowed)',steps:[st,T`\(${P} \to (${fmtN(a[0])},\ ${fmtN(a[1])})\)`],mistakes:[{a:[w],msg}]}}

    steps:[T`Inside: \(x${sg(-h)}\) moves the graph ${Math.abs(h)} ${h>0?'right':'left'}: x becomes \(${p}${sg(h)} = ${p+h}\)`,T`Outside: multiply y by ${m}, then ${c>0?'add':'subtract'} ${Math.abs(c)}: \(${m}\times ${pn(q)}${sg(c)} = ${m*q+c}\)`,T`Turning point \((${a[0]},\ ${a[1]})\)`],
    mistakes:[{a:[[p-h,m*q+c]],msg:'The horizontal shift goes the opposite way to the sign inside the bracket (step 1).'},{a:[[p+h,m*(q+c)]],msg:`Multiply by ${m} first, then ${c>0?'add':'subtract'} ${Math.abs(c)} (step 2).`}]}};

  if(v<.67){const kind=R.pick(['hypOpp','hypAdj','tan']);let a,b,c,given,ans,st,mk;

G.exact=(R,W)=>{
  const v=R.f();
  if(v<.35){const f=R.pick(['sin','cos','tan']),ang=R.pick(f==='tan'?[30,45,60]:[30,45,60,0,90]);const[tx,ty]=EXV[f][ang];
    return{lv:1,q:T`Write down the exact value of \(${'\\'+(f)} ${ang}°\).`,kind:'num',ans:evalNum(ty),tol:5e-4,form:formExact,show:tx,typed:ty,fmt:'exact, e.g. <code>√3/2</code> or <code>1/2</code>',
      steps:[TRI_NOTE,T`\(${'\\'+(f)} ${ang}° = ${tx}\)`],mistakes:f!=='tan'&&ang%90?[{a:evalNum(EXV[f==='sin'?'cos':'sin'][ang][1]),msg:`That’s ${f==='sin'?'cos':'sin'} ${ang}°. Sin and cos swap between 30° and 60°.`}]:[]}}

      [T`\sin 60° + \cos 30°`,T`\sqrt3`,'sqrt(3)',[T`\tfrac{\sqrt3}{2} + \tfrac{\sqrt3}{2} = \sqrt3`]],[T`\tan 30° + \tan 60°`,T`\tfrac{4\sqrt3}{3}`,'4sqrt(3)/3',[T`\tfrac{\sqrt3}{3} + \sqrt3 = \tfrac{\sqrt3 + 3\sqrt3}{3} = \tfrac{4\sqrt3}{3}`]]];

  if(R.f()<.5){const L=[['sin',150,30,T`\tfrac12`,'1/2',1],['cos',120,60,T`-\tfrac12`,'-1/2',-1],['cos',135,45,T`-\tfrac{\sqrt2}{2}`,'-sqrt(2)/2',-1],['tan',135,45,'-1','-1',-1],['sin',120,60,T`\tfrac{\sqrt3}{2}`,'sqrt(3)/2',1],['cos',150,30,T`-\tfrac{\sqrt3}{2}`,'-sqrt(3)/2',-1],['sin',210,30,T`-\tfrac12`,'-1/2',-1],['tan',120,60,T`-\sqrt3`,'-sqrt(3)',-1]];
    const[f,ang,ref,tx,ty,sgn]=R.pick(L);return{lv:3,q:T`Find the exact value of \(${'\\'+(f)} ${ang}°\).`,kind:'num',ans:evalNum(ty),tol:5e-4,form:formExact,show:tx,typed:ty,fmt:'exact, e.g. <code>-√3/2</code>',
      steps:[T`Reference angle: ${ang}° makes ${ref}° with the x-axis`,T`In the ${ang<180?'second':'third'} quadrant, ${f} is ${sgn>0?'positive':'negative'} (CAST)`,T`\(${'\\'+(f)} ${ang}° = ${sgn<0?'-':''}${'\\'+(f)} ${ref}° = ${tx}\)`],mistakes:[{a:-evalNum(ty),msg:`Check the sign using CAST: ${f} is ${sgn>0?'positive':'negative'} for ${ang}° (step 2).`}]}}

  let A,a,b;do{A=R.int(25,45);b=R.int(8,15);a=R.int(Math.ceil(b*sinD(A))+1,b-1)}while(a>=b||b*sinD(A)>=a);const B1=asinD(b*sinD(A)/a),B2=180-B1;

  if(v<.95){let r1_,r2_,m,d,b,c,yr;do{r1_=R.int(-4,2);r2_=R.int(r1_+1,4);m=R.nz(-2,2);d=R.int(-2,4);b=m-(r1_+r2_);c=d+r1_*r2_;yr=YR(m*r1_+d,m*r2_+d,c-b*b/4)}while(yr[1]-yr[0]>21);const cu=poly([[1,'x^2'],[b,'x'],[c,'']]),li=poly([[m,'x'],[d,'']]);
    return{lv:3,alt:`the curve y = ${cu} and the line y = ${li}`,q:T`The graph shows \(y = ${cu}\) and \(y = ${li}\). Use it to solve \(${cu} = ${li}\).`+Q({fns:[{e:cu},{e:li}],xr:[r1_-2.5,r2_+2.5],yr}),kind:'set',ans:[r1_,r2_],fmt:'all solutions, e.g. <code>x = -1, x = 2</code>',
      gr:{fns:[{e:cu},{e:li}],pts:[[r1_,m*r1_+d],[r2_,m*r2_+d]],xr:[r1_-2.5,r2_+2.5],yr,grid:[1,1]},
      steps:[T`The solutions are the x-coordinates where the line and the curve cross`,T`They cross at \((${r1_},\ ${m*r1_+d})\) and \((${r2_},\ ${m*r2_+d})\)`,T`So \(x = ${r1_}\) or \(x = ${r2_}\)`],
      mistakes:[{a:[m*r1_+d,m*r2_+d],msg:'Give the x-coordinates of the crossing points, not the y-coordinates (step 2).'}]}}
  const k=R.pick([2,3]),b0=R.int(1,k===2?4:2);const e=`${k}^x`;const yv=k**b0;
  return{lv:3,alt:`the exponential curve y = ${k}^x`,q:T`The graph of \(y = ${k}^x\) is shown. Use it to solve \(${k}^x = ${yv}\).`+Q({fns:[{e,l:`y = ${k}ˣ`}],xr:[-3,4],yr:[-1.5,yv+3.5]}),kind:'num',ans:b0,fmt:'e.g. <code>x = 2</code>',
    gr:{fns:[{e,l:`y = ${k}ˣ`},{e:''+yv,dash:1}],pts:[[b0,yv]],xr:[-3,4],yr:[-1.5,yv+3.5]},
    steps:[T`Draw the line \(y = ${yv}\) and read down to the x-axis where it meets the curve`,T`\(x = ${b0}\). Check: \(${k}^{${b0}} = ${yv}\) ✓`],mistakes:[{a:yv/k,msg:`Read the x-value where y = ${yv}, don’t divide (step 1).`}].filter(z=>z.a!==b0)}};

/* ---------- curriculum ---------- */
const UNITS=['Number foundations','Expressions','Linear equations','Inequalities','Simultaneous equations','Quadratics','Indices & surds','Sequences & graphs','Functions & polynomials','Exponentials & logs','Trigonometry'];
const TOPICS=[
 {id:'order',u:0,pre:[],t:'Order of operations',g:G.order,wp:1,s:'Work through a calculation in a fixed order so everyone gets the same answer: Brackets, Indices (powers and roots), Division and Multiplication left to right, then Addition and Subtraction left to right.',k:T`\text{Brackets} \to \text{Indices} \to \div\,\times \to +\,-`,w:'Multiplication is repeated addition, so 2 + 3 × 4 means 2 plus three fours, which is 14. Doing multiplication first keeps that meaning. Brackets exist for when you want a different order.'},
 {id:'neg',u:0,pre:[],t:'Negative numbers',g:G.neg,wp:1,s:'Two signs side by side combine: same signs give +, different signs give −. That covers multiplying, dividing, and subtracting a negative.',k:T`a-(-b)=a+b,\quad (-a)(-b)=ab,\quad (-a)^2=a^2,\quad -a^2=-(a^2)`,w:'Think of subtracting as turning round on the number line. Subtracting a negative turns you twice, so you face forwards again. With powers, the bracket decides what gets squared: (−3)² squares −3, while −3² squares only the 3.'},
 {id:'frac',u:0,pre:[],t:'Fractions',g:G.frac,wp:1,s:'To add or subtract, rewrite over a common denominator, then combine the numerators. To multiply, multiply tops and bottoms. To divide, flip the second fraction and multiply.',k:T`\frac ab+\frac cd=\frac{ad+bc}{bd},\qquad \frac ab\div\frac cd=\frac ab\times\frac dc`,w:'The denominator names the size of the pieces. You can only add pieces of the same size, which is why you need a common denominator. Dividing by c/d asks how many c/d pieces fit, which equals multiplying by d/c.'},
 {id:'like',u:1,pre:['neg'],t:'Collecting like terms',g:G.like,wp:1,s:'Like terms have exactly the same letters and powers (3x and −5x; 2x² and x², but not x and x²). Add their coefficients and keep the letter part. The sign in front of a term belongs to it.',k:T`4x + 3y - 7x + y = -3x + 4y`,w:'Letters stand for numbers, so 4x + 7x is four lots of something plus seven lots of the same thing. x and x² are different quantities (x = 3 gives 3 and 9), so they can’t merge.'},
 {id:'subs',u:1,pre:['order','neg'],t:'Substitution',g:G.subs,wp:1,s:'Replace each letter with its value, in brackets, then follow the order of operations. Brackets around negative values prevent most sign errors.',k:T`x=-2:\quad 3x^2 = 3\times(-2)^2 = 12`,w:'An expression is a recipe that works for any number; substitution runs it once. The bracket keeps the whole value, sign included, together when it is squared or multiplied.'},
 {id:'expand1',u:1,pre:['like'],t:'Expanding single brackets',g:G.expand1,wp:1,s:'Multiply every term inside the bracket by the term outside, tracking signs. A minus in front of a bracket multiplies every term inside by −1.',k:T`-3(2x-5) = -6x+15`,w:'a(b + c) = ab + ac is the distributive law: three bags, each holding b apples and c pears, contain 3b apples and 3c pears. With a negative multiplier, every sign inside flips.'},
 {id:'factor1',u:1,pre:['expand1'],t:'Factorising: common factors',g:G.factor1,wp:0,s:'Factorising is expanding in reverse. Find the highest common factor of every term (numbers and letters), write it outside, and divide each term by it to get what goes inside.',k:T`6x^2+9x = 3x(2x+3)`,w:'A factorised form shows structure: 3x(2x + 3) tells you at a glance that the expression is zero when x = 0. Taking out the highest factor means nothing more can come out of the bracket. Check by expanding back.'},
 {id:'lin2',u:2,pre:['neg'],t:'Two-step equations',g:G.lin2,wp:1,s:'Undo the operations in reverse order, doing the same thing to both sides. For ax + b = c, undo the +b first, then divide by a.',k:T`3x+7=22 \;\Rightarrow\; 3x=15 \;\Rightarrow\; x=5`,w:'An equation is a balance. Any operation done to both sides keeps it balanced. Undoing in reverse is like unwrapping: the last thing done to x is the first thing you remove.'},
 {id:'lin3',u:2,pre:['lin2','like'],t:'Unknowns on both sides',g:G.lin3,wp:1,s:'Collect the x-terms on one side (usually the side with more x’s, to keep the coefficient positive) and the numbers on the other, then divide.',k:T`5x+3=2x+15 \;\Rightarrow\; 3x=12 \;\Rightarrow\; x=4`,w:'Subtracting 2x from both sides is allowed because 2x is just a number you don’t know yet. Moving x-terms towards the larger coefficient avoids dividing by a negative.'},
 {id:'linbr',u:2,pre:['lin2','expand1'],t:'Equations with brackets',g:G.linbr,wp:0,s:'Either expand the brackets, or divide both sides by the number outside when it goes in exactly. Then solve as normal.',k:T`4(x-3)=20 \;\Rightarrow\; x-3=5 \;\Rightarrow\; x=8`,w:'Dividing first is quicker when the right-hand side is a multiple of the number outside. Expanding always works, but every term inside must be multiplied.'},
 {id:'linfrac',u:2,pre:['lin2','frac'],t:'Equations with fractions',g:G.linfrac,wp:1,s:'Clear the fractions by multiplying every term on both sides by the denominator, or by the lowest common multiple of the denominators. With one fraction on each side, cross-multiply.',k:T`\frac x3+\frac x4=7 \;\xrightarrow{\;\times 12\;}\; 4x+3x=84`,w:'Multiplying both sides by the same number keeps the balance. Choosing the LCM of the denominators turns every fraction into a whole number in one move.'},
 {id:'rearr',u:2,pre:['lin2'],t:'Rearranging formulae',g:G.rearr,wp:0,s:'Rearranging a formula is solving an equation whose answer is an expression. Undo what has been done to the target letter, in reverse order, applying each step to the whole of the other side.',k:T`v=u+at \;\Rightarrow\; v-u=at \;\Rightarrow\; t=\frac{v-u}{a}`,w:'The other letters behave like numbers you haven’t been told. Brackets matter: dividing v − u by a means dividing all of it, so write (v − u)/a. If the subject appears twice, collect it on one side and factorise it out.'},
 {id:'ineq',u:3,pre:['lin2'],t:'Linear inequalities',g:G.ineq,wp:1,s:'Solve like an equation, with one extra rule: when you multiply or divide both sides by a negative number, reverse the inequality sign. With a double inequality, do the same to all three parts.',k:T`-2x\gt 6 \;\Rightarrow\; x\lt -3`,w:'3 < 5, but multiply both by −1 and you get −3 and −5, where −3 > −5. Negatives reverse the order on the number line, so the sign must flip to stay true.'},
 {id:'sim',u:4,pre:['lin3'],t:'Simultaneous linear equations',g:G.sim,wp:1,s:'Two equations, two unknowns. Elimination: scale the equations so one variable has matching coefficients, then add or subtract to remove it. Substitution: rearrange one equation for a variable and substitute it into the other.',k:T`\begin{aligned}2x+3y&=12\\ 2x-y&=4\end{aligned}\;\Rightarrow\;4y=8`,w:'Each equation is a straight line; the solution is where they cross. Adding or subtracting equations is allowed because you’re adding equal amounts to both sides. Always check your answer in the equation you didn’t substitute into.'},
 {id:'exp2',u:5,pre:['expand1'],t:'Expanding double brackets',g:G.exp2,wp:1,s:'Multiply every term in the first bracket by every term in the second (four products for two binomials), then collect like terms.',k:T`(x+3)(x-5)=x^2-5x+3x-15=x^2-2x-15`,w:'Picture a rectangle with sides (x + 3) and (x − 5), split into four smaller rectangles. The area is the sum of all four pieces. Leaving out the two middle ones is the most common slip.'},
 {id:'fac2',u:5,pre:['exp2','factor1'],t:'Factorising quadratics',g:G.fac2,wp:0,s:'For x² + bx + c, find two numbers that multiply to c and add to b. For a difference of two squares, a² − b² = (a − b)(a + b). Take out any common factor first. When the x² coefficient isn’t 1, use the ac method.',k:T`x^2+bx+c=(x+p)(x+q)\ \text{ where } pq=c,\ p+q=b`,w:'Expanding (x + p)(x + q) gives x² + (p + q)x + pq, so the pair must add to b and multiply to c. If c is positive, both numbers share b’s sign; if c is negative, they have opposite signs.'},
 {id:'solveq',u:5,pre:['fac2'],t:'Solving quadratics by factorising',g:G.solveq,wp:1,s:'Rearrange so one side is zero, factorise, then set each bracket equal to zero.',k:T`(x-2)(x+5)=0 \;\Rightarrow\; x=2 \text{ or } x=-5`,w:'If two numbers multiply to zero, at least one of them is zero. That only works with zero on one side, which is why you rearrange first. Never divide by x: you would lose the solution x = 0.'},
 {id:'cts',u:5,pre:['exp2'],t:'Completing the square',g:G.cts,wp:0,s:'Halve the coefficient of x, write (x + half)², then subtract half² to cancel the extra constant that creates. The result shows the turning point, and solves equations exactly.',k:T`x^2+bx+c = \left(x+\tfrac b2\right)^2 - \left(\tfrac b2\right)^2 + c`,w:'(x + 3)² = x² + 6x + 9. So x² + 6x is (x + 3)² minus the 9 you didn’t ask for. In (x + p)² + q the square is never negative, so the minimum value is q, reached at x = −p.'},
 {id:'qf',u:5,pre:['solveq','surd'],t:'The quadratic formula',g:G.qf,wp:1,s:'When ax² + bx + c = 0 won’t factorise, use the formula. Rearrange to zero first, identify a, b and c with their signs, and work out the discriminant b² − 4ac first.',k:T`x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}`,w:'The formula is completing the square done once, in general. The ± gives the two places the parabola crosses the x-axis, equally spaced either side of x = −b/2a.'},
 {id:'disc',u:5,pre:['qf'],t:'The discriminant',g:G.disc,wp:0,s:'The discriminant D = b² − 4ac tells you how many real solutions a quadratic has without solving it: D > 0 gives two, D = 0 one (repeated), D < 0 none.',k:T`D=b^2-4ac`,w:'D sits under the square root in the formula. A positive number has two square roots (±), zero has one, and a negative number has no real square root. On the graph, the parabola crosses, touches or misses the x-axis.'},
 {id:'qineq',u:5,pre:['solveq','ineq'],t:'Quadratic inequalities',g:G.qineq,wp:0,s:'Find the critical values by solving the equation, sketch the U-shaped curve through them, then read off where it is below (< 0) or above (> 0) the x-axis.',k:T`(x-a)(x-b)\lt 0 \iff a\lt x\lt b,\qquad (x-a)(x-b)\gt 0 \iff x\lt a \text{ or } x\gt b`,w:'A U-shaped parabola dips below the axis only between its roots and is above it everywhere else. Never square-root both sides of x² < 9 to get x < 3: that misses −3 < x.'},
 {id:'simq',u:5,pre:['sim','solveq'],t:'Linear–quadratic simultaneous',g:G.simq,wp:0,s:'Substitute the linear equation into the quadratic one, rearrange to zero, and solve the quadratic. Then put each x back into the linear equation to find its y.',k:T`y=x+1,\ x^2+y^2=25 \;\Rightarrow\; x^2+(x+1)^2=25`,w:'A line can cross a curve at two points, touch it at one, or miss it. Each solution of the quadratic is the x-coordinate of a crossing point, so you always get answers in pairs (x, y).'},
 {id:'afrac',u:5,pre:['fac2','frac'],t:'Algebraic fractions',g:G.afrac,wp:0,s:'Factorise first, then cancel whole brackets that appear on top and bottom. To add, use a common denominator exactly as with number fractions. To solve, cross-multiply or multiply through by the denominators.',k:T`\frac{x^2-9}{x^2+5x+6}=\frac{(x-3)(x+3)}{(x+2)(x+3)}=\frac{x-3}{x+2}`,w:'Cancelling divides top and bottom by the same thing, which only works for factors. You can’t cancel x² from x² + 1 over x² + 3, just as you can’t cancel the 1s in 12/13.'},
 {id:'ind',u:6,pre:['order'],t:'Laws of indices',g:G.ind,wp:0,s:'Same base: multiplying adds the powers, dividing subtracts them, a power of a power multiplies them. A negative power means the reciprocal. A fractional power p/q means the q-th root, then the p-th power.',k:T`x^a x^b=x^{a+b},\ \ (x^a)^b=x^{ab},\ \ x^{-n}=\tfrac1{x^n},\ \ x^{p/q}=\left(\sqrt[q]{x}\right)^p`,w:'x³ × x² is (x·x·x)(x·x): five x’s multiplied. The other rules follow from keeping that pattern consistent: x⁰ = 1 because x³ ÷ x³ = 1, and x^½ squared must give x, so x^½ = √x.'},
 {id:'surd',u:6,pre:['ind'],t:'Surds',g:G.surd,wp:0,s:'Simplify √n by taking out the largest square factor. Rationalise a/√b by multiplying top and bottom by √b, and a/(b + √c) by multiplying by the conjugate b − √c.',k:T`\sqrt{ab}=\sqrt a\sqrt b,\qquad \frac{a}{\sqrt b}=\frac{a\sqrt b}{b}`,w:'Surds keep answers exact, which matters when an answer feeds into later work, including trigonometry, where √2 and √3 appear constantly. Like terms work for surds too: 2√3 + 5√3 = 7√3, but √2 + √3 doesn’t simplify.'},
 {id:'binom',u:6,pre:['ind','expand1'],t:'Binomial expansion',g:G.binom,wp:0,s:'(a + b)ⁿ expands into n + 1 terms. The term with bʳ is nCr · aⁿ⁻ʳ · bʳ. Any number in front of x is raised to the power along with x.',k:T`(a+b)^n=\sum_{r=0}^{n}\binom nr a^{n-r}b^r`,w:'Expanding (a + b)ⁿ means choosing a or b from each of the n brackets. nCr counts the ways to choose b from exactly r of them. That’s why the coefficients follow Pascal’s triangle.'},
 {id:'nth',u:7,pre:['lin2'],t:'Sequences',g:G.nth,wp:1,s:'An arithmetic sequence adds the same difference d each time: nth term dn + (first term − d). If the first differences change but the second differences are constant, the sequence is quadratic: the n² coefficient is half the second difference.',k:T`u_n = dn + (u_1 - d)`,w:'An arithmetic sequence behaves like the d times table, shifted. The shift is the zeroth term, one step before the first. For a quadratic sequence, n² has second difference 2, which is why you halve.'},
 {id:'line',u:7,pre:['lin2','frac'],t:'Straight-line graphs',g:G.line,wp:1,s:'Gradient m = change in y ÷ change in x. A line is y = mx + c, where c is the y-intercept. Parallel lines share a gradient; perpendicular gradients multiply to −1.',k:T`m=\frac{y_2-y_1}{x_2-x_1},\qquad y=mx+c,\qquad m_1 m_2=-1`,w:'The gradient is a rate of change: how far y rises for each step of 1 in x. In real contexts m is a rate (£ per hour) and c is a fixed starting amount (a call-out fee).'},
 {id:'gread',u:7,pre:['line','solveq'],t:'Reading graphs',g:G.gread,wp:0,s:'Many questions give you a graph instead of an equation. Roots are where the curve meets the x-axis (y = 0); the y-intercept is where it meets the y-axis (x = 0). Solve f(x) = k by drawing the line y = k and reading off the crossings. A straight line’s equation comes from its intercept and its rise over run.',k:T`f(x)=0:\ \text{x-axis crossings},\quad f(x)=k:\ \text{crossings with } y=k,\quad m=\frac{\text{rise}}{\text{run}}`,w:'Every point on a graph is a pair (x, y) that makes the equation true. So solving an equation means finding where the graph has the y-value you want, and two equations are both true where their graphs cross. That is why reading graphs and solving algebraically always agree.'},
 {id:'trans',u:7,pre:['line','cts'],t:'Graph transformations',g:G.trans,wp:0,s:'Changes outside the function act on y the way they look: f(x) + a moves up, af(x) stretches vertically, −f(x) reflects in the x-axis. Changes inside the bracket act on x the opposite way: f(x − a) moves right, f(ax) squashes, f(−x) reflects in the y-axis.',k:T`f(x-a)\to\text{right } a,\quad f(x)+a\to\text{up } a,\quad af(x)\to y\times a,\quad f(ax)\to x\div a`,w:'For y = f(x − 3) to give the same output as f did at x = 0, you need x = 3. Every point arrives 3 units later, so the graph shifts right. Inside changes are inverses, which is why they look backwards.'},
 {id:'func',u:8,pre:['subs','rearr'],t:'Composite & inverse functions',g:G.func,wp:0,s:'A function is a rule. fg(x) means apply g first, then f. The inverse f⁻¹ undoes f: write y = f(x), rearrange for x, then rename.',k:T`fg(x)=f(g(x)),\qquad f(x)=3x-2 \Rightarrow f^{-1}(x)=\frac{x+2}{3}`,w:'fg(x) reads right to left because the function next to x acts first, as in f(g(x)). The inverse reverses each step in reverse order. f⁻¹(x) is not 1/f(x).'},
 {id:'poly',u:8,pre:['subs','solveq'],t:'Remainder & factor theorem',g:G.poly,wp:0,s:'Remainder theorem: dividing p(x) by (x − a) leaves remainder p(a). Factor theorem: if p(a) = 0, then (x − a) is a factor. Once you have one factor of a cubic, divide it out to leave a quadratic.',k:T`p(x)=(x-a)q(x)+r \;\Rightarrow\; p(a)=r`,w:'Put x = a into p(x) = (x − a)q(x) + r: the first part becomes zero, leaving r. Watch the sign: dividing by (x + 2) means a = −2.'},
 {id:'log',u:9,pre:['ind'],t:'Logarithms',g:G.log,wp:1,s:'log_b N asks: what power of b gives N? Adding logs multiplies, subtracting divides, and a power comes down in front. Take logs of both sides to solve an equation where the unknown is in the power.',k:T`\log_b N = k \iff b^k=N,\quad \log M+\log N=\log MN,\quad \log M^k = k\log M`,w:'Logs are the inverse of exponentials, as square roots are the inverse of squaring. log(bˣ) = x log b brings the unknown down from the power, where you can solve for it.'},
 {id:'tri',u:10,pre:['rearr'],t:'Right-angled trigonometry',g:G.tri,wp:1,s:'Label the sides from the angle you’re using: hypotenuse (longest, opposite the right angle), opposite, adjacent. SOH CAH TOA tells you which ratio links the two sides you have. Use the inverse functions to find an angle. Keep your calculator in degrees.',k:T`\sin\theta=\frac{\text{opp}}{\text{hyp}},\quad \cos\theta=\frac{\text{adj}}{\text{hyp}},\quad \tan\theta=\frac{\text{opp}}{\text{adj}}`,w:'All right-angled triangles with the same angle θ are scaled copies of each other, so the ratio of any two sides depends only on θ. sin, cos and tan are names for those fixed ratios.'},
 {id:'exact',u:10,pre:['surd','tri'],t:'Exact trig values',g:G.exact,wp:0,s:'Learn sin, cos and tan of 30°, 45° and 60° from two triangles: half an equilateral triangle (1, √3, 2) and a right isosceles triangle (1, 1, √2). For angles beyond 90°, use the reference angle and CAST for the sign.',k:T`\sin30°=\tfrac12,\ \ \sin45°=\tfrac{\sqrt2}{2},\ \ \sin60°=\tfrac{\sqrt3}{2},\ \ \tan45°=1`,w:'Cut an equilateral triangle of side 2 in half: the pieces have sides 1, √3 and 2 with angles 30° and 60°. A right isosceles triangle with legs 1 has hypotenuse √2 and two 45° angles. Every exact value comes from reading these two shapes.'},
 {id:'sinerule',u:10,pre:['tri'],t:'The sine rule',g:G.sinerule,wp:0,s:'In any triangle, each side divided by the sine of its opposite angle gives the same number. Use it when you know a side and its opposite angle. When finding an angle, put the sines on top, and watch for the ambiguous case.',k:T`\frac{a}{\sin A}=\frac{b}{\sin B}=\frac{c}{\sin C}`,w:'Drop a perpendicular from C: its height is b sin A and also a sin B. Setting those equal gives a/sin A = b/sin B. The ambiguous case arises because sin θ = sin(180° − θ), so two different triangles can share the same data.'},
 {id:'cosrule',u:10,pre:['tri'],t:'The cosine rule',g:G.cosrule,wp:0,s:'Use it with two sides and the angle between them (to find the third side), or with all three sides (to find an angle). The side on its own on the left is the one opposite the angle.',k:T`c^2=a^2+b^2-2ab\cos C,\qquad \cos C=\frac{a^2+b^2-c^2}{2ab}`,w:'It’s Pythagoras with a correction. When C = 90°, cos C = 0 and you get c² = a² + b². An obtuse C has negative cosine, which makes c longer, as you’d expect.'},
 {id:'area',u:10,pre:['tri'],t:'Area of a triangle (½ab sin C)',g:G.area,wp:0,s:'Area = ½ab sin C, where C is the angle between sides a and b. Rearrange it to find a missing side or angle.',k:T`\text{Area}=\tfrac12 ab\sin C`,w:'½ × base × height still holds. With base a, the perpendicular height is b sin C, so the area is ½ab sin C. Because sin C = sin(180° − C), an acute and an obtuse angle can give the same area.'},
 {id:'tgraph',u:10,pre:['tri','trans'],t:'Trig graphs',g:G.tgraph,wp:0,s:'y = sin x and y = cos x wave between −1 and 1 every 360°; y = tan x repeats every 180°. y = a sin(bx) + c has amplitude |a|, period 360°/b, and centre line y = c.',k:T`y=a\sin(bx)+c:\quad \text{amplitude }|a|,\ \text{period }\tfrac{360°}{b}`,w:'These are graph transformations applied to the basic wave: a stretches vertically, b squashes horizontally (inside the bracket, so it divides), and c moves the wave up.'},
 {id:'teq',u:10,pre:['tgraph','tri'],t:'Solving trig equations',g:G.teq,wp:0,s:'Rearrange to sin x = k (or cos, tan), find the principal value with the inverse function, then use symmetry to find every solution in the range: sin uses 180° − x, cos uses 360° − x, tan adds 180°.',k:T`\sin x=k:\ x,\ 180°-x\qquad \cos x=k:\ x,\ 360°-x\qquad \tan x=k:\ x,\ x+180°`,w:'The calculator returns one angle, but the wave hits each height twice per cycle. The symmetry of each graph tells you where the second crossing is. For sin 2x, the wave runs twice as fast, so there are twice as many solutions.'},
 {id:'tident',u:10,pre:['exact','teq'],t:'Trig identities',g:G.tident,wp:0,s:'Two identities do most of the work: tan θ = sin θ / cos θ and sin²θ + cos²θ = 1. Use them to simplify expressions and to turn mixed equations into a quadratic in one function.',k:T`\tan\theta=\frac{\sin\theta}{\cos\theta},\qquad \sin^2\theta+\cos^2\theta=1`,w:'On a unit circle the point at angle θ is (cos θ, sin θ). Its distance from the centre is 1, so Pythagoras gives sin²θ + cos²θ = 1. Dividing the y-coordinate by the x-coordinate gives the gradient, which is tan θ.'},
 {id:'radians',u:10,pre:['frac','tri'],t:'Radians, arcs & sectors',g:G.radians,wp:0,s:'π radians = 180°. In radians, arc length is rθ and sector area is ½r²θ, with no factors of 360 to carry around.',k:T`\pi=180°,\qquad s=r\theta,\qquad A=\tfrac12 r^2\theta`,w:'One radian is the angle where the arc length equals the radius. A full turn has an arc of 2πr, so it’s 2π radians. Measuring angles this way makes arc length and area formulas simple, and it’s the unit calculus expects.'},
];

function gen(t,L,W,seed){const r=seed===undefined?null:rng(seed);let best=null,bs=1e9;for(let i=0;i<60;i++){const R_=r||rng((Math.random()*2**31)|0);const ex=t.g(R_,W);ex.lv=ex.lv||1;
  const s=Math.abs(ex.lv-L)*2+(W!==undefined&&!!ex.word!==W?5:0);if(s<bs){best=ex;bs=s;if(!s)break}}return best}

<script>

  s.a++;if(ok)s.c++;s.r=[...(s.r||[]),ok?1:0].slice(-10);s.t=Date.now();store.last=id;if(ok)s.top=Math.max(s.top||0,lv);
  if(auto&&lv===(s.lv||1)){if(ok){s.str=(s.str||0)+1;s.mis=0;if(s.str>=3&&(s.lv||1)<3){s.lv=(s.lv||1)+1;s.str=0;msg=`Level up: you’re now on level ${s.lv} of 3.`}}

function nextTopic(){return TOPICS.find(t=>!isLocked(t)&&!isMast(t.id))||null}

function icsText(){const by={};for(const t of TOPICS){const s=S(t.id);if(s&&s.sr){const d=dayStart(s.sr.due);(by[d]=by[d]||[]).push(t.t)}}

  <div class="cols"><div class="path">`;let n=0;

  <div class="panel weak"><h3>Needs work</h3>${weak.length?weak.slice(0,6).map(([t,s])=>`<a href="#t-${t.id}"><span>${esc(t.t)}</span><span class="pmeta">${Math.round(s.c/s.a*100)}%</span></a>`).join(''):'<p>Topics where your first-try accuracy drops below 60% (after four attempts) show up here.</p>'}</div>

const stepsHtml=st=>`<ol class="steps">${st.map(s=>`<li><div>${s}</div></li>`).join('')}</ol>`;

function lockedPage(head,title,body,btn){$('#view').innerHTML=`<header class="thead"><div><div class="eyebrow">${head}</div><h1>${esc(title)}</h1></div></header><div class="panel lockpanel"><h3>${LOCK}Locked</h3>${body}${btn}</div>`}
function topicPage(t){const v=$('#view');const L=lockInfo(t);if(L){const head=`${String(t.u+1).padStart(2,'0')} · ${esc(UNITS[t.u])} · topic ${TOPICS.indexOf(t)+1} of ${TOPICS.length}`;

  $('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;lab.rows.splice(+b.dataset.rm,1);if(!lab.rows.length)lab.rows.push('');renderRows();renderSliders();drawLab()});
  $('#addRow').onclick=()=>{if(lab.rows.length>=5)return;lab.rows.push('');renderRows();$('#eq'+(lab.rows.length-1)).focus()};
  $('#sliders').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const val=parseFloat(e.target.value);if(!isFinite(val))return;lab.p[k]=val;const o=e.target.type==='range'?$('#n_'+k):$('#s_'+k);if(o)o.value=val;drawLab()});
  v.querySelectorAll('#angSeg button').forEach(b=>b.onclick=()=>{lab.deg=b.dataset.d==='1';lab.xr=labX(lab.deg);lab.yr=labY();syncOpts();drawLab()});
  $('#keys').onchange=e=>{lab.keys=e.target.checked;drawLab()};
  v.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.preset];lab.rows=[...p.rows];lab.p={...(p.p||{})};lab.deg=!!p.deg;lab.xr=p.xr||labX(lab.deg);lab.yr=p.yr||labY();renderRows();renderSliders();syncOpts();drawLab()});
  const zoom=k=>{const cx=(lab.xr[0]+lab.xr[1])/2,cy=(lab.yr[0]+lab.yr[1])/2,hx=(lab.xr[1]-lab.xr[0])/2*k,hy=(lab.yr[1]-lab.yr[0])/2*k;lab.xr=[cx-hx,cx+hx];lab.yr=[cy-hy,cy+hy];drawLab()};
  $('#zin').onclick=()=>zoom(1/1.4);$('#zout').onclick=()=>zoom(1.4);$('#zfit').onclick=()=>{lab.yr=null;drawLab()};$('#zreset').onclick=()=>{lab.xr=labX(lab.deg);lab.yr=labY();drawLab()};
  const box=$('#labsvg');let drag=null,raf=0;const redraw=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;drawLab()})};
  const at=e=>{const r=box.querySelector('svg').getBoundingClientRect();const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;return{x:lab.xr[0]+fx*(lab.xr[1]-lab.xr[0]),y:lab.yr[1]-fy*(lab.yr[1]-lab.yr[0]),r}};
  box.addEventListener('pointerdown',e=>{if(!lab.yr||!box.querySelector('svg'))return;const p=at(e);drag={sx:e.clientX,sy:e.clientY,xr:[...lab.xr],yr:[...lab.yr],w:p.r.width,h:p.r.height};try{box.setPointerCapture(e.pointerId)}catch(x){}});
  box.addEventListener('pointermove',e=>{if(drag){const dx=(e.clientX-drag.sx)/drag.w*(drag.xr[1]-drag.xr[0]),dy=(e.clientY-drag.sy)/drag.h*(drag.yr[1]-drag.yr[0]);lab.xr=[drag.xr[0]-dx,drag.xr[1]-dx];lab.yr=[drag.yr[0]+dy,drag.yr[1]+dy];redraw()}
    else if(lab.yr&&box.querySelector('svg')){const p=at(e);$('#readout').textContent=`x = ${fmtP(p.x)}${lab.deg?'°':''}, y = ${fmtP(p.y)}`}});
  const end=()=>{drag=null};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{if(!lab.yr||!box.querySelector('svg'))return;e.preventDefault();const p=at(e),k=e.deltaY>0?1.15:1/1.15;lab.xr=[p.x-(p.x-lab.xr[0])*k,p.x+(lab.xr[1]-p.x)*k];lab.yr=[p.y-(p.y-lab.yr[0])*k,p.y+(lab.yr[1]-p.y)*k];redraw()},{passive:false})}
function syncOpts(){document.querySelectorAll('#angSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.d==='1')===!!lab.deg));const k=$('#keys');if(k)k.checked=!!lab.keys}
function renderRows(){$('#rows').innerHTML=`<div class="eyebrow">Equations</div>`+lab.rows.map((e,i)=>`<div class="lrow"><span class="sw c${i}"></span><label for="eq${i}">y =</label><input id="eq${i}" data-i="${i}" value="${esc(e)}" spellcheck="false" autocomplete="off" placeholder="e.g. x^2 - 4"><button type="button" class="xbtn" data-rm="${i}" aria-label="Remove equation ${i+1}">×</button></div><div class="rerr" id="err${i}"></div>`).join('');const a=$('#addRow');if(a)a.disabled=lab.rows.length>=5}
function renderSliders(){const P=labParams();const el=$('#sliders');el.dataset.k=P.join(',');
  el.innerHTML=P.length?`<div class="eyebrow">Sliders</div>`+P.map(k=>{const v=lab.p[k]??1;return`<div class="sl"><label for="s_${k}">${k}</label><input type="range" id="s_${k}" data-k="${k}" min="-10" max="10" step="0.1" value="${v}"><input type="number" class="pnum" id="n_${k}" data-k="${k}" step="0.1" value="${v}" aria-label="Value of ${k}"></div>`}).join(''):'<p class="note">Add a letter such as <code>a</code> or <code>m</code> to an equation to get a slider for it.</p>'}
function drawLab(){if(!$('#labsvg'))return;const P=labParams(),env={};for(const k of P)env[k]=lab.p[k]??1;
  const fns=[];lab.rows.forEach((e,i)=>{let ok=true,fn=null;if(e.trim()){try{fn=compile(e,{deg:lab.deg});fn({...env,x:1,e:Math.E})}catch(x){ok=false}}
    const err=$('#err'+i);if(err)err.textContent=ok?'':'Can’t read this yet. Check brackets and use ^ for powers.';const inp=$('#eq'+i);if(inp)inp.classList.toggle('bad',!ok);if(ok&&e.trim())fns.push({e,c:i,fn})});
  const sp={fns:fns.map(f=>({e:f.e,c:f.c,l:'y = '+f.e})),deg:lab.deg,xr:lab.xr,yr:lab.yr,env,pts:[],alt:'Graph of '+fns.map(f=>'y = '+f.e).join(', ')};
  const rows=[];
  if(lab.keys&&fns.length){const E={...env,e:Math.E};const L=fns.slice(0,5);
    for(const f of L){const k=keyPts(f.fn,{...E},lab.xr[0],lab.xr[1]);const parts=[];
      if(k.roots.length){parts.push((k.roots.length>1?'roots x = ':'root x = ')+k.roots.slice(0,8).map(fmtP).join(', '));k.roots.slice(0,12).forEach(r=>sp.pts.push([r,0,false,`root (${fmtP(r)}, 0)`,f.c]))}
      if(k.turns.length){parts.push((k.turns.length>1?'turning points ':'turning point ')+k.turns.slice(0,6).map(t=>`(${fmtP(t[0])}, ${fmtP(t[1])})`).join(', '));k.turns.slice(0,12).forEach(t=>sp.pts.push([t[0],t[1],false,`turning point (${fmtP(t[0])}, ${fmtP(t[1])})`,f.c]))}
      if(lab.xr[0]<=0&&lab.xr[1]>=0){E.x=0;const y=f.fn(E);if(isFinite(y)){parts.push(`y-intercept (0, ${fmtP(y)})`);sp.pts.push([0,y,false,`y-intercept (0, ${fmtP(y)})`,f.c])}}
      rows.push(`<div class="krow"><span class="sw c${f.c}"></span><span><b>y = ${esc(f.e)}</b>${parts.length?': '+esc(parts.join(' · ')):': no roots or turning points in view'}</span></div>`)}
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const A=L[i],B=L[j];const k=keyPts(en=>A.fn(en)-B.fn(en),{...E},lab.xr[0],lab.xr[1]);if(!k.roots.length)continue;
      const ps=k.roots.slice(0,8).map(r=>{E.x=r;return[r,A.fn(E)]});ps.forEach(p=>sp.pts.push([p[0],p[1],false,`crossing (${fmtP(p[0])}, ${fmtP(p[1])})`,A.c]));
      rows.push(`<div class="krow"><span class="sw c${A.c}"></span><span class="sw c${B.c}"></span><span>Cross at ${ps.map(p=>`(${fmtP(p[0])}, ${fmtP(p[1])})`).join(', ')}</span></div>`)}}
  $('#labsvg').innerHTML=fns.length?plotSVG(sp,{W:600,H:400,noLegend:true,r:5}):plotSVG({fns:[],xr:lab.xr,yr:lab.yr||[-6,6],deg:lab.deg},{W:600,H:400});
  lab.yr=sp._yr||lab.yr||[-6,6];$('#keylist').innerHTML=rows.join('');saveLab()}

function route(){const h=location.hash.slice(1);boardActive=false;renderRail();$('#rail').classList.remove('open');$('#railToggle').setAttribute('aria-expanded','false');
  if(h.startsWith('t-')&&byId[h.slice(2)])topicPage(byId[h.slice(2)]);else if(h==='review')reviewPage();else if(/^cp-\d+$/.test(h)&&UNITS[+h.slice(3)])cpPage(+h.slice(3));else if(h==='learn')return;else if(h==='lab')labPage();else home();addBack();try{window.scrollTo(0,0)}catch(e){}}
function addBack(){const v=$('#view');if(v.querySelector('.hero')||v.querySelector('.back'))return;v.insertAdjacentHTML('afterbegin','<a class="back" href="#home"><span aria-hidden="true">←</span> Back to overview</a>')}
$('#railToggle').onclick=()=>{const o=$('#rail').classList.toggle('open');$('#railToggle').setAttribute('aria-expanded',o)};
window.addEventListener('hashchange',()=>{if(location.hash!=='#learn')route()});
loadLocal();setSync('local');route();initDb();
if(window.claude&&window.claude.use)claude.use('sample').then(s=>{if(s){sampleFn=s;document.querySelectorAll('#ai').forEach(a=>{if(!a.closest('.board')||!/Checkpoint/.test(a.closest('.board').querySelector('.eyebrow').textContent))a.hidden=false})}}).catch(()=>{});
}

</script>
