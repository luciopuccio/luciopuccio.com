  aside:'Set your calculator to radians (R) when the angle is in radians, and back to degrees after.'},
 recap:{formula:T`\pi=180°,\qquad s=r\theta,\qquad A=\tfrac12r^2\theta`,points:['Degrees → radians: × π/180.','Radians → degrees: × 180/π.','Arc and sector formulas need θ in radians.','Leave π in for exact answers.']}}
});
Object.assign(LEARN,{
exp2:{mins:4,
 intro:T`<p>Expanding means multiplying out brackets so there are none left. With two brackets, <b>every term in the first bracket multiplies every term in the second</b>:</p><div class="bigf">\[(x+3)(x+5)=x^2+5x+3x+15=x^2+8x+15\]</div>
<p>Two terms times two terms makes four products. Usually the two middle ones are both \(x\) terms, so they collect into one, and you end up with the form \(ax^2+bx+c\).</p>
<p>Why bother? Almost everything else in Quadratics starts from \(ax^2+bx+c\): factorising, the formula, completing the square. Expanding is how you get there.</p>`,
 walk:{q:T`Expand \((2x-3)(x+4)\).`,steps:[
  {do:'Split the first bracket',line:T`2x(x+4)-3(x+4)`,why:T`Each term of the first bracket takes a turn multiplying the whole second bracket: first \(2x\), then \(-3\).`,warn:T`The \(-3\) keeps its minus sign. It is the term “minus 3”, not 3.`},
  {do:'Multiply out the first part',line:T`2x^2+8x`,think:T`What are \(2x\times x\) and \(2x\times4\)?`,why:T`\(2x\times x=2x^2\) and \(2x\times4=8x\).`},
  {do:'Multiply out the second part',line:T`-3x-12`,think:T`What are \(-3\times x\) and \(-3\times4\)?`,why:'A negative times a positive is negative, so both terms are negative.',warn:T`The classic slip is \(-3\times4=+12\). It is \(-12\).`},
  {do:'Put the four terms together',line:T`2x^2+8x-3x-12`,why:'That is all four products: first×first, first×last, last×first, last×last.'},
  {do:'Collect the x terms',line:T`2x^2+5x-12`,think:T`What is \(8x-3x\)?`,why:T`The two middle terms are both \(x\) terms, so they combine: \(8x-3x=5x\).`},
  {do:'Sense-check with a number',line:T`x=1:\ (-1)(5)=-5,\ \ 2+5-12=-5\ \checkmark`,why:T`Put any easy number, like \(x=1\), into the question and into your answer. They must give the same value.`}]},
 faded:{q:T`Expand \((x-5)(x+2)\).`,parts:[
  {given:T`x(x+2)-5(x+2)`,note:'Split the first bracket.'},
  {blanks:[{pre:'x(x + 2) =',ans:'x^2+2x',kind:'expr',show:T`x^2+2x`}],note:'Multiply out the first part.',hint:T`\(x\times x=x^2\) and \(x\times2=2x\).`},
  {blanks:[{pre:'−5(x + 2) =',ans:'-5x-10',kind:'expr',show:T`-5x-10`}],note:'Now the second part.',hint:T`\(-5\times x=-5x\) and \(-5\times2=-10\).`},
  {blanks:[{pre:'Answer:',ans:'x^2-3x-10',kind:'expr',form:'expanded',show:T`x^2-3x-10`}],note:'Collect the x terms.',hint:T`\(2x-5x=-3x\).`}]},
 own:{q:T`Expand \((3x+1)(2x-5)\).`,kind:'expr',ans:'6x^2-13x-5',form:'expanded',fmt:'e.g. <code>2x^2 + 3x - 4</code>',tip:'Four products, then collect the two x terms. Watch the signs.',
  lines:[T`3x(2x-5)+1(2x-5)`,T`6x^2-15x+2x-5`,T`6x^2-13x-5`]},
 spot:{use:[T`Two brackets multiplied together, like \((x+4)(x-1)\).`,T`A squared bracket, like \((x+3)^2\). Write it as \((x+3)(x+3)\) first.`,T`You need an equation in the form \(ax^2+bx+c=0\) before you can solve it.`],
  not:['The question says “factorise”. That’s the reverse: going back into brackets.',T`An equation like \((x-2)(x+5)=0\). Don’t expand it: it’s already ready to solve.`],
  aside:T`\((x+3)^2\) is <b>not</b> \(x^2+9\). There are four products, so it is \(x^2+6x+9\).`},
 recap:{formula:T`(a+b)(c+d)=ac+ad+bc+bd`,points:['Every term in the first bracket multiplies every term in the second.','Each term keeps its sign.','Collect like terms at the end, usually the two x terms.',T`Square brackets are double brackets: \((x+k)^2=(x+k)(x+k)\).`,'Check by putting in an easy number.']}},

fac2:{mins:5,
 intro:T`<p>Factorising is expanding in reverse: you start with \(ax^2+bx+c\) and write it as two brackets multiplied together.</p><div class="bigf">\[x^2+7x+12=(x+3)(x+4)\]</div>
<p>When \(a=1\), you need two numbers that <b>multiply to \(c\)</b> and <b>add to \(b\)</b>. Here 3 and 4: \(3\times4=12\) and \(3+4=7\).</p>
<p>When \(a\) isn’t 1, use the same idea with \(a\times c\) instead of \(c\), then split the middle term. The walkthrough shows how.</p>
<p>Why it matters: the factorised form shows straight away where the graph crosses the x-axis, and it lets you solve equations and cancel algebraic fractions.</p>`,
 walk:{q:T`Factorise \(2x^2+7x+3\).`,steps:[
  {do:'Read off a, b and c',line:T`a=2,\quad b=7,\quad c=3`,why:T`Because \(a\) isn’t 1, the quick “multiply to \(c\)” trick won’t work directly. You use \(a\times c\) instead.`},
  {do:'Multiply a by c',line:T`ac=2\times3=6`,why:'This is the target product.'},
  {do:'Find two numbers: multiply to ac, add to b',line:T`6\times1=6,\quad 6+1=7`,think:'Which two numbers multiply to 6 and add to 7?',why:'List the factor pairs of 6 (1 and 6, 2 and 3) and pick the pair that adds to 7.'},
  {do:'Split the middle term using them',line:T`2x^2+6x+x+3`,why:T`\(7x\) is rewritten as \(6x+x\). Nothing has changed in value, but now it splits into two pairs.`},
  {do:'Factorise each pair',line:T`2x(x+3)+1(x+3)`,think:'What is the common factor of the first two terms? And of the last two?',why:T`\(2x^2+6x=2x(x+3)\) and \(x+3=1(x+3)\). Both brackets match, which tells you it is working.`,warn:T`If the brackets don’t match, recheck your numbers or signs. Write the 1 in \(1(x+3)\) so you don’t lose it.`},
  {do:'Take out the common bracket',line:T`(x+3)(2x+1)`,why:T`\((x+3)\) is in both parts, so it comes out, leaving \((2x+1)\). Check by expanding: \(2x^2+x+6x+3\ \checkmark\)`}]},
 faded:{q:T`Factorise \(x^2-x-12\).`,parts:[
  {given:T`a=1,\quad b=-1,\quad c=-12`,note:'Here a = 1, so you only need two numbers that multiply to c and add to b.'},
  {blanks:[{pre:'first number:',ans:-4},{pre:'second number:',ans:3}],any:true,note:'Multiply to −12 and add to −1.',hint:'One of them must be negative (the product is negative). Try −4 and 3.'},
  {blanks:[{pre:'x² − x − 12 =',ans:'(x-4)(x+3)',kind:'expr',form:'brackets',show:T`(x-4)(x+3)`}],note:'Put each number into a bracket with x.',hint:T`The numbers go straight in: \((x-4)(x+3)\).`}]},
 own:{q:T`Factorise \(3x^2-10x+8\).`,kind:'expr',ans:'(x-2)(3x-4)',form:'full',fmt:'e.g. <code>(2x - 1)(x + 3)</code>',tip:T`\(a\ne1\), so find two numbers that multiply to \(ac=24\) and add to \(-10\).`,
  lines:[T`ac=24:\quad -6\times-4=24,\ \ -6-4=-10`,T`3x^2-6x-4x+8`,T`3x(x-2)-4(x-2)`,T`(x-2)(3x-4)`]},
 spot:{use:['The question says “factorise” or “fully factorise”.',T`You’re solving \(ax^2+bx+c=0\) and the numbers look friendly.`,'You need to simplify an algebraic fraction (factorise top and bottom, then cancel).'],
  not:[T`\(b^2-4ac\) isn’t a perfect square: it won’t factorise with whole numbers. Use the formula or completing the square.`,T`There’s no number term, like \(x^2+5x\). Just take out the common factor: \(x(x+5)\).`],
  aside:T`Special case: \(x^2-9\) is a <b>difference of two squares</b>, \((x-3)(x+3)\).`},
 recap:{formula:T`x^2+bx+c=(x+p)(x+q),\ \ pq=c,\ \ p+q=b`,points:['a = 1: find two numbers that multiply to c and add to b.','a ≠ 1: multiply to ac, add to b, split the middle term, factorise in pairs.','The brackets must match when you factorise in pairs.','A negative c means one number is negative.','Always check by expanding.']}},

solveq:{mins:4,
 intro:T`<p>If two numbers multiply to make zero, one of them must be zero. That one fact solves a lot of quadratics:</p><div class="bigf">\[(x-5)(x+2)=0\ \Rightarrow\ x=5\ \text{or}\ x=-2\]</div>
<p>So the plan is: get everything on one side so the other side is <b>zero</b>, factorise, then set each bracket equal to zero.</p>
<p>It’s the fastest method when the quadratic factorises nicely. A quadratic usually has two solutions: they’re where its graph crosses the x-axis.</p>`,
 walk:{q:T`Solve \(x^2=3x+10\).`,steps:[
  {do:'Make one side zero',line:T`x^2-3x-10=0`,why:T`Subtract \(3x\) and 10 from both sides.`,warn:'The zero trick only works with zero on one side. (x − 5)(x + 2) = 6 tells you nothing about each bracket.'},
  {do:'Factorise',line:T`(x-5)(x+2)=0`,think:T`Which two numbers multiply to \(-10\) and add to \(-3\)?`,why:T`\(-5\times2=-10\) and \(-5+2=-3\).`},
  {do:'Set each bracket equal to zero',line:T`x-5=0\quad\text{or}\quad x+2=0`,why:'The product is zero, so at least one bracket is zero.'},
  {do:'Solve each one',line:T`x=5\quad\text{or}\quad x=-2`,think:'What value of x makes each bracket zero?',why:'Each bracket is a one-step equation.',warn:T`The sign flips: \(x+2=0\) gives \(x=-2\), not 2.`},
  {do:'Check in the original equation',line:T`x=5:\ 25=15+10\ \checkmark`,why:'Put one answer back into the question. Both sides should match.'}]},
 faded:{q:T`Solve \(x^2+2x-15=0\).`,parts:[
  {given:T`x^2+2x-15=0`,note:'Already equal to zero.'},
  {blanks:[{pre:'x² + 2x − 15 =',ans:'(x+5)(x-3)',kind:'expr',form:'brackets',show:T`(x+5)(x-3)`}],note:'Factorise.',hint:T`You need two numbers that multiply to \(-15\) and add to 2: that’s 5 and \(-3\).`},
  {given:T`x+5=0\quad\text{or}\quad x-3=0`,note:'Each bracket equals zero.'},
  {blanks:[{pre:'x =',ans:-5},{pre:'or x =',ans:3}],any:true,note:'Solve each one.',hint:T`\(x+5=0\) means \(x=-5\).`}]},
 own:{q:T`Solve \(2x^2+5x=3\).`,kind:'set',ans:[0.5,-3],fmt:'both solutions, e.g. <code>2, -3</code>',tip:'Is one side zero yet?',
  lines:[T`2x^2+5x-3=0`,T`(2x-1)(x+3)=0`,T`x=\tfrac12\quad\text{or}\quad x=-3`]},
 spot:{use:[T`An equation with \(x^2\) where the numbers look friendly.`,T`An equation already in factorised form, like \(x(x-4)=0\).`],
  not:['It won’t factorise: use the quadratic formula or completing the square.',T`You’re tempted to divide both sides by \(x\) in \(x^2=4x\). Don’t: you lose the solution \(x=0\). Write \(x^2-4x=0\), so \(x(x-4)=0\).`]},
 recap:{formula:T`AB=0\ \Rightarrow\ A=0\ \text{or}\ B=0`,points:['Rearrange so one side is zero.','Factorise.','Set each bracket to zero and solve.','Never divide by x: you lose a solution.','Check by substituting back.']}},

cts:{mins:5,
 intro:T`<p>Completing the square rewrites \(x^2+bx+c\) with a squared bracket:</p><div class="bigf">\[x^2+6x+2=(x+3)^2-7\]</div>
<p>The number in the bracket is <b>half of \(b\)</b>. Squaring that bracket gives you an extra number you didn’t want, so you take it away again.</p>
<p>Why do it? The completed form tells you the <b>turning point</b> of the graph straight away (here \((-3,-7)\)), the minimum value (−7), and it solves equations exactly, even ones that won’t factorise.</p>`,
 walk:{q:T`Write \(x^2+6x+2\) in the form \((x+p)^2+q\), then solve \(x^2+6x+2=0\).`,steps:[
  {do:'Halve b',line:T`\tfrac{6}{2}=3`,think:'What is half of the number in front of x?',why:T`That number goes in the bracket: \((x+3)^2\).`},
  {do:'Write the bracket, then take away its square',line:T`(x+3)^2-9+2`,why:T`\((x+3)^2=x^2+6x+9\). That adds a 9 that wasn’t there, so subtract 9 to keep the value the same.`,warn:'Subtract the square of the half (9), not the half itself (3).'},
  {do:'Tidy the numbers',line:T`(x+3)^2-7`,why:T`\(-9+2=-7\). This is the completed form. The turning point is \((-3,-7)\): note the sign change on the \(x\) value.`},
  {do:'To solve, set it equal to zero',line:T`(x+3)^2=7`,why:'Move the −7 across.'},
  {do:'Square root both sides',line:T`x+3=\pm\sqrt7`,why:'A square root has a positive and a negative answer.',warn:'Forgetting the ± loses one of the two solutions.'},
  {do:'Finish',line:T`x=-3\pm\sqrt7`,why:T`Subtract 3. That’s two exact answers: \(-3+\sqrt7\) and \(-3-\sqrt7\).`}]},
 faded:{q:T`Write \(x^2-8x+5\) in the form \((x+p)^2+q\) and state its minimum value.`,parts:[
  {blanks:[{pre:'half of b =',ans:-4}],note:'Halve the number in front of x, with its sign.',hint:T`\(b=-8\), so half of it is \(-4\).`},
  {given:T`(x-4)^2-16+5`,note:'Bracket, then take away its square: (−4)² = 16.'},
  {blanks:[{pre:'(x − 4)² +',ans:-11}],note:'Tidy the numbers.',hint:T`\(-16+5\).`},
  {blanks:[{pre:'minimum value =',ans:-11},{pre:'when x =',ans:4}],note:'The squared bracket is never negative, so the smallest it can be is 0.',hint:T`\((x-4)^2=0\) when \(x=4\), leaving \(-11\).`}]},
 own:{q:T`Write \(x^2+10x+30\) in the form \((x+p)^2+q\).`,kind:'cts',ans:'(x+5)^2+5',form:'square',fmt:'e.g. <code>(x - 2)^2 + 5</code>',tip:T`Halve 10, then take away its square.`,
  lines:[T`\tfrac{10}{2}=5`,T`(x+5)^2-25+30`,T`(x+5)^2+5`]},
 spot:{use:[T`The question asks for the form \((x+p)^2+q\).`,'You need the turning point, or the minimum or maximum value.',T`You want exact solutions and \(a=1\) with an even \(b\).`],
  not:['The question wants decimal answers: the formula is quicker.',T`\(a\ne1\): it still works, but you have to take \(a\) out as a factor first, which is fiddly.`]},
 recap:{formula:T`x^2+bx+c=\left(x+\tfrac b2\right)^2-\left(\tfrac b2\right)^2+c`,points:['The bracket number is half of b, with its sign.','Take away the square of that number.',T`\((x+p)^2+q\) has turning point \((-p,\ q)\).`,'When solving, remember the ±.']}},

disc:{mins:3,
 intro:T`<p>The <b>discriminant</b> is the part of the quadratic formula under the square root:</p><div class="bigf">\[b^2-4ac\]</div>
<p>It tells you <b>how many</b> solutions \(ax^2+bx+c=0\) has without solving it:</p>
<ul><li>positive: two solutions (the graph crosses the x-axis twice)</li><li>zero: one repeated solution (the graph just touches the axis)</li><li>negative: no real solutions (the graph misses the axis)</li></ul>
<p>Why? You can’t square-root a negative number, and \(\pm\sqrt0\) gives the same answer twice.</p>`,
 walk:{q:T`How many real solutions does \(3x^2-4x+2=0\) have?`,steps:[
  {do:'Read off a, b and c',line:T`a=3,\quad b=-4,\quad c=2`,why:'Signs included, as always.'},
  {do:'Work out b² − 4ac',line:T`(-4)^2-4(3)(2)=16-24=-8`,think:T`What is \((-4)^2-4\times3\times2\)?`,why:'Substitute carefully. The square of a negative is positive.',warn:T`\((-4)^2=16\), not \(-16\).`},
  {do:'Read the sign',line:T`-8<0\ \Rightarrow\ \text{no real solutions}`,why:'A negative discriminant means the formula would need the square root of a negative number.'},
  {do:'Picture the graph',line:T`\text{U-shape sitting above the x-axis}`,why:T`\(a=3\) is positive, so it’s U-shaped. No solutions means it never reaches the axis.`}]},
 faded:{q:T`\(x^2+kx+9=0\) has one repeated solution. Find the positive value of \(k\).`,parts:[
  {given:T`b^2-4ac=0`,note:'One repeated solution means the discriminant is zero.'},
  {blanks:[{pre:'b² − 4ac = k² −',ans:36}],note:'Substitute a = 1, b = k, c = 9.',hint:T`\(4\times1\times9=36\).`},
  {blanks:[{pre:'k =',ans:6}],note:'Solve k² − 36 = 0 and take the positive answer.',hint:T`\(k^2=36\), so \(k=\pm6\).`}]},
 own:{q:T`How many real solutions does \(2x^2+3x-4=0\) have?`,kind:'num',ans:2,fmt:'a number: <code>0</code>, <code>1</code> or <code>2</code>',tip:'Work out b² − 4ac and look at its sign.',
  lines:[T`a=2,\ b=3,\ c=-4`,T`9-4(2)(-4)=9+32=41`,T`41>0\ \Rightarrow\ 2\ \text{solutions}`]},
 spot:{use:['“How many solutions / roots” or “how many times does the graph cross the axis”.','“Equal roots”, “repeated root”, “real roots”, “no real roots”, often with an unknown k.','Checking quickly whether a quadratic will factorise (perfect square → yes).'],
  not:['You need the actual solutions: solve it instead.']},
 recap:{formula:T`b^2-4ac`,points:['Positive: two real solutions.','Zero: one repeated solution.','Negative: no real solutions.','Equal or repeated roots means set it equal to 0.','Real roots means ≥ 0.']}},

qineq:{mins:5,
 intro:T`<p>A quadratic inequality, like \(x^2-x-6>0\), asks: <b>for which \(x\) is the graph above (or below) the x-axis?</b></p>
<p>Solve the matching equation to find where the graph crosses the axis (the <b>critical values</b>), sketch the U-shape through them, then read off the part you want:</p>
<div class="bigf">\[{>}0:\ \text{outside the roots}\qquad{<}0:\ \text{between them}\]</div>
<p>That rule is for a U-shaped graph (positive \(x^2\)). The sketch is what makes it reliable, so always draw it.</p>`,
 walk:{q:T`Solve \(x^2-x-6>0\).`,steps:[
  {do:'Write the matching equation',line:T`x^2-x-6=0`,why:'First find where the graph crosses the x-axis.'},
  {do:'Factorise',line:T`(x-3)(x+2)=0`,think:T`Two numbers that multiply to \(-6\) and add to \(-1\)?`,why:T`\(-3\times2=-6\), \(-3+2=-1\).`},
  {do:'Critical values',line:T`x=-2,\quad x=3`,why:'These are the crossing points.'},
  {do:'Sketch',line:T`\text{U-shape crossing at }-2\text{ and }3`,why:'Above the axis on the outside, below it between the crossing points.'},
  {do:'Read off the part you want',line:T`x<-2\quad\text{or}\quad x>3`,why:'> 0 means above the axis: the two outer pieces.',warn:T`Two separate pieces need “or”. Never write \(3<x<-2\).`}]},
 faded:{q:T`Solve \(x^2-5x+4\le0\).`,parts:[
  {given:T`(x-1)(x-4)=0`,note:'Matching equation, factorised.'},
  {blanks:[{pre:'x =',ans:1},{pre:'and x =',ans:4}],any:true,note:'The critical values.',hint:'Each bracket equal to zero.'},
  {given:T`\le0\ \Rightarrow\ \text{below the axis}\ \Rightarrow\ \text{between}`,note:'Read the sketch.'},
  {blanks:[{pre:'lower end:',ans:1},{pre:'upper end:',ans:4}],note:'≤ includes the end points.',hint:T`So the answer is \(1\le x\le4\).`}]},
 own:{q:T`Solve \(x^2+2x-8<0\).`,kind:'range',ans:{in:true,a:-4,b:2,ia:false,ib:false},fmt:'e.g. <code>-1 &lt; x &lt; 5</code> or <code>x &lt; 1 or x &gt; 4</code> (type <code>&lt;=</code> for ≤)',tip:'Factorise, find the critical values, then sketch: < 0 means below the axis.',
  lines:[T`(x+4)(x-2)=0`,T`x=-4,\ \ x=2`,T`{<}0:\ \text{between}`,T`-4<x<2`]},
 spot:{use:[T`An inequality containing \(x^2\).`,'“For which values of x is … positive / negative?”','Discriminant questions with “real roots”, which become b² − 4ac ≥ 0.'],
  not:['A linear inequality (no x²): solve it like an equation.',T`Never just “solve” \(x^2>9\) as \(x>3\). Use the sketch: \(x<-3\) or \(x>3\).`]},
 recap:{formula:T`{>}0:\ \text{outside}\qquad{<}0:\ \text{between}`,points:['Solve the matching equation for the critical values.','Sketch the U-shape through them.','Above the axis (> 0): two outer pieces joined by “or”.','Below the axis (< 0): one piece between the values.','≤ and ≥ include the critical values.']}},

simq:{mins:5,
 intro:T`<p>Here one equation is a straight line and the other is a curve, and you want the points where they meet.</p>
<p>The method: <b>substitute</b> the line into the curve. That gives a quadratic in one letter. Solve it, then put each answer back into the line to get the matching value of the other letter.</p>
<p>A line usually meets a curve at <b>two</b> points, so you get two pairs of answers. Keep each \(x\) with its own \(y\).</p>`,
 walk:{q:T`Solve \(y=x^2-2x\) and \(y=x+4\) simultaneously.`,steps:[
  {do:'Set the two expressions for y equal',line:T`x^2-2x=x+4`,why:T`Both equal \(y\), so they equal each other. Now there’s only \(x\).`},
  {do:'Make one side zero',line:T`x^2-3x-4=0`,why:T`Subtract \(x\) and 4 from both sides.`},
  {do:'Factorise',line:T`(x-4)(x+1)=0`,think:T`Two numbers that multiply to \(-4\) and add to \(-3\)?`,why:T`\(-4\times1=-4\), \(-4+1=-3\).`},
  {do:'Solve',line:T`x=4\quad\text{or}\quad x=-1`,why:'Two x values, so two meeting points.'},
  {do:'Find each y using the line',line:T`y=8\quad\text{or}\quad y=3`,think:T`Put \(x=4\) and \(x=-1\) into \(y=x+4\).`,why:'The linear equation is the easiest one to substitute into.',warn:'Keep the pairs together: x = 4 goes with y = 8.'},
  {do:'Write the answer as pairs',line:T`(4,\,8)\ \text{and}\ (-1,\,3)`,why:'These are the two points where the line crosses the curve.'}]},
 faded:{q:T`Solve \(y=x+2\) and \(x^2+y^2=20\) simultaneously.`,parts:[
  {given:T`x^2+(x+2)^2=20`,note:'Substitute the line into the curve.'},
  {blanks:[{pre:'(x + 2)² =',ans:'x^2+4x+4',kind:'expr',form:'expanded',show:T`x^2+4x+4`}],note:'Expand the squared bracket.',hint:T`\((x+2)(x+2)\): four products.`},
  {given:T`2x^2+4x-16=0\ \Rightarrow\ x^2+2x-8=0`,note:'Collect, make one side zero, divide by 2.'},
  {blanks:[{pre:'x =',ans:2},{pre:'or x =',ans:-4}],any:true,note:'Solve the quadratic.',hint:T`\((x+4)(x-2)=0\).`},
  {blanks:[{pre:'when x = 2, y =',ans:4},{pre:'when x = −4, y =',ans:-2}],note:'Back into the line y = x + 2.',hint:'Add 2 to each x.'}]},
 own:{q:T`Find the points where \(y=x^2+1\) meets \(y=3x-1\).`,kind:'pts',ans:[[1,2],[2,5]],fmt:'points, e.g. <code>(1, 2), (3, 4)</code>',tip:'Set them equal, make one side zero, solve, then use the line to find each y.',
  lines:[T`x^2+1=3x-1`,T`x^2-3x+2=0`,T`(x-1)(x-2)=0`,T`(1,\,2)\ \text{and}\ (2,\,5)`]},
 spot:{use:[T`One equation is linear and the other has \(x^2\), \(y^2\) or \(xy\).`,'“Where does the line meet the curve?” or “find the points of intersection”.'],
  not:['Both equations are linear: use elimination or substitution as normal.'],
  aside:'If the quadratic you get has no solutions (discriminant negative), the line misses the curve. If it has one, the line just touches it.'},
 recap:{formula:T`\text{line}\ \to\ \text{curve}\ \to\ \text{quadratic}\ \to\ \text{back into line}`,points:['Rearrange the linear equation for one letter.','Substitute it into the curve.','Solve the quadratic.','Use the line to find the partner of each answer.','Give the answers as pairs.']}},

afrac:{mins:5,
 intro:T`<p>Algebraic fractions follow exactly the same rules as number fractions. Two skills cover most questions:</p>
<ul><li><b>Simplifying:</b> factorise the top and the bottom, then cancel any bracket that appears in both.</li><li><b>Adding or subtracting:</b> use a common denominator, just like \(\tfrac12+\tfrac13=\tfrac{3+2}{6}\).</li></ul>
<div class="bigf">\[\frac{x^2-9}{x^2+5x+6}=\frac{(x-3)(x+3)}{(x+2)(x+3)}=\frac{x-3}{x+2}\]</div>
<p>The golden rule: you can only cancel <b>factors</b> (things multiplied), never single terms in a sum.</p>`,
 walk:{q:T`Simplify \(\dfrac{x^2-9}{x^2+5x+6}\).`,steps:[
  {do:'Factorise the top',line:T`x^2-9=(x-3)(x+3)`,think:'This is a difference of two squares. What are the brackets?',why:T`\(a^2-b^2=(a-b)(a+b)\), with \(b=3\).`},
  {do:'Factorise the bottom',line:T`x^2+5x+6=(x+2)(x+3)`,think:'Two numbers that multiply to 6 and add to 5?',why:'2 and 3.'},
  {do:'Rewrite the fraction',line:T`\dfrac{(x-3)(x+3)}{(x+2)(x+3)}`,why:'Now you can see the common factor.'},
  {do:'Cancel the common bracket',line:T`\dfrac{x-3}{x+2}`,why:T`\((x+3)\) is multiplied on the top and on the bottom, so it cancels.`,warn:T`You can’t cancel the \(x\)s in \(\tfrac{x-3}{x+2}\): they are terms in a sum, not factors.`}]},
 faded:{q:T`Write \(\dfrac{2}{x+1}+\dfrac{3}{x-2}\) as a single fraction.`,parts:[
  {given:T`\text{common denominator: }(x+1)(x-2)`,note:'Multiply the two denominators.'},
  {given:T`\dfrac{2(x-2)+3(x+1)}{(x+1)(x-2)}`,note:'Each top is multiplied by the other fraction’s denominator.'},
  {blanks:[{pre:'top: 2(x − 2) + 3(x + 1) =',ans:'5x-1',kind:'expr',show:T`5x-1`}],note:'Expand and simplify the top.',hint:T`\(2x-4+3x+3\).`},
  {given:T`\dfrac{5x-1}{(x+1)(x-2)}`,note:'Done. Leave the bottom factorised.'}]},
 own:{q:T`Simplify \(\dfrac{2x^2+6x}{x^2-9}\).`,kind:'expr',ans:'2x/(x-3)',form:'cancel',fmt:'e.g. <code>3x/(x + 2)</code>',tip:'Factorise the top (common factor) and the bottom (difference of two squares), then cancel.',
  lines:[T`\dfrac{2x(x+3)}{(x-3)(x+3)}`,T`\dfrac{2x}{x-3}`]},
 spot:{use:[T`An \(x\) in a denominator.`,'“Simplify fully”: factorise everything, then cancel.','“Write as a single fraction”: common denominator.','An equation with fractions: multiply every term by the common denominator to clear them.'],
  not:[T`Cancelling terms: \(\tfrac{x+6}{x+2}\) is not \(\tfrac{6}{2}\), and it doesn’t simplify.`]},
 recap:{formula:T`\frac ab+\frac cd=\frac{ad+bc}{bd}`,points:['Factorise top and bottom before cancelling.','Only cancel whole factors (brackets), never terms.','Adding or subtracting: common denominator, then simplify the top.','Watch the signs when subtracting: put the second top in brackets.']}}
});
</script>
<script>
if(typeof document!=='undefined'){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5,IV=[1,3,7,21,60],CP_N=8,CP_PASS=6;
let store={topics:{},cp:{},last:null,updated:0},dbRef=null,saveT=null,saving=false,dirty=false,syncState='local';
function norm(){store.topics=store.topics||{};store.cp=store.cp||{};let ch=false;
  for(const t of Object.values(store.topics))if(t&&t.sr&&t.sr.due){const d=dayStart(t.sr.due);if(d!==t.sr.due){t.sr.due=d;ch=true}}
  if((store.rvV||0)<2){for(const t of Object.values(store.topics)){if(!t||!t.rv||!t.sr)continue;
      if(t.rv.c>=1){t.sr.lvl=Math.min(t.sr.lvl+1,IV.length-1);t.sr.due=dayStart(Date.now()+IV[t.sr.lvl]*DAY);t.rv=null}
      else if(t.rv.n>=2){t.sr.lvl=0;t.sr.due=dayStart(Date.now()+DAY);t.rv=null}else t.rv={n:Math.min(t.rv.n,1),c:0}}
    const fut=Object.entries(store.topics).filter(([k,t])=>t&&t.sr&&t.sr.due>Date.now()).sort((a,b)=>a[1].sr.due-b[1].sr.due);
    for(const[k,t]of fut)t.sr.due=schedule(k,IV[t.sr.lvl]||1,t.sr.due);store.rvV=2;ch=true}
  return ch}
const WIN=d=>{if(d<=1)return[0,1];if(d<=3)return[-1,1];const w=Math.max(1,Math.round(d*.15));return[-w,w]};
function dueLoad(skip){const m={};for(const[k,t]of Object.entries(store.topics))if(k!==skip&&t&&t.sr&&t.sr.due>Date.now())m[t.sr.due]=(m[t.sr.due]||0)+1;return m}
function schedule(id,days,target){const load=dueLoad(id),tgt=dayStart(target??(Date.now()+days*DAY)),first=dayStart(Date.now()+DAY),[a,b]=WIN(days);let best=null,bl=1e9,bd=1e9;
  for(let k=a;k<=b;k++){const d=dayStart(tgt+k*DAY+6*3600e3);if(d<first)continue;const l=load[d]||0;if(l<bl||(l===bl&&Math.abs(k)<bd)){best=d;bl=l;bd=Math.abs(k)}}return best??Math.max(tgt,first)}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem('algebra-path')||'null');if(s&&s.topics)store=s}catch(e){}if(norm())saveLocal()}
function saveLocal(){try{localStorage.setItem('algebra-path',JSON.stringify(store))}catch(e){}}
function setSync(s){syncState=s;$('#sync').textContent=s==='cloud'?'Progress saved to your account':s==='error'?'Couldn’t reach your account; saved in this browser':'Progress saved in this browser'}
function persist(){store.updated=Date.now();saveLocal();if(dbRef){clearTimeout(saveT);saveT=setTimeout(flush,1200)}}
async function flush(){if(!dbRef)return;if(saving){dirty=true;return}saving=true;try{await dbRef.set(JSON.parse(JSON.stringify(store)));setSync('cloud')}catch(e){setSync('error')}saving=false;if(dirty){dirty=false;flush()}}
async function initDb(){if(!window.claude||!window.claude.use)return setSync('local');
  try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return setSync('local');const id=await user.id();if(!id)return setSync('local');
    const ref=db.doc('data/users/'+id+'/progress');const snap=await Promise.race([ref.get(),new Promise((_,j)=>setTimeout(()=>j(Error('timeout')),10000))]);dbRef=ref;
    if(snap.exists){const d=snap.data();if(d&&d.topics&&(d.updated||0)>=(store.updated||0)){store=JSON.parse(JSON.stringify(d));const ch=norm();saveLocal();if(ch)flush();if(!boardActive)route();else renderRail()}else if(store.updated)flush()}else if(store.updated)flush();setSync('cloud')}
  catch(e){dbRef=null;setSync('local')}}

/* ---------- progress model ---------- */
const S=id=>store.topics[id];
const lvOf=id=>(S(id)&&S(id).lv)||1;
const isDue=s=>!!(s&&s.sr&&s.sr.due<=Date.now());
function status(s){if(!s||!s.a)return'new';if(isDue(s))return'due';const l5=(s.r||[]).slice(-5),acc=l5.reduce((x,y)=>x+y,0)/(l5.length||1);
  if((s.top||0)>=3&&s.c>=8&&l5.length>=5&&acc>=.8)return'mastered';if(s.sr&&s.sr.lvl>0&&acc>=.6)return'mastered';if(s.a>=4&&s.c/s.a<.6)return'shaky';return'learning'}
const LABEL={new:'Not started',learning:'Learning',shaky:'Needs work',mastered:'Mastered',due:'Review due'};
const dueTopics=()=>TOPICS.filter(t=>isDue(S(t.id)));
function record(id,ok,lv,auto){const s=store.topics[id]||(store.topics[id]={a:0,c:0,r:[],lv:1,str:0,mis:0,top:0});const wasDue=isDue(s);let msg=null;
  s.a++;if(ok)s.c++;s.r=[...(s.r||[]),ok?1:0].slice(-10);s.t=Date.now();store.last=id;if(ok)s.top=Math.max(s.top||0,lv);
  if(auto&&lv===(s.lv||1)){if(ok){s.str=(s.str||0)+1;s.mis=0;if(s.str>=3&&(s.lv||1)<3){s.lv=(s.lv||1)+1;s.str=0;msg=`Level up: you’re now on level ${s.lv} of 3.`}}
    else{s.mis=(s.mis||0)+1;s.str=0;if(s.mis>=2&&(s.lv||1)>1){s.lv--;s.mis=0;msg=`Back to level ${s.lv} to firm things up.`}}}
  if(wasDue){s.rv=s.rv||{n:0,c:0};s.rv.n++;if(ok)s.rv.c++;
    if(ok||s.rv.n>=2){s.sr.lvl=ok?Math.min(s.sr.lvl+1,IV.length-1):0;s.sr.due=schedule(id,IV[s.sr.lvl]);s.rv=null;msg=ok?`Review passed. Next review ${daysTxt(s.sr.due)}.`:`Review missed. This topic comes back ${daysTxt(s.sr.due)}.`}
    else msg='Not quite. You get one more problem on this topic to pass the review.'}
  else if(!s.sr&&status(s)==='mastered'){s.sr={lvl:0,due:schedule(id,1)};const t=byId[id],ts=unitTopics(t.u),nx=ts[ts.indexOf(t)+1];msg=`Mastered. Your first review is due ${daysTxt(s.sr.due)}. `+(nx?`${nx.t} is now unlocked.`:`The ${UNITS[t.u]} checkpoint is now unlocked.`)}
  persist();renderRail();return msg}
function nextTopic(){return TOPICS.find(t=>!isLocked(t)&&!isMast(t.id))||null}
const unitTopics=u=>TOPICS.filter(t=>t.u===u);
const isMast=id=>{const s=S(id);return!!(s&&(s.sr||status(s)==='mastered'))};
const unitOpen=u=>u===0||cpPassed(u-1);
function lockInfo(t){if(!unitOpen(t.u))return{unit:t.u-1};const ts=unitTopics(t.u),i=ts.indexOf(t);if(i>0&&!isMast(ts[i-1].id))return{prev:ts[i-1]};return null}
const isLocked=t=>!!lockInfo(t);
function cpLock(u){if(!unitOpen(u))return{unit:u-1};const left=unitTopics(u).filter(t=>!isMast(t.id));return left.length?{left}:null}
const cpReady=u=>!cpLock(u);
const cpPassed=u=>store.cp[u]&&store.cp[u].best>=CP_PASS;
function dayStart(ms){const d=new Date(ms);d.setHours(0,1,0,0);return d.getTime()}
const daysTxt=ms=>{const d=Math.round((dayStart(ms)-dayStart(Date.now()))/DAY);return d<=0?'today':d===1?'tomorrow':`in ${d} days`};

/* ---------- calendar reminders + backup (website version) ---------- */
function icsText(){const by={};for(const t of TOPICS){const s=S(t.id);if(s&&s.sr){const d=dayStart(s.sr.due);(by[d]=by[d]||[]).push(t.t)}}
  const ds=Object.keys(by).map(Number).sort((a,b)=>a-b).slice(0,25);if(!ds.length)return null;
  const p=n=>String(n).padStart(2,'0'),day=ms=>{const d=new Date(ms);return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const ie=x=>String(x).replace(/[\\;,]/g,m=>'\\'+m);
  const fold=l=>{let o='';while(l.length>73){o+=l.slice(0,73)+'\r\n ';l=l.slice(73)}return o+l};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//luciopuccio.com//Algebra Path//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  for(const d of ds){const n=by[d].length;L.push('BEGIN:VEVENT','UID:algebra-path-'+day(d)+'@luciopuccio.com','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+day(d),'DTEND;VALUE=DATE:'+day(d+DAY+36e5),
    'SUMMARY:'+ie('Algebra Path: '+n+' review'+(n>1?'s':'')+' due'),'DESCRIPTION:'+ie(by[d].join(', ')+'. One problem per topic, with a second try if you miss: https://luciopuccio.com/algebra/#review'),'URL:https://luciopuccio.com/algebra/#review',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('Algebra Path reviews due today'),'TRIGGER:PT9H','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n')+'\r\n'}
function reviewDays(){const by={};for(const t of TOPICS){const s=S(t.id);if(s&&s.sr){const d=dayStart(s.sr.due);(by[d]=by[d]||[]).push(t.t)}}return Object.keys(by).map(Number).sort((a,b)=>a-b).map(d=>({d,ts:by[d]}))}
function gcalUrl(){const r=reviewDays().find(x=>dayStart(x.d)>=dayStart(Date.now()))||reviewDays()[0];if(!r)return null;
  const dt=new Date(r.d),p=n=>String(n).padStart(2,'0'),ymd=dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate()),n=r.ts.length;
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  const q=new URLSearchParams({action:'TEMPLATE',text:`Algebra Path: ${n} review${n>1?'s':''} due`,dates:`${ymd}T090000/${ymd}T091500`,details:`${r.ts.join(', ')}. One problem per topic, with a second try if you miss.\nhttps://luciopuccio.com/algebra/#review`,location:'https://luciopuccio.com/algebra/#review'});if(tz)q.set('ctz',tz);
  return 'https://calendar.google.com/calendar/render?'+q.toString()}
function openGcal(){const u=gcalUrl();if(u)window.open(u,'_blank','noopener')}
function saveFile(name,text,type){try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}}
function downloadIcs(){const t=icsText();if(t)saveFile('algebra-path-reviews.ics',t,'text/calendar')}
function exportProgress(){let ls={};try{ls={lab:JSON.parse(localStorage.getItem('algebra-path-lab')||'null'),words:localStorage.getItem('algebra-path-words'),level:localStorage.getItem('algebra-path-level')}}catch(e){}
  const d=new Date(),p=n=>String(n).padStart(2,'0');saveFile(`algebra-path-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`,JSON.stringify({app:'algebra-path',v:1,exported:d.toISOString(),store,...ls},null,1),'application/json')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ics]');if(a){e.preventDefault();downloadIcs()}const g=e.target.closest('[data-gcal]');if(g){e.preventDefault();openGcal()}});
function bindRemind(){const f=$('#impFile'),m=$('#impMsg');if(!f)return;$('#icsBtn').onclick=downloadIcs;$('#gcalBtn').onclick=openGcal;$('#expBtn').onclick=exportProgress;
  f.onchange=()=>{const file=f.files&&f.files[0];f.value='';if(!file)return;const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(e){}
    if(!d||d.app!=='algebra-path'||!d.store||typeof d.store.topics!=='object'){m.innerHTML='<div class="fb warn"><b>That file isn’t an Algebra Path backup.</b>Choose a file saved with Export progress.</div>';return}
    const when=d.exported?new Date(d.exported).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'an earlier date';
    m.innerHTML=`<div class="impq"><span>Replace the progress in this browser with your backup from ${esc(when)}?</span><span class="actions"><button class="btn primary" id="impYes">Yes, restore it</button><button class="btn ghost" id="impNo">Cancel</button></span></div>`;
    $('#impNo').onclick=()=>{m.innerHTML=''};$('#impYes').onclick=()=>{store=d.store;store.cp=store.cp||{};norm();
      try{if(d.lab)localStorage.setItem('algebra-path-lab',JSON.stringify(d.lab));if(d.words)localStorage.setItem('algebra-path-words',d.words);if(d.level)localStorage.setItem('algebra-path-level',d.level)}catch(e){}
      lab=null;persist();route()}};r.readAsText(file)}}

/* ---------- rail ---------- */
const LOCK='<svg class="lk" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.5"/><path d="M3.5 6V4.2a2.5 2.5 0 0 1 5 0V6"/></svg>';
function renderRail(){const cur=location.hash.slice(1)||'home';const due=dueTopics().length;
  $('#railnav').innerHTML=`<a href="#home" class="${cur==='home'?'on':''}">Overview</a><a href="#lab" class="${cur==='lab'?'on':''}">Graph lab</a><a href="#review" class="${cur==='review'?'on':''}"><span>${due?'Reviews due':'Mixed review'}</span>${due?`<span class="badge">${due}</span>`:''}</a>`;
  let h='';UNITS.forEach((u,i)=>{h+=`<div class="unit"><h4><i>${String(i+1).padStart(2,'0')}</i>${esc(u)}</h4>${UNIT_GUIDES[i]?`<a class="tlink cp ${cur==='guide-'+i?'on':''}" href="#guide-${i}"><span class="gico">?</span>Unit guide</a>`:''}`;
    unitTopics(i).forEach(t=>{const s=S(t.id),lk=isLocked(t);h+=`<a class="tlink ${cur==='t-'+t.id?'on':''}${lk?' locked':''}" href="#t-${t.id}">${lk?LOCK:`<span class="dot ${status(s)}"></span>`}${esc(t.t)}${s&&s.a?`<span class="lvl">L${lvOf(t.id)}</span>`:''}</a>`});
    h+=`<a class="tlink cp ${cur==='cp-'+i?'on':''}${cpReady(i)||cpPassed(i)?'':' locked'}" href="#cp-${i}">${cpReady(i)||cpPassed(i)?`<span class="dot flag ${cpPassed(i)?'pass':''}"></span>`:LOCK}Unit checkpoint${store.cp[i]?`<span class="lvl">${store.cp[i].best}/${CP_N}</span>`:''}</a></div>`});
  $('#units').innerHTML=h}

/* ---------- home ---------- */
function forecastHtml(){const t0=dayStart(Date.now()),days=[...Array(7)].map((_,i)=>dayStart(t0+i*DAY+6*3600e3));const subs=Object.values(store.topics).filter(t=>t&&t.sr);
  const n=days.map((d,i)=>subs.filter(t=>i===0?t.sr.due<days[1]:t.sr.due===d).length),mx=Math.max(1,...n);
  const lab=(d,i)=>i===0?'Today':i===1?'Tomorrow':new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
  return`<div class="panel"><h3>Reviews this week</h3><div class="fc">${days.map((d,i)=>`<div class="fcr${i===0?' now':''}"><span>${lab(d,i)}</span><i class="${n[i]?'':'z'}" style="width:${n[i]?Math.max(6,n[i]/mx*100):100}%"></i><b>${n[i]}</b></div>`).join('')}</div><p>Due dates shift by a day or so to keep busy days light. Each review is one problem per topic.</p></div>`}
function home(){const v=$('#view');const all=TOPICS.map(t=>[t,S(t.id)]);const solved=all.reduce((a,[,s])=>a+(s?s.c:0),0),att=all.reduce((a,[,s])=>a+(s?s.a:0),0);
  const mastered=all.filter(([,s])=>['mastered','due'].includes(status(s))).length;const due=dueTopics();const next=nextTopic();
  const weak=all.filter(([,s])=>status(s)==='shaky').sort((a,b)=>a[1].c/a[1].a-b[1].c/b[1].a);
  const cpU=UNITS.map((_,i)=>i).find(i=>cpReady(i)&&!cpPassed(i));
  const upcoming=all.filter(([,s])=>s&&s.sr&&!isDue(s)).sort((a,b)=>a[1].sr.due-b[1].sr.due).slice(0,4);
  let h=`<section class="hero"><div><div class="eyebrow">Your plan for today</div><h1>${att?'Pick up where you left off':'Start from the ground up'}</h1><p>Work each problem in your notebook, type the final answer, and get it checked. Reviews come first, then new learning, then a checkpoint when a unit is ready.</p></div></section>
  <div class="today">
   ${due.length?`<a class="tcard hot" href="#review"><span class="eyebrow">1 · Reviews due</span><b>${due.length} topic${due.length>1?'s':''} to review</b><span>${esc(due.slice(0,3).map(t=>t.t).join(', '))}${due.length>3?'…':''}. One problem each, mixed together.</span></a>`:`<div class="tcard"><span class="eyebrow">1 · Reviews</span><b>Nothing due</b><span>${upcoming.length?`Next: ${esc(upcoming[0][0].t)} ${daysTxt(upcoming[0][1].sr.due)}.`:'Mastered topics come back for review after 1, 3, 7, 21 and 60 days.'}</span></div>`}
   ${next?`<a class="tcard" href="#t-${next.id}"><span class="eyebrow">2 · ${S(next.id)&&S(next.id).a?'Continue':'Next topic'}</span><b>${esc(next.t)}</b><span>${S(next.id)&&S(next.id).a?`Level ${lvOf(next.id)} of 3 · ${LABEL[status(S(next.id))]}`:esc(UNITS[next.u])}</span></a>`:cpU!==undefined?`<div class="tcard"><span class="eyebrow">2 · Topics</span><b>Unit complete</b><span>Pass the checkpoint to unlock the next unit.</span></div>`:`<div class="tcard"><span class="eyebrow">2 · Topics</span><b>Everything mastered</b><span>Keep up with the scheduled reviews.</span></div>`}
   ${cpU!==undefined?`<a class="tcard" href="#cp-${cpU}"><span class="eyebrow">3 · Checkpoint ready</span><b>${esc(UNITS[cpU])}</b><span>${CP_N} mixed problems; pass with ${CP_PASS}.</span></a>`:`<div class="tcard"><span class="eyebrow">3 · Checkpoint</span><b>Not ready yet</b><span>A unit’s checkpoint opens once you’ve mastered every topic in it. Passing it unlocks the next unit.</span></div>`}
  </div>
  <div class="stats"><div class="stat"><b>${mastered}<small> / ${TOPICS.length}</small></b><span>topics mastered</span></div><div class="stat"><b>${solved}</b><span>problems solved</span></div><div class="stat"><b>${att?Math.round(solved/att*100)+'%':'—'}</b><span>first-try accuracy</span></div><div class="stat"><b>${UNITS.filter((_,i)=>cpPassed(i)).length}<small> / ${UNITS.length}</small></b><span>checkpoints passed</span></div></div>
  <div class="cols"><div class="path">`;let n=0;
  UNITS.forEach((u,i)=>{const ts=unitTopics(i);const m=ts.filter(t=>['mastered','due'].includes(status(S(t.id)))).length;
    h+=`<section class="punit"><header><h3>${String(i+1).padStart(2,'0')} · ${esc(u)}</h3><span>${m}/${ts.length} mastered</span></header>${UNIT_GUIDES[i]?`<a class="prow cpr" href="#guide-${i}"><span class="pn"></span><span class="gico">?</span><span class="pt">Unit guide: which method when</span><span class="pmeta"></span></a>`:''}`;

    try{const{text}=await sampleFn(prompt,{onText:({text})=>{out.textContent=text;an.textContent=''}});
      out.innerHTML=esc(text).replace(/^(Where it went wrong:|Method:|Revise:)\s*$/gm,'<strong>$1</strong>');typeset(out);an.textContent=''}
    catch(e){an.textContent=e&&e.code==='rate_limited'?'Too many reviews in a row. Wait a minute and try again.':e&&e.code==='not_granted'?'The review needs permission to ask Claude. You can allow it from this page’s Permissions menu.':'The review didn’t come through. Try again in a moment.';if(e&&e.code==='not_granted')$('#ai',slot).hidden=true}

/* ---------- graphs in solutions + Graph lab ---------- */
const LABG=[];
function graphBlock(gr){if(!gr)return'';let b='';const svg=graphHTML(gr);if(!gr.nl){LABG.push(gr);b=`<button type="button" class="btn ghost labbtn" data-lab="${LABG.length-1}">Open in Graph lab →</button>`}return`<div class="graph"><div class="eyebrow">Graph</div>${svg}${b}</div>`}
let labSeed=null,lab=null;
function openLab(gr){labSeed={rows:gr.fns.map(f=>f.e).slice(0,5),deg:!!gr.deg,xr:gr._xr||gr.xr||(gr.deg?[0,360]:[-8,8]),yr:gr._yr||null};if(location.hash==='#lab')route();else location.hash='#lab'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lab]');if(b){e.preventDefault();openLab(LABG[+b.dataset.lab])}});
const PRESETS=[
 {n:'Straight line',rows:['mx + c'],p:{m:2,c:1}},
 {n:'Quadratic: completed square',rows:['a(x - p)^2 + q'],p:{a:1,p:2,q:-3}},
 {n:'Quadratic: roots',rows:['a(x - r)(x - s)'],p:{a:1,r:-1,s:3}},
 {n:'Line meets curve',rows:['x^2 - 4','mx + c'],p:{m:1,c:2}},
 {n:'Transformations',rows:['x^2','a(x - h)^2 + k'],p:{a:1,h:2,k:1}},
 {n:'Cubic',rows:['(x - a)(x - b)(x - c)'],p:{a:-2,b:1,c:3}},
 {n:'Exponential',rows:['a*b^x'],p:{a:1,b:2},xr:[-4,5]},
 {n:'Inverse functions',rows:['2x + 3','(x - 3)/2','x']},
 {n:'Trig wave',rows:['a sin(bx + c) + d'],p:{a:2,b:1,c:0,d:0},deg:true},
 {n:'sin, cos and tan',rows:['sin(x)','cos(x)','tan(x)'],deg:true,yr:[-3,3]},
];
const labDefault=()=>({rows:['x^2 - 2x - 3','x + 1'],p:{},deg:false,keys:true,xr:[-8,8],yr:[-16/3,16/3]});
const labX=d=>d?[-30,390]:[-8,8];
const labY=()=>{if(lab.deg)return null;const h=(lab.xr[1]-lab.xr[0])*480/720/2;return[-h,h]};
function loadLab(){try{const s=JSON.parse(localStorage.getItem('algebra-path-lab')||'null');if(s&&Array.isArray(s.rows))return{...labDefault(),...s}}catch(e){}return labDefault()}
function saveLab(){try{localStorage.setItem('algebra-path-lab',JSON.stringify(lab))}catch(e){}}
function labParams(){const set=new Set();for(const r of lab.rows){try{for(const t of tokenize(clean(r)))if(/^[a-zA-Z]$/.test(t)&&t!=='x'&&t!=='y'&&t!=='e')set.add(t)}catch(e){}}return[...set].sort()}
function labPage(){lab=lab||loadLab();if(labSeed){lab={...labDefault(),...labSeed,p:{},keys:lab.keys};labSeed=null;saveLab()}
  const v=$('#view');
  v.innerHTML=`<header class="thead"><div><div class="eyebrow">Tool</div><h1>Graph lab</h1></div><div class="tmeta">Type equations in x. Any other letter becomes a slider.</div></header>
  <div class="labgrid"><div class="labside panel">
    <div id="rows" class="sliders"></div>
    <div><button class="btn" id="addRow">+ Add equation</button></div>
    <div id="sliders" class="sliders"></div>
    <div class="labopts"><div class="seg" role="group" aria-label="Angle units" id="angSeg"><button data-d="0">Radians</button><button data-d="1">Degrees</button></div>
      <label class="chk"><input type="checkbox" id="keys"> Mark roots, turning points and crossings</label></div>
    <div><div class="eyebrow">Try a preset</div><div class="presets">${PRESETS.map((p,i)=>`<button type="button" class="chip" data-preset="${i}">${esc(p.n)}</button>`).join('')}</div></div>
    <p class="note">Use <code>^</code> for powers, <code>sqrt()</code>, <code>sin()</code>, <code>cos()</code>, <code>tan()</code>, <code>log()</code> and <code>ln()</code>. Trig uses the angle units chosen above.</p>
  </div>
  <div class="labplot"><div class="lbar"><div class="ctrls"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zfit">Fit</button><button class="btn" id="zreset">Reset view</button></div><span class="note" id="readout">Drag to pan · scroll to zoom</span></div>
    <div id="labsvg" class="labsvg"></div><div id="keylist" class="keylist"></div></div></div>`;
  renderRows();renderSliders();syncOpts();drawLab();
  $('#rows').addEventListener('input',e=>{const i=e.target.dataset.i;if(i===undefined)return;lab.rows[+i]=e.target.value;if(labParams().join(',')!==$('#sliders').dataset.k)renderSliders();drawLab()});
  $('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;lab.rows.splice(+b.dataset.rm,1);if(!lab.rows.length)lab.rows.push('');renderRows();renderSliders();drawLab()});
  $('#addRow').onclick=()=>{if(lab.rows.length>=5)return;lab.rows.push('');renderRows();$('#eq'+(lab.rows.length-1)).focus()};
  $('#sliders').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const val=parseFloat(e.target.value);if(!isFinite(val))return;lab.p[k]=val;const o=e.target.type==='range'?$('#n_'+k):$('#s_'+k);if(o)o.value=val;drawLab()});
  v.querySelectorAll('#angSeg button').forEach(b=>b.onclick=()=>{lab.deg=b.dataset.d==='1';lab.xr=labX(lab.deg);lab.yr=labY();syncOpts();drawLab()});
  $('#keys').onchange=e=>{lab.keys=e.target.checked;drawLab()};
  v.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.preset];lab.rows=[...p.rows];lab.p={...(p.p||{})};lab.deg=!!p.deg;lab.xr=p.xr||labX(lab.deg);lab.yr=p.yr||labY();renderRows();renderSliders();syncOpts();drawLab()});
  const zoom=k=>{const cx=(lab.xr[0]+lab.xr[1])/2,cy=(lab.yr[0]+lab.yr[1])/2,hx=(lab.xr[1]-lab.xr[0])/2*k,hy=(lab.yr[1]-lab.yr[0])/2*k;lab.xr=[cx-hx,cx+hx];lab.yr=[cy-hy,cy+hy];drawLab()};
  $('#zin').onclick=()=>zoom(1/1.4);$('#zout').onclick=()=>zoom(1.4);$('#zfit').onclick=()=>{lab.yr=null;drawLab()};$('#zreset').onclick=()=>{lab.xr=labX(lab.deg);lab.yr=labY();drawLab()};
  const box=$('#labsvg');let drag=null,raf=0;const redraw=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;drawLab()})};
  const at=e=>{const r=box.querySelector('svg').getBoundingClientRect();const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;return{x:lab.xr[0]+fx*(lab.xr[1]-lab.xr[0]),y:lab.yr[1]-fy*(lab.yr[1]-lab.yr[0]),r}};
  box.addEventListener('pointerdown',e=>{if(!lab.yr||!box.querySelector('svg'))return;const p=at(e);drag={sx:e.clientX,sy:e.clientY,xr:[...lab.xr],yr:[...lab.yr],w:p.r.width,h:p.r.height};try{box.setPointerCapture(e.pointerId)}catch(x){}});
  box.addEventListener('pointermove',e=>{if(drag){const dx=(e.clientX-drag.sx)/drag.w*(drag.xr[1]-drag.xr[0]),dy=(e.clientY-drag.sy)/drag.h*(drag.yr[1]-drag.yr[0]);lab.xr=[drag.xr[0]-dx,drag.xr[1]-dx];lab.yr=[drag.yr[0]+dy,drag.yr[1]+dy];redraw()}
    else if(lab.yr&&box.querySelector('svg')){const p=at(e);$('#readout').textContent=`x = ${fmtP(p.x)}${lab.deg?'°':''}, y = ${fmtP(p.y)}`}});
  const end=()=>{drag=null};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',e=>{if(!lab.yr||!box.querySelector('svg'))return;e.preventDefault();const p=at(e),k=e.deltaY>0?1.15:1/1.15;lab.xr=[p.x-(p.x-lab.xr[0])*k,p.x+(lab.xr[1]-p.x)*k];lab.yr=[p.y-(p.y-lab.yr[0])*k,p.y+(lab.yr[1]-p.y)*k];redraw()},{passive:false})}
function syncOpts(){document.querySelectorAll('#angSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.d==='1')===!!lab.deg));const k=$('#keys');if(k)k.checked=!!lab.keys}
function renderRows(){$('#rows').innerHTML=`<div class="eyebrow">Equations</div>`+lab.rows.map((e,i)=>`<div class="lrow"><span class="sw c${i}"></span><label for="eq${i}">y =</label><input id="eq${i}" data-i="${i}" value="${esc(e)}" spellcheck="false" autocomplete="off" placeholder="e.g. x^2 - 4"><button type="button" class="xbtn" data-rm="${i}" aria-label="Remove equation ${i+1}">×</button></div><div class="rerr" id="err${i}"></div>`).join('');const a=$('#addRow');if(a)a.disabled=lab.rows.length>=5}
function renderSliders(){const P=labParams();const el=$('#sliders');el.dataset.k=P.join(',');
  el.innerHTML=P.length?`<div class="eyebrow">Sliders</div>`+P.map(k=>{const v=lab.p[k]??1;return`<div class="sl"><label for="s_${k}">${k}</label><input type="range" id="s_${k}" data-k="${k}" min="-10" max="10" step="0.1" value="${v}"><input type="number" class="pnum" id="n_${k}" data-k="${k}" step="0.1" value="${v}" aria-label="Value of ${k}"></div>`}).join(''):'<p class="note">Add a letter such as <code>a</code> or <code>m</code> to an equation to get a slider for it.</p>'}
function drawLab(){if(!$('#labsvg'))return;const P=labParams(),env={};for(const k of P)env[k]=lab.p[k]??1;
  const fns=[];lab.rows.forEach((e,i)=>{let ok=true,fn=null;if(e.trim()){try{fn=compile(e,{deg:lab.deg});fn({...env,x:1,e:Math.E})}catch(x){ok=false}}
    const err=$('#err'+i);if(err)err.textContent=ok?'':'Can’t read this yet. Check brackets and use ^ for powers.';const inp=$('#eq'+i);if(inp)inp.classList.toggle('bad',!ok);if(ok&&e.trim())fns.push({e,c:i,fn})});
  const sp={fns:fns.map(f=>({e:f.e,c:f.c,l:'y = '+f.e})),deg:lab.deg,xr:lab.xr,yr:lab.yr,env,pts:[],alt:'Graph of '+fns.map(f=>'y = '+f.e).join(', ')};
  const rows=[];
  if(lab.keys&&fns.length){const E={...env,e:Math.E};const L=fns.slice(0,5);
    for(const f of L){const k=keyPts(f.fn,{...E},lab.xr[0],lab.xr[1]);const parts=[];
      if(k.roots.length){parts.push((k.roots.length>1?'roots x = ':'root x = ')+k.roots.slice(0,8).map(fmtP).join(', '));k.roots.slice(0,12).forEach(r=>sp.pts.push([r,0,false,`root (${fmtP(r)}, 0)`,f.c]))}
      if(k.turns.length){parts.push((k.turns.length>1?'turning points ':'turning point ')+k.turns.slice(0,6).map(t=>`(${fmtP(t[0])}, ${fmtP(t[1])})`).join(', '));k.turns.slice(0,12).forEach(t=>sp.pts.push([t[0],t[1],false,`turning point (${fmtP(t[0])}, ${fmtP(t[1])})`,f.c]))}
      if(lab.xr[0]<=0&&lab.xr[1]>=0){E.x=0;const y=f.fn(E);if(isFinite(y)){parts.push(`y-intercept (0, ${fmtP(y)})`);sp.pts.push([0,y,false,`y-intercept (0, ${fmtP(y)})`,f.c])}}
      rows.push(`<div class="krow"><span class="sw c${f.c}"></span><span><b>y = ${esc(f.e)}</b>${parts.length?': '+esc(parts.join(' · ')):': no roots or turning points in view'}</span></div>`)}
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const A=L[i],B=L[j];const k=keyPts(en=>A.fn(en)-B.fn(en),{...E},lab.xr[0],lab.xr[1]);if(!k.roots.length)continue;
      const ps=k.roots.slice(0,8).map(r=>{E.x=r;return[r,A.fn(E)]});ps.forEach(p=>sp.pts.push([p[0],p[1],false,`crossing (${fmtP(p[0])}, ${fmtP(p[1])})`,A.c]));
      rows.push(`<div class="krow"><span class="sw c${A.c}"></span><span class="sw c${B.c}"></span><span>Cross at ${ps.map(p=>`(${fmtP(p[0])}, ${fmtP(p[1])})`).join(', ')}</span></div>`)}}
  $('#labsvg').innerHTML=fns.length?plotSVG(sp,{W:600,H:400,noLegend:true,r:5}):plotSVG({fns:[],xr:lab.xr,yr:lab.yr||[-6,6],deg:lab.deg},{W:600,H:400});
  lab.yr=sp._yr||lab.yr||[-6,6];$('#keylist').innerHTML=rows.join('');saveLab()}

function route(){const h=location.hash.slice(1);boardActive=false;renderRail();$('#rail').classList.remove('open');$('#railToggle').setAttribute('aria-expanded','false');
  if(h.startsWith('t-')&&byId[h.slice(2)])topicPage(byId[h.slice(2)]);else if(h==='review')reviewPage();else if(/^cp-\d+$/.test(h)&&UNITS[+h.slice(3)])cpPage(+h.slice(3));else if(h==='learn')return;else if(/^guide-\d+$/.test(h)&&UNIT_GUIDES[+h.slice(6)])guidePage(+h.slice(6));else if(/^lesson-[a-z0-9]+$/.test(h)&&LEARN[h.slice(7)]&&byId[h.slice(7)])learnPage(h.slice(7));else if(h==='lab')labPage();else home();addBack();try{window.scrollTo(0,0)}catch(e){}}
function addBack(){const v=$('#view');if(v.querySelector('.hero')||v.querySelector('.back'))return;v.insertAdjacentHTML('afterbegin','<a class="back" href="#home"><span aria-hidden="true">←</span> Back to overview</a>')}
$('#railToggle').onclick=()=>{const o=$('#rail').classList.toggle('open');$('#railToggle').setAttribute('aria-expanded',o)};
window.addEventListener('hashchange',()=>{if(location.hash!=='#learn')route()});
loadLocal();setSync('local');route();initDb();
if(window.claude&&window.claude.use)claude.use('sample').then(s=>{if(s){sampleFn=s;document.querySelectorAll('#ai').forEach(a=>{if(!a.closest('.board')||!/Checkpoint/.test(a.closest('.board').querySelector('.eyebrow').textContent))a.hidden=false})}}).catch(()=>{});
}

</script>
